<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch Pad</title>
<link rel="manifest" href="scratch.webmanifest">
<meta name="theme-color" content="#2F6F5E">
<link rel="icon" type="image/png" href="icons/scratch-192.png">
<link rel="apple-touch-icon" href="icons/scratch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scratch">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --bg: #EEF2F7; --bg-grid: #E0E7F1; --surface: #FFFFFF; --surface-2: #F6F8FB; --sunken: #E9EEF5;
  --border: #D4DCE8; --border-strong: #B9C5D6;
  --ink: #18202F; --ink-soft: #465169; --ink-faint: #67728A;
  --accent: #C24E1A; --accent-hover: #A8410F; --accent-ink: #FFFFFF; --accent-soft: #FBE7DC; --accent-soft-border: #EFC3A7;
  --good: #1B7A55; --good-soft: #DDF1E7; --good-border: #9FD3BB;
  --warn: #8A5D00; --warn-soft: #FBF0D6; --warn-border: #E7CB86;
  --bad: #B3261E; --bad-soft: #FBE3E1; --bad-border: #EDB1AC;
  --break: #2E6DB4; --break-soft: #DDEAF8;
  --shadow: 0 1px 2px rgba(24,32,47,.06), 0 4px 14px rgba(24,32,47,.05);
  --focus: #C24E1A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F15; --bg-grid: #141924; --surface: #141923; --surface-2: #10141C; --sunken: #0E121A;
    --border: #252D3B; --border-strong: #354055;
    --ink: #E8ECF3; --ink-soft: #AAB4C6; --ink-faint: #8792A6;
    --accent: #F0844C; --accent-hover: #F59B6A; --accent-ink: #1A0E05; --accent-soft: #2B1A10; --accent-soft-border: #4C301C;
    --good: #52C495; --good-soft: #11261D; --good-border: #24543F;
    --warn: #E6B85A; --warn-soft: #2A2110; --warn-border: #574320;
    --bad: #F28B82; --bad-soft: #2E1514; --bad-border: #5C2B28;
    --break: #7FB3EE; --break-soft: #13233A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    --focus: #F0844C;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F15; --bg-grid: #141924; --surface: #141923; --surface-2: #10141C; --sunken: #0E121A;
  --border: #252D3B; --border-strong: #354055;
  --ink: #E8ECF3; --ink-soft: #AAB4C6; --ink-faint: #8792A6;
  --accent: #F0844C; --accent-hover: #F59B6A; --accent-ink: #1A0E05; --accent-soft: #2B1A10; --accent-soft-border: #4C301C;
  --good: #52C495; --good-soft: #11261D; --good-border: #24543F;
  --warn: #E6B85A; --warn-soft: #2A2110; --warn-border: #574320;
  --bad: #F28B82; --bad-soft: #2E1514; --bad-border: #5C2B28;
  --break: #7FB3EE; --break-soft: #13233A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  --focus: #F0844C;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: "IBM Plex Serif", Georgia, serif; margin: 0; text-wrap: balance; line-height: 1.2; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- math ---------- */
.m { font-family: "IBM Plex Serif", "Cambria Math", Georgia, serif; font-size: 1.06em; white-space: nowrap; }
.m i, .pv i, .fb i { font-style: italic; }
.fn { font-style: normal; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; margin: 0 .12em; line-height: 1.15; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .2em .05em; }
.frac > span:last-child { padding: .05em .2em 0; }
.ov { border-top: 1px solid currentColor; padding: 0 .1em; margin-left: .05em; }
sup { font-size: .72em; line-height: 0; }
sup sup { font-size: .85em; }
.is { font-size: 1.45em; line-height: 1; vertical-align: -.18em; margin-right: .08em; font-weight: 300; }
.sg { font-size: 1.25em; line-height: 1; }
.intl { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin-right: .15em; line-height: 1; }
.intl .ib, .intl .ia { font-size: .66em; line-height: 1.2; }
.intl .is { vertical-align: 0; margin: 0; }

/* ---------- app frame ---------- */
.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--border); padding: 20px 14px 40px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: "IBM Plex Serif", Georgia, serif; font-size: 19px; font-weight: 600; }
.brand span { font-size: 12.5px; color: var(--ink-faint); }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-main a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; font-weight: 500; color: var(--ink-soft);
}
.nav-main a:hover { background: var(--surface-2); color: var(--ink); }
.nav-main a.on { background: var(--accent-soft); color: var(--ink); }
.badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
.nav-phase { display: flex; flex-direction: column; gap: 1px; }
.nav-ph { padding: 4px 10px 6px; display: flex; flex-direction: column; }
.nav-ph b { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.nav-ph span { font-size: 12.5px; color: var(--ink-soft); }
.nav-s {
  display: grid; grid-template-columns: 10px 36px 1fr auto; align-items: center; gap: 6px; padding: 6px 10px;
  border-radius: 7px; text-decoration: none; font-size: 13.5px; color: var(--ink-soft);
}
.nav-s:hover { background: var(--surface-2); color: var(--ink); }
.nav-s.on { background: var(--sunken); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.nav-s .sid { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.nav-s .stt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-s .sd { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: transparent; }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.active { border-color: var(--accent); background: var(--accent-soft); }
.dot.behind { border-color: var(--warn); background: var(--warn-soft); }
.dot.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 28px; background: var(--bg); /* solid: the frosted see-through look made the page under it look blurry */
  border-bottom: 1px solid var(--border);
}
.icon-btn.menu-btn { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft); white-space: nowrap; text-decoration: none;
}
.chip b { color: var(--ink); font-weight: 600; }
.chip.hot { background: var(--accent-soft); border-color: var(--accent-soft-border); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.spacer { flex: 1; }
.timer { display: inline-flex; align-items: center; gap: 0; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.timer button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.timer button:hover { background: var(--surface-2); }
.timer .tm { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.focus { border-color: var(--accent); background: var(--accent-soft); }
.timer.break { border-color: var(--break); background: var(--break-soft); }
.timer .sep { width: 1px; align-self: stretch; background: var(--border); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }

.page { width: 100%; max-width: 820px; margin: 0 auto; padding: 32px 28px 120px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.page h1 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 600; }
.lede { color: var(--ink-soft); font-size: 15.5px; max-width: 64ch; margin: 6px 0 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
.card h2 { font-size: 18px; font-weight: 600; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.muted { color: var(--ink-faint); font-size: 13.5px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink-soft); cursor: pointer; font-size: 13.5px; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.link-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* ---------- today ---------- */
.next { border: 1px solid var(--accent-soft-border); background: linear-gradient(var(--accent-soft), var(--surface) 70%); }
.next .big { font-family: "IBM Plex Serif", Georgia, serif; font-size: 24px; font-weight: 600; margin: 6px 0 4px; }
.next .where { color: var(--ink-soft); margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.count { font-family: "IBM Plex Mono", monospace; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.hw-list li { display: grid; grid-template-columns: 22px 44px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 6px; font-size: 14px; }
.hw-list li.done .hw-t { color: var(--ink-faint); text-decoration: line-through; }
.hw-list .hw-id { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; }
.hw-list a { font-size: 12px; color: var(--ink-faint); text-decoration: none; font-family: "IBM Plex Mono", monospace; }
.hw-list a:hover { color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border: 1px solid var(--border); border-radius: 9px; padding: 8px 6px; text-align: center; background: var(--surface-2); text-decoration: none; min-height: 74px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.wd .wdn { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-family: "IBM Plex Mono", monospace; }
.wd .wdd { font-size: 15px; font-weight: 600; }
.wd .wds { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; }
.wd.is-today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface); }
.wds.done { background: var(--good-soft); color: var(--good); }
.wds.todo { background: var(--sunken); color: var(--ink-soft); }
.wds.behind { background: var(--warn-soft); color: var(--warn); }
.streak { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.streak span { width: 16px; height: 16px; border-radius: 4px; background: var(--sunken); border: 1px solid var(--border); }
.streak span.on { background: var(--good); border-color: var(--good); }
.streak span.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.tip { font-size: 13.5px; color: var(--ink-soft); }
.tip summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.tip ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }

/* ---------- plan ---------- */
.phase-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.phase-h h2 { font-size: 21px; }
.blk { display: flex; flex-direction: column; gap: 8px; }
.blk-h { font-weight: 600; font-size: 15px; margin-top: 4px; }
.blk-g { font-size: 13.5px; color: var(--ink-soft); max-width: 66ch; margin: 0 0 4px; }
.prow {
  display: grid; grid-template-columns: 12px 42px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-decoration: none;
}
.prow:hover { border-color: var(--border-strong); }
.prow .sid { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; color: var(--ink-faint); }
.prow .pt { font-weight: 500; }
.prow .pd { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-faint); white-space: nowrap; }
.tag.ok { color: var(--good); border-color: var(--good-border); background: var(--good-soft); }
.tag.star { color: var(--accent); border-color: var(--accent-soft-border); background: var(--accent-soft); }

/* ---------- session ---------- */
.crumb { font-size: 13px; color: var(--ink-faint); }
.crumb a { color: inherit; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: var(--topH, 55px); z-index: 10; background: var(--bg); padding-top: 4px; }
.tab {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent;
  margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; font-size: 14px;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab .tc { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--sunken); color: var(--ink-faint); }
.tab .tc.full { background: var(--good-soft); color: var(--good); }

.parts { display: flex; flex-direction: column; gap: 10px; }
.part { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.part.open { box-shadow: var(--shadow); border-color: var(--border-strong); }
.part-h { width: 100%; border: 0; background: none; padding: 14px 18px; display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; cursor: pointer; text-align: left; }
.part-h .pn { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border-strong); color: var(--ink-faint); }
.part.read .pn { background: var(--good); border-color: var(--good); color: #fff; }
.part-h .ptl { font-weight: 600; font-size: 15.5px; }
.part-h .chev { color: var(--ink-faint); transition: transform .2s; }
.part.open .chev { transform: rotate(90deg); }
.part-b { padding: 0 22px 20px 56px; font-size: 15.5px; line-height: 1.7; }
.part-b p { margin: 0 0 12px; max-width: 64ch; }
.part-f { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.rule { border: 1px solid var(--accent-soft-border); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 12px 0; line-height: 1.8; }
.steps { margin: 8px 0 12px; padding-left: 22px; display: grid; gap: 6px; }
.steps li { padding-left: 4px; }
.steps li::marker { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.tbl-wrap { overflow-x: auto; margin: 10px 0 14px; border: 1px solid var(--border); border-radius: 10px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-weight: 600; background: var(--surface-2); }
.tbl th, .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- problems ---------- */
.prob-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.pdots { display: flex; gap: 6px; flex-wrap: wrap; }
.pdot { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.pdot.cur { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.pdot.correct { background: var(--good); border-color: var(--good); color: #fff; }
.pdot.almost { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pdot.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.prob { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); transition: border-color .25s; }
.prob.correct { border-color: var(--good); }
.prob.almost { border-color: var(--warn); }
.prob.wrong { border-color: var(--bad-border); }
.prob-q { display: flex; gap: 12px; align-items: baseline; font-size: 17px; line-height: 1.9; }
.prob-q .qn { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); font-weight: 600; flex: none; }
.ans-row { display: flex; gap: 8px; }
.ans, .calc-in {
  flex: 1; min-width: 0; font-family: "IBM Plex Mono", monospace; font-size: 16px; padding: 10px 12px; border-radius: 9px;
  border: 1.5px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
}
.ans:focus, .calc-in:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.pv { min-height: 26px; font-size: 14px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv .m { color: var(--ink); font-size: 1.15em; }
.pv.err { color: var(--warn); }
.fb { border-radius: 9px; padding: 10px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; }
.fb.correct { background: var(--good-soft); color: var(--good); border: 1px solid var(--good-border); }
.fb.almost { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-border); }
.fb.wrong, .fb.error { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
.fb b { font-weight: 600; }

select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
