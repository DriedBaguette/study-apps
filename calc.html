{ id: "B5", block: "B", date: "2026-10-15", title: "Working with integrals", test: "Problem set",
  topics: ["Even and odd function shortcuts", "Average value of a function", "Mean Value Theorem for integrals"],
  links: [["Paul: Computing Definite Integrals (even/odd section)", P1 + "ComputingDefiniteIntegrals.aspx"], ["Paul: Average Function Value", P1 + "AvgFcnValue.aspx"]],
  parts: [
    { t: "Symmetry shortcuts", h: tbl(["Type", "Test", "Shortcut on [−a, a]"], [["Even (mirror across the y-axis)", "f(−x) = f(x), e.g. " + M("x^2") + ", cos x", "2 × the integral from 0 to a"], ["Odd (rotates onto itself)", "f(−x) = −f(x), e.g. " + M("x^3") + ", sin x", "= 0, because the halves cancel"]]) + "<p>Only works when the limits are symmetric, like −3 to 3.</p>" },
    { t: "Average value", h: rule('<span class="m">avg = <span class="frac"><span>1</span><span><i>b</i> − <i>a</i></span></span></span>' + DI("a", "b", "f").replace("<i>f</i>", "<i>f</i>(<i>x</i>)")) + "<p>Total area ÷ width = the height of a rectangle with the same area.</p><p>Average of " + M("x^2") + " on [0, 3]: (1/3)·(27/3) = (1/3)·9 = 3.</p>" },
    { t: "Mean Value Theorem for integrals", h: "<p>Somewhere in [a, b], the function actually equals its average. To find that spot c, set f(c) = average and solve.</p><p>For " + M("x^2") + " on [0, 3]: " + M("x^2") + " = 3 → c = √3.</p>" },
    { t: "Symmetry with numbers you’re given", h: "<p>The homework often doesn’t give a formula. It says the function is even or odd and gives you a few integrals.</p>" +
      tbl(["If f is", "Then", "So"], [["even", DIH("-a", "0", FX) + " = " + DIH("0", "a", FX), DIH("-a", "a", FX) + " = 2" + DIH("0", "a", FX)], ["odd", DIH("-a", "0", FX) + " = −" + DIH("0", "a", FX), DIH("-a", "a", FX) + " = 0"]]) +
      "<p><b>Example.</b> f is odd and " + DIH("-4", "10", FX) + " = 7. Split at 4: " + DIH("-4", "4", FX) + " + " + DIH("4", "10", FX) + " = 7. The first piece is 0, so " + DIH("4", "10", FX) + " = 7.</p>" +
      "<p><b>Example.</b> f is even, " + DIH("0", "5", FX) + " = 3 and " + DIH("5", "8", FX) + " = 1. Then " + DIH("-5", "8", FX) + " = " + DIH("-5", "0", FX) + " + " + DIH("0", "5", FX) + " + " + DIH("5", "8", FX) + " = 3 + 3 + 1 = 7.</p>" },
    { t: "Average value, backward and between zeros", h: "<p>Average = integral ÷ width, so integral = average × width.</p>" +
      "<p><b>Example.</b> The average of f on [1, 5] is 3, so " + DIH("1", "5", FX) + " = 3 × 4 = 12. Then " + DIH("1", "5", "(2" + FX + " + 7)") + " = 2(12) + 7(4) = 52.</p>" +
      "<p><b>“Between its zeros”</b> means: solve f(x) = 0 first, and use those x-values as the interval. For " + M("6x - x^2") + " = x(6 − x) the zeros are 0 and 6.</p>" }
  ],
  probs: [
    { k: "di", a: "-5", b: "5", q: "x^7", type: "number", ans: "0", hint: "Is " + M("x^7") + " even or odd?", sol: ["Odd function on symmetric limits → 0"] },
    { k: "di", a: "-2", b: "2", q: "x^2 + 1", type: "number", ans: "28/3", hint: "Even, so double the 0–2 integral.", sol: [DI("0", "2", "x^2 + 1") + " = 8/3 + 2 = 14/3", "×2 = 28/3"] },
    { k: "di", a: "-pi", b: "pi", q: "sin(x)", type: "number", ans: "0", hint: "sin is odd.", sol: ["Odd on symmetric limits → 0"] },
    { k: "txt", text: "Average value of " + M("2x") + " on [0, 4].", type: "number", ans: "4", hint: "(1/4) × " + DI("0", "4", "2x"), sol: [DI("0", "4", "2x") + " = 16", "16/4 = 4"] },
    { k: "txt", text: "Average value of " + M("x^2") + " on [0, 6].", type: "number", ans: "12", hint: DI("0", "6", "x^2") + " = 72", sol: ["72/6 = 12"] },
    { k: "txt", text: "The average of " + M("x^2") + " on [0, 3] is 3. Find c in [0, 3] with " + M("x^2") + " = 3 at x = c.", type: "number", ans: "sqrt(3)", hint: "Type sqrt(3).", sol: ["c² = 3, c = √3 ≈ 1.732"] },
    { k: "txt", text: "f is even and " + DIH("0", "3", FX) + " = 5. Find " + DIH("-3", "3", FX) + ".", type: "number", ans: "10", hint: "Even: the left half equals the right half.", sol: ["2 × 5 = 10"] },
    { k: "txt", text: "f is even, " + DIH("0", "4", FX) + " = 3 and " + DIH("4", "9", FX) + " = 2. Find " + DIH("-4", "9", "5" + FX) + ".", type: "number", ans: "40", hint: "Split −4 to 9 into −4 to 0, 0 to 4, and 4 to 9.", sol: [DIH("-4", "9", FX) + " = 3 + 3 + 2 = 8", "5 × 8 = 40"] },
    { k: "txt", text: "f is odd and " + DIH("-2", "7", FX) + " = 9. Find " + DIH("2", "7", FX) + ".", type: "number", ans: "9", hint: "Split at 2. The piece from −2 to 2 is 0 for an odd function.", sol: [DIH("-2", "2", FX) + " + " + DIH("2", "7", FX) + " = 9", "0 + " + DIH("2", "7", FX) + " = 9, so it’s 9"] },
    { k: "txt", text: "The average value of f on [1, 6] is 4. Find " + DIH("1", "6", "(3" + FX + " + 2)") + ".", type: "number", ans: "70", hint: "Integral = average × width = 4 × 5.", sol: [DIH("1", "6", FX) + " = 4 × 5 = 20", "3(20) + 2(5) = 70"] },
    { k: "txt", text: "Find the average value of " + M("4sqrt(x) - x") + " between its two zeros.", type: "number", ans: "8/3", hint: "Solve " + M("4sqrt(x)") + " = x. Square both sides: 16x = x².", sol: ["Zeros: 16x = x², so x = 0 and x = 16", DI("0", "16", "4x^(1/2) - x") + " = " + M("(8/3)x^(3/2) - x^2/2") + " from 0 to 16 = 512/3 − 128 = 128/3", "Average: (128/3) ÷ 16 = 8/3"] },
    { k: "txt", text: "Find the average value of " + M("6/x") + " on [1, e]. Type e for Euler’s number.", type: "number", ans: "6/(e - 1)", hint: II("6/x") + " = 6 ln x, and ln e = 1.", sol: [DI("1", "e", "6/x") + " = 6(ln e − ln 1) = 6", "Width: e − 1", "Average: 6/(e − 1)"] }
  ]
},
/* ================= B6 ================= */
{ id: "B6", block: "B", date: "2026-10-16", title: "u-Substitution", test: "Problem set", star: true,
  topics: ["Spotting the chain rule in reverse", "The 5-step recipe", "Fixing constants"],
  links: [["Paul: Substitution Rule", P1 + "SubstitutionRuleIndefinite.aspx"], ["Paul: More Substitution Rule", P1 + "SubstitutionRuleIndefinitePtII.aspx"]],
  parts: [
    { t: "The idea", h: "<p>Look for <b>a function and its derivative</b> both sitting in the integral. In " + II("2x(x^2 + 1)^5") + ", the inside " + M("x^2 + 1") + " has derivative " + M("2x") + ", which is right there.</p>" },
    { t: "The recipe", h: steps(["<b>Pick u:</b> usually the inside of something (inside a power, a root, e^( ), sin( ), ln( )).", "<b>Find du:</b> " + '<span class="m"><i>du</i> = <i>u</i>′ <i>dx</i></span>', "<b>Rewrite everything in u.</b> No x’s left.", "<b>Integrate</b> in u.", "<b>Put x back.</b>"]) },
    { t: "Worked example", h: "<p>" + II("2x(x^2 + 1)^5") + "</p>" + steps(['<span class="m"><i>u</i> = <i>x</i><sup>2</sup> + 1</span>', '<span class="m"><i>du</i> = 2<i>x</i> <i>dx</i></span>', '<span class="m">∫ <i>u</i><sup>5</sup> <i>du</i></span>', '<span class="m"><i>u</i><sup>6</sup>/6 + <i>C</i></span>', M("(x^2 + 1)^6/6 + C")]) },
    { t: "Fixing constants", h: "<p>" + II("x cos(x^2)") + "</p>" + steps(['<span class="m"><i>u</i> = <i>x</i><sup>2</sup></span>, <span class="m"><i>du</i> = 2<i>x</i> <i>dx</i></span>', "But only <i>x dx</i> is in the integral, so <span class=\"m\"><i>x dx</i> = <i>du</i>/2</span>", '<span class="m">½ ∫ cos <i>u</i> <i>du</i> = ½ sin <i>u</i> + <i>C</i></span>', M("(1/2)sin(x^2) + C")]) + rule("You can fix a missing <b>number</b>, but not a missing <b>x</b>.") },
    { t: "Quick patterns", h: tbl(["Integral", "u", "Answer"], [[II("e^(3x)"), M("3x"), M("e^(3x)/3 + C")], [II("3x^2/(x^3 + 4)"), M("x^3 + 4"), M("ln|x^3 + 4| + C")], [II("sin(5x)"), M("5x"), M("-cos(5x)/5 + C")]]) },
    { t: "When the answer is arctan or arcsin", h: "<p>Two more entries for the reverse table:</p>" +
      tbl(["Integral", "Answer"], [[II("1/(1 + x^2)"), M("arctan(x) + C")], [II("1/sqrt(1 - x^2)"), M("arcsin(x) + C")]]) +
      "<p>They often show up after a substitution. If you see <i>x</i><sup>4</sup> or <i>x</i><sup>6</sup> next to a 1, try making it <i>u</i><sup>2</sup>:</p>" +
      steps([II("x^3/(x^8 + 1)") + ": let u = x⁴, du = 4x³ dx, so x³ dx = du/4", "(1/4)∫ 1/(u² + 1) du = (1/4) arctan u", "= " + M("(1/4)arctan(x^4) + C")]) +
      "<p><b>Split first</b> when the top has two terms: " + M("(6x - 2)/(x^2 + 1)") + " = " + M("6x/(x^2 + 1)") + " − " + M("2/(x^2 + 1)") + ". The first piece is a ln (u = x² + 1), the second is arctan: " + M("3ln(x^2 + 1) - 2arctan(x) + C") + ".</p>" },
    { t: "Naming u, du and the new integral", h: "<p>Some homework problems only ask you to set up the substitution. Fill in three things:</p>" +
      steps(["<b>u</b> = the inside piece", "<b>du</b> = its derivative, written next to dx (WAMAP puts the dx after the box)", "<b>The new integral</b>: everything rewritten in u, with no x left"]) +
      "<p>Example: " + II("x^2 sqrt(x^3 + 7)") + ". u = " + M("x^3 + 7") + ", du = " + M("3x^2") + " dx, so x² dx = du/3 and the integral becomes " + M("(1/3)sqrt(u)", "u") + " du.</p>" +
      rule("Watch for ln tucked inside: in " + II("tan(x)ln(cos(x))") + ", u = ln(cos x) and du = −tan x dx, because the derivative of ln(cos x) is (−sin x)/(cos x).") }
  ],
  probs: [
    { k: "i", q: "2x(x^2 + 3)^4", type: "antideriv", ans: "(x^2 + 3)^5/5 + C", hint: "u = " + M("x^2 + 3") + ".", sol: ["du = 2x dx", "∫ u⁴ du = u⁵/5", M("(x^2 + 3)^5/5 + C")] },
    { k: "i", q: "cos(5x)", type: "antideriv", ans: "sin(5x)/5 + C", hint: "u = 5x, so dx = du/5.", sol: ["(1/5)∫ cos u du", M("sin(5x)/5 + C")] },
    { k: "i", q: "e^(2x)", type: "antideriv", ans: "e^(2x)/2 + C", hint: "u = 2x.", sol: ["(1/2)∫ eᵘ du", M("e^(2x)/2 + C")] },
    { k: "i", q: "x^2 (x^3 + 1)^3", type: "antideriv", ans: "(x^3 + 1)^4/12 + C", hint: "u = " + M("x^3 + 1") + ", du = " + M("3x^2") + " dx.", sol: [M("x^2") + " dx = du/3", "(1/3)∫ u³ du = u⁴/12", M("(x^3 + 1)^4/12 + C")] },
    { k: "i", q: "2x/(x^2 + 1)", type: "antideriv", ans: "ln(x^2 + 1) + C", hint: "The top is the derivative of the bottom.", sol: ["u = " + M("x^2 + 1") + ", du = 2x dx", "∫ du/u = ln|u|", M("ln(x^2 + 1) + C")] },
    { k: "i", q: "x e^(x^2)", type: "antideriv", ans: "e^(x^2)/2 + C", hint: "u = " + M("x^2") + ".", sol: ["x dx = du/2", "(1/2)∫ eᵘ du", M("e^(x^2)/2 + C")] },
    { k: "i", q: "sqrt(2x + 1)", type: "antideriv", ans: "(2x + 1)^(3/2)/3 + C", hint: "u = 2x + 1, dx = du/2.", sol: ["(1/2)∫ u^(1/2) du", "(1/2)·(2/3)u^(3/2) = u^(3/2)/3", M("(2x + 1)^(3/2)/3 + C")] },
    { k: "i", q: "x^2/(x^6 + 1)", type: "antideriv", ans: "(1/3)arctan(x^3) + C", hint: "u = x³, du = 3x² dx. Then " + M("x^6 + 1") + " is u² + 1.", sol: ["u = x³, x² dx = du/3", "(1/3)∫ 1/(u² + 1) du = (1/3) arctan u", M("(1/3)arctan(x^3) + C")] },
    { k: "i", q: "x/sqrt(1 - x^4)", type: "antideriv", ans: "(1/2)arcsin(x^2) + C", pts: [-0.7, -0.4, 0.15, 0.35, 0.6, 0.85], hint: "u = x², du = 2x dx. Then x⁴ is u².", sol: ["u = x², x dx = du/2", "(1/2)∫ 1/√(1 − u²) du = (1/2) arcsin u", M("(1/2)arcsin(x^2) + C")] },
    { k: "i", q: "(2x + 3)/(x^2 + 1)", type: "antideriv", ans: "ln(x^2 + 1) + 3arctan(x) + C", hint: "Split: " + M("2x/(x^2 + 1) + 3/(x^2 + 1)") + ".", sol: ["Split: " + M("2x/(x^2 + 1)") + " + " + M("3/(x^2 + 1)"), "First piece, u = x² + 1: " + M("ln(x^2 + 1)"), "Second piece: " + M("3arctan(x)"), M("ln(x^2 + 1) + 3arctan(x) + C")] },
    { k: "i", q: "e^x/(e^x + 1)", type: "antideriv", ans: "ln(e^x + 1) + C", hint: "u = eˣ + 1. Its derivative is right on top.", sol: ["u = eˣ + 1, du = eˣ dx", "∫ du/u = ln|u|", M("ln(e^x + 1) + C") + " (eˣ + 1 is always positive)"] },
    { k: "i", q: "cos(x)/(sin(x) + 4)", type: "antideriv", ans: "ln(sin(x) + 4) + C", hint: "u = sin x + 4.", sol: ["u = sin x + 4, du = cos x dx", "∫ du/u = ln|u|", M("ln(sin(x) + 4) + C")] },
    { k: "i", q: "sin(x)cos(x)/(sin(x)^2 + 3)", type: "antideriv", ans: "(1/2)ln(sin(x)^2 + 3) + C", hint: "u = sin² x + 3. Its derivative is 2 sin x cos x.", sol: ["u = sin² x + 3, du = 2 sin x cos x dx", "(1/2)∫ du/u = (1/2) ln|u|", M("(1/2)ln(sin(x)^2 + 3) + C")] },
    { k: "i", q: "ln(x)^3/x", type: "antideriv", ans: "ln(x)^4/4 + C", hint: "u = ln x, du = dx/x.", sol: ["u = ln x, du = dx/x", "∫ u³ du = u⁴/4", M("ln(x)^4/4 + C")] }
  ]
},
/* ================= B7 ================= */
{ id: "B7", block: "B", date: "2026-10-17", title: "u-Sub on definite integrals + Block B quiz", test: "Timed quiz",
  topics: ["Changing the limits when you change variables", "30-minute mixed quiz"],
  links: [["Paul: Substitution Rule for Definite Integrals", P1 + "SubstitutionRuleDefinite.aspx"]],
  parts: [
    { t: "Change the limits", h: "<p>When you switch to u, switch the limits too: plug each x-limit into your u formula. Then you never go back to x.</p><p>" + DI("0", "1", "2x(x^2 + 1)^3") + "</p>" + steps(['<span class="m"><i>u</i> = <i>x</i><sup>2</sup> + 1</span>, <span class="m"><i>du</i> = 2<i>x</i> <i>dx</i></span>', "x = 0 → u = 1. x = 1 → u = 2.", DI("1", "2", "x^3", "u") + ' = <span class="m"><i>u</i><sup>4</sup>/4</span> from 1 to 2', "4 − 1/4 = 15/4"]) },
    { t: "One more", h: "<p>" + DI("0", "pi/2", "sin(x)cos(x)") + "</p>" + steps(["u = sin x, du = cos x dx", "x = 0 → u = 0. x = π/2 → u = 1.", DI("0", "1", "x", "u") + " = 1/2"]) },
    { t: "Before the quiz", h: "<p>8 random problems from all of Block B, 30 minutes, no notes. Your homework 5.1–5.5 should be close to done after this. Sunday is a buffer day before Monday’s deadline.</p>" }
  ],
  probs: [
    { k: "di", a: "0", b: "1", q: "2x(x^2 + 1)^2", type: "number", ans: "7/3", hint: "u = x² + 1, new limits 1 to 2.", sol: [DI("1", "2", "x^2", "u") + " = (8 − 1)/3 = 7/3"] },
    { k: "di", a: "0", b: "2", q: "x e^(x^2)", type: "number", ans: "(e^4 - 1)/2", hint: "u = x², new limits 0 to 4, x dx = du/2.", sol: ["(1/2)" + DI("0", "4", "e^x", "u"), "(e⁴ − 1)/2"] },
    { k: "di", a: "0", b: "pi", q: "cos(x/2)", type: "number", ans: "2", hint: "u = x/2, dx = 2 du, new limits 0 to π/2.", sol: ["2" + DI("0", "pi/2", "cos(x)", "u") + " = 2(1 − 0) = 2"] },
    { k: "di", a: "0", b: "1", q: "3x^2/(x^3 + 1)", type: "number", ans: "ln(2)", hint: "u = x³ + 1, new limits 1 to 2.", sol: [DI("1", "2", "1/x", "u") + " = ln 2 − ln 1 = ln 2"] },
    { k: "di", a: "0", b: "4", q: "1/sqrt(2x + 1)", type: "number", ans: "2", hint: "u = 2x + 1, new limits 1 to 9.", sol: ["(1/2)" + DI("1", "9", "x^(-1/2)", "u"), "= " + '<span class="m">√<i>u</i></span> from 1 to 9 = 3 − 1 = 2'] }
  ],
  quiz: { minutes: 30, count: 8, pool: [
    { k: "txt", text: "Right Riemann sum for " + M("x") + " on [0, 4] with n = 4.", type: "number", ans: "10", sol: ["Δx = (4 − 0)/4 = 1", "Right endpoints: 1, 2, 3, 4. Heights: 1, 2, 3, 4.", "(1 + 2 + 3 + 4) × 1 = 10"] },
    { k: "di", a: "0", b: "3", q: "2x + 1", type: "number", ans: "12", sol: [DI("0", "3", "2x + 1") + " = " + M("x^2 + x") + " from 0 to 3", "(9 + 3) − 0 = 12"] },
    { k: "di", a: "1", b: "2", q: "4x^3", type: "number", ans: "15", sol: [DI("1", "2", "4x^3") + " = " + M("x^4") + " from 1 to 2", "16 − 1 = 15"] },
    { k: "ftc", a: "2", b: "x", q: "sqrt(x^2 + 5)", type: "expr", ans: "sqrt(x^2 + 5)", sol: ["FTC part 1: the bottom limit is a constant and the top is x, so put x in for t.", M("sqrt(x^2 + 5)")] },
    { k: "d", q: "(5x^2 - 1)^3", type: "expr", ans: "30x(5x^2 - 1)^2", sol: ["Chain rule: the outside gives 3( )², and the inside's derivative is 10x.", M("3(5x^2 - 1)^2 (10x)"), "= " + M("30x(5x^2 - 1)^2")] },
    { k: "di", a: "-3", b: "3", q: "x^5 - 2x", type: "number", ans: "0", sol: ["x⁵ − 2x is odd: plugging in −x flips its sign.", "Over [−3, 3] the left half cancels the right half.", "= 0"] },
    { k: "i", q: "6x(x^2 - 4)^2", type: "antideriv", ans: "(x^2 - 4)^3 + C", sol: ["u = x² − 4, du = 2x dx, so 6x dx = 3 du.", "3∫u² du = u³ + C", M("(x^2 - 4)^3 + C")] },
    { k: "i", q: "sin(4x)", type: "antideriv", ans: "-cos(4x)/4 + C", sol: ["u = 4x, du = 4 dx, so dx = du/4.", "(1/4)∫sin u du = −(1/4)cos u", M("-cos(4x)/4 + C")] },
    { k: "di", a: "0", b: "1", q: "x(x^2 + 1)^3", type: "number", ans: "15/8", sol: ["u = x² + 1, du = 2x dx, so x dx = du/2. New limits: 1 to 2.", "(1/2)" + DI("1", "2", "x^3", "u") + " = (1/2)·" + M("x^4/4", "u") + " from 1 to 2", "(1/2)(16/4 − 1/4) = (1/2)(15/4) = 15/8"] },
    { k: "txt", text: "Average value of " + M("3x^2") + " on [0, 2].", type: "number", ans: "4", sol: ["Average value = integral ÷ (b − a)", DI("0", "2", "3x^2") + " = " + M("x^3") + " from 0 to 2 = 8", "8 ÷ 2 = 4"] }
  ] }
},

{ id: "C1", block: "C", date: "2026-10-21", title: "Motion and net change", test: "Problem set",
  topics: ["Position, velocity, acceleration as derivatives", "Displacement = ∫ v dt", "Total distance = ∫ |v| dt (split where v changes sign)", "Net change of any quantity from its rate"],
  links: [["Paul: Rates of Change", P1 + "RateOfChange.aspx"], ["Khan: Applications of integrals", KA + "cs1-applications-of-integrals"]],
  parts: [
    { t: "Position, velocity, acceleration", h: "<p>Three functions describe something moving along a line. Each one is the derivative of the one above it.</p>" +
      tbl(["Function", "What it tells you"], [
        [mx(ST), "Position: where it is at time <i>t</i>"],
        [mx(VT + " = <i>s</i>′(<i>t</i>)"), "Velocity: how fast the position changes. Negative means it’s moving backward."],
        [mx(AT + " = <i>v</i>′(<i>t</i>)"), "Acceleration: how fast the velocity changes"]]) +
      rule("Going <b>down</b> the table, differentiate. Going <b>up</b>, integrate, then use a starting value to find C.") },
    { t: "Displacement vs. distance", h: "<p>These sound alike but answer different questions.</p>" +
      tbl(["Quantity", "Formula", "In words"], [
        ["Displacement", DIH("a", "b", VT, "t"), "How far it ended up from where it started. Backward motion cancels forward motion, so this can be negative or 0."],
        ["Distance traveled", DIH("a", "b", "|" + VT + "|", "t"), "Total ground covered. Never negative."]]) +
      "<p>Example: " + tq(VT, "6 - 2x") + " m/s for 0 ≤ <i>t</i> ≤ 5. The velocity is positive until <i>t</i> = 3, then negative.</p>" +
      fig({ x: [-0.6, 5.8], y: [-5, 7.4], curves: [{ f: "6 - 2x", from: 0, to: 5 }], fill: [{ top: "6 - 2x", bot: "0", from: 0, to: 3 }, { top: "0", bot: "6 - 2x", from: 3, to: 5 }],
        yt: [6, -4], lab: [[0.75, 1.4, "+9"], [4.2, -1.9, "−4"], [3.15, 0.6, "3"], [5.1, 0.6, "5"], [5.55, -1.2, "t"], [0.2, 6.9, "v"]],
        alt: "The line v = 6 - 2t. It is above the axis from t = 0 to 3 and below it from 3 to 5.", cap: "Area above the axis is forward motion. Area below it is backward motion." }) +
      steps(["<b>Displacement:</b> " + DI("0", "5", "6 - 2x", "t") + " = 9 − 4 = 5 m", "<b>Distance:</b> 9 + 4 = 13 m"]) },
    { t: "The recipe for total distance", h: steps(["Solve " + mx(VT + " = 0") + " to find when it turns around.", "Keep only the times inside your interval. Split the interval there.", "Integrate <i>v</i> over each piece separately.", "Drop the minus sign from any negative piece, then add."]) +
      "<p>" + tq(VT, "x^2 - 2x") + " for 0 ≤ <i>t</i> ≤ 3:</p>" +
      steps([mx("<i>t</i><sup>2</sup> − 2<i>t</i> = <i>t</i>(<i>t</i> − 2) = 0") + " at t = 0 and t = 2. Split at t = 2.",
        DI("0", "2", "x^2 - 2x", "t") + " = 8/3 − 4 = −4/3",
        DI("2", "3", "x^2 - 2x", "t") + " = 0 − (−4/3) = 4/3",
        "Distance = 4/3 + 4/3 = 8/3"]) +
      "<p>Its displacement is −4/3 + 4/3 = 0. It ends where it started, but it still traveled 8/3.</p>" },
    { t: "Position from velocity", h: rule("<b>Position now</b> = starting position + displacement so far<br><b>Velocity now</b> = starting velocity + the integral of acceleration") +
      "<p>This is the initial value problem from <a href=\"#/s/A5\">A5</a>: integrate, then use the starting value to find C.</p>" +
      "<p>A ball is thrown up from an 80 ft roof at 64 ft/s. Gravity gives " + mx(AT + " = −32") + " ft/s².</p>" +
      steps(["<b>Velocity:</b> integrate −32 to get " + M("-32x + C", "t") + ". Since " + mx("<i>v</i>(0) = 64") + ", C = 64. So " + tq(VT, "64 - 32x") + ".",
        "<b>Position:</b> integrate again to get " + M("64x - 16x^2 + C", "t") + ". Since " + mx("<i>s</i>(0) = 80") + ", C = 80. So " + tq(ST, "80 + 64x - 16x^2") + ".",
        "<b>Highest point:</b> the velocity is 0 there. 64 − 32t = 0 at t = 2, and " + mx("<i>s</i>(2) = 80 + 128 − 64 = 144") + " ft."]) },
    { t: "Net change works for any rate", h: "<p>None of this is special to motion. If you know the <b>rate</b> something changes, the integral of that rate is the <b>total change</b>.</p>" +
      rule(DIH("a", "b", "<i>Q</i>′(<i>t</i>)", "t") + " = " + mx("<i>Q</i>(<i>b</i>) − <i>Q</i>(<i>a</i>)") + "<br>Amount later = amount now + the integral of the rate") +
      "<p>Water flows into a tank at " + M("20 - 2x", "t") + " gallons per minute. In the first 5 minutes it gains " + DI("0", "5", "20 - 2x", "t") + " = 100 − 25 = 75 gallons. If it started with 40 gallons, it now holds 115.</p>" +
      "<p>Check the units: (gallons per minute) × minutes = gallons. If the units of your answer make sense, the setup is probably right.</p>" }
  ],
  probs: [
    { k: "txt", text: "A particle moves with velocity " + tq(VT, "3x^2 - 12") + " m/s. Find its <b>displacement</b> from t = 0 to t = 3.", type: "number", ans: "-9", chk: [["3x^2 - 12", "0", "3"]],

    { k: "txt", text: "Same particle, " + tq(VT, "3x^2 - 12") + ". Find the <b>total distance</b> it travels from t = 0 to t = 3.", type: "number", ans: "23", chk: [["abs(3x^2 - 12)", "0", "3"]],

    { k: "txt", text: "A ball is thrown straight up at 48 ft/s. Its acceleration is " + mx(AT + " = −32") + " ft/s². Find its velocity " + mx(VT) + ".", type: "expr", ivp: true, v: "t", ans: "48 - 32x",

      hint: "At the top, v = 0. Find that time, then the displacement up to it.", sol: ["48 − 32t = 0 at t = 1.5 s", DI("0", "1.5", "48 - 32x", "t") + " = 48(1.5) − 16(1.5)²", "72 − 36 = 36 ft"] },
    { k: "txt", text: "Water pours into a tank at " + M("6sqrt(x)", "t") + " liters per minute. How many liters are added between t = 1 and t = 4?", type: "number", ans: "28", chk: [["6sqrt(x)", "1", "4"]],
      hint: "Integrate the rate from 1 to 4. Rewrite the root as a power first.", sol: ["Rewrite: " + M("6x^(1/2)", "t"), "Antiderivative: " + M("4x^(3/2)", "t"), "4·8 − 4·1 = 28 liters"] }

      rule(mx("Area = ") + DIH("a", "b", "(top − bottom)", "x")) +

    { t: "Worked example", h: "<p>Find the area between " + yq("x + 2") + " and " + yq("x^2") + " (the region pictured in part 1).</p>" +

        lab: [[0.2, 0.8, "y = x"], [0.75, 0.12, "y = x³"]], alt: "The line y = x and the cubic y = x cubed. The cubic is on top from -1 to 0 and the line is on top from 0 to 1." }) +
      "<p>Area between " + yq("x^3") + " and " + yq("x") + ":</p>" +
      steps(["They cross at x = −1, 0, 1.", "From −1 to 0 the cubic is on top. From 0 to 1 the line is on top.", "Right piece: " + DI("0", "1", "x - x^3") + " = 1/2 − 1/4 = 1/4", "The left piece is the same size by symmetry: 1/4.", "Total: 1/2"]) +
      rule("If you skip the split and integrate " + M("x - x^3") + " from −1 to 1, you get 0. The two pieces cancel. An area of 0 or a negative area means you missed a split.") },
    { t: "Sideways slices (dy)", h: "<p>Sometimes vertical strips are awkward: the bottom curve changes partway across. Slice <b>horizontally</b> instead.</p>" +
      fig({ x: [-0.8, 5], y: [-2.2, 2.9], curves: [{ f: "x^2", inv: true, from: -1.9, to: 2.15 }, { f: "x + 2", inv: true, from: -2, to: 2.6, alt: true }], fill: [{ top: "x + 2", bot: "x^2", from: -1, to: 2, inv: true }], rect: [[0.25, 0.42, 2.5, 0.58]], yt: [-1, 2],
        lab: [[1.2, -1.95, "x = y²"], [3.55, 0.85, "x = y + 2"]], alt: "The region between the sideways parabola x = y squared and the line x = y + 2, with one thin horizontal strip drawn in", cap: "One horizontal strip. Its length is (y + 2) − y²." }) +
      rule(mx("Area = ") + DIH("c", "d", "(right − left)", "y") + "<br>Write both curves as x = …, and use y-values for the limits.") +
      steps(["The curves cross where " + mx("<i>y</i><sup>2</sup> = <i>y</i> + 2") + ": y = −1 and y = 2.", "The line is on the right.", "Area = " + DI("-1", "2", "x + 2 - x^2", "y") + " = 9/2"]) +
      "<p>With vertical strips this region needs two integrals, because the bottom edge switches from the parabola to the line at x = 1. With horizontal strips it needs one.</p>" }

    { k: "txt", text: "Find the area between " + yq("cos(x)") + " and " + yq("sin(x)") + " from x = 0 to x = π/4.", type: "number", ans: "sqrt(2) - 1", chk: [["cos(x) - sin(x)", "0", "pi/4"]],
      hint: "On this stretch cos is on top. Remember sin(π/4) = cos(π/4) = √2/2. Type sqrt(2).", sol: [DI("0", "pi/4", "cos(x) - sin(x)") + " = " + M("sin(x) + cos(x)") + " from 0 to π/4", "(√2/2 + √2/2) − (0 + 1)", "= √2 − 1"] }

{ id: "C4", block: "C", date: "2026-10-27", title: "Volumes by slicing: disks and washers", test: "Problem set",
  topics: ["Volume = integral of the slice area", "Disk and washer area", "Choosing dx vs dy from the axis of rotation"],
  links: [["Paul: Area & Volume Formulas", P1 + "Area_Volume_Formulas.aspx"], ["Paul: Volumes (Rings)", P1 + "VolumeWithRings.aspx"], ["Paul: More Volume Problems", P1 + "MoreVolume.aspx"]],
  parts: [
    { t: "Volume = add up the slices", h: "<p>Cut a solid into thin slices, like a loaf of bread. Each slice has volume (area of its face) × (thickness). An integral adds them up.</p>" +
      rule(mx("<i>V</i> = ") + DIH("a", "b", "<i>A</i>(<i>x</i>)", "x") + ", where " + mx("<i>A</i>(<i>x</i>)") + " is the area of the slice at <i>x</i>") +
      "<p>Example: every slice of a solid is a square with side " + M("sqrt(x)") + ", for 0 ≤ x ≤ 4. Then " + mx("<i>A</i>(<i>x</i>) = (√<i>x</i>)<sup>2</sup> = <i>x</i>") + ", and " + mx("<i>V</i> = ") + DI("0", "4", "x") + " = 8.</p>" },
    { t: "Disks", h: "<p>Take the region under a curve and spin it around the x-axis. Each thin vertical strip sweeps out a <b>disk</b>: a circle whose radius is the height of the curve.</p>" +
      fig({ x: [-0.5, 4.8], y: [-0.6, 2.7], curves: [{ f: "sqrt(x)", from: 0, to: 4.3 }], fill: [{ top: "sqrt(x)", bot: "0", from: 0, to: 4 }], rect: [[1.9, 0, 2.1, 1.414]], xt: [4], seg: [[4, 0, 4, 2, true]],
        lab: [[2.25, 0.62, "radius = √x"], [3.1, 2.25, "y = √x", "end"]], alt: "The region under y = square root of x from 0 to 4, with one thin vertical strip", cap: "Spin the strip around the x-axis and it sweeps out a disk." }) +
      rule(mx("<i>V</i> = π") + DIH("a", "b", "(radius)<sup>2</sup>", "x") + "<br>The area of a circle is π·(radius)². Here the radius is " + mx("<i>f</i>(<i>x</i>)") + ".") +
      "<p>For " + yq("sqrt(x)") + " on [0, 4]: " + mx("<i>V</i> = π") + DI("0", "4", "x") + " = 8π. Square the radius <b>before</b> you integrate.</p>" },
    { t: "Washers", h: "<p>If the region doesn’t touch the axis, each slice is a disk with a hole in it: a <b>washer</b>.</p>" +
      fig({ x: [-0.25, 1.45], y: [-0.2, 1.25], curves: [{ f: "x^2", from: 0, to: 1.1 }, { f: "x", from: 0, to: 1.2, alt: true }], fill: [{ top: "x", bot: "x^2", from: 0, to: 1 }], rect: [[0.57, 0.36, 0.63, 0.6]], xt: [1],
        seg: [[0.6, 0, 0.6, 0.36, true]], lab: [[0.66, 0.16, "r = x²"], [0.5, 0.66, "R = x", "end"]], alt: "The region between y = x and y = x squared from 0 to 1, with one thin vertical strip that does not reach the axis", cap: "The strip doesn’t reach the axis, so the slice has a hole." }) +
      rule(mx("<i>V</i> = π") + DIH("a", "b", "(<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>)", "x") + "<br><i>R</i> = outer radius, the curve <b>farther</b> from the axis. <i>r</i> = inner radius, the closer one.") +
      "<p>Spin the region between " + yq("x") + " and " + yq("x^2") + " around the x-axis:</p>" +
      steps(["They cross at x = 0 and x = 1. The line is farther from the axis, so R = x and r = x².", mx("<i>V</i> = π") + DI("0", "1", "x^2 - x^4"), "= π(1/3 − 1/5) = 2π/15"]) +
      rule("It’s " + mx("<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>") + ", <b>not</b> " + mx("(<i>R</i> − <i>r</i>)<sup>2</sup>") + ". Square each radius first, then subtract.") },
    { t: "Spinning around the y-axis", h: "<p>The slices must be <b>perpendicular to the axis</b> you spin around. For the y-axis that means horizontal slices, so you integrate in <i>y</i> and each radius is an x-distance.</p>" +
      steps(["Rewrite each curve as x = (something with y).", "Use y-values for the limits.", "The radius is that x."]) +
      "<p>The region between " + yq("x^2") + ", " + mx("<i>y</i> = 4") + " and the y-axis, spun around the y-axis:</p>" +
      steps([yq("x^2") + " becomes " + xq("sqrt(x)") + ", so the radius is " + M("sqrt(x)", "y") + ".", "y runs from 0 to 4.", mx("<i>V</i> = π") + DI("0", "4", "x", "y") + " = 8π"]) },
    { t: "Spinning around another line", h: "<p>The radius is always the <b>distance from the curve to the axis of rotation</b>. Move the axis and the radius changes.</p>" +
      tbl(["Spin around", "Radius for a curve at height f(x)"], [["the x-axis (y = 0)", mx("<i>f</i>(<i>x</i>)")], ["the line y = −1 (below the region)", mx("<i>f</i>(<i>x</i>) + 1")], ["the line y = 5 (above the region)", mx("5 − <i>f</i>(<i>x</i>)")]]) +
      "<p>Spin the region between " + yq("x") + " and " + yq("x^2") + " around " + mx("<i>y</i> = −1") + ":</p>" +
      steps(["Both curves are 1 farther from the axis now: R = x + 1 and r = x² + 1.", mx("<i>V</i> = π") + DI("0", "1", "(x + 1)^2 - (x^2 + 1)^2"), "Expand and simplify the inside: " + M("2x - x^2 - x^4"), "= π(1 − 1/3 − 1/5) = 7π/15"]) },
    { t: "Quick decision table", h: tbl(["Axis of rotation", "Slices", "Integrate in", "Radius is"], [["Horizontal: the x-axis or y = k", "Vertical", "<i>x</i>", "a y-distance"], ["Vertical: the y-axis or x = k", "Horizontal", "<i>y</i>", "an x-distance"]]) +
      "<p>That’s for disks and washers. Session <a href=\"#/s/C5\">C5</a> adds a second method, shells, for when this one gets messy.</p>" }
  ],
  probs: [
    { k: "txt", text: "The region under " + yq("x^2") + " from x = 0 to x = 2 is spun around the x-axis. Find the volume.", type: "number", ans: "32pi/5", chk: [["(x^2)^2", "0", "2", "pi"]],

/* ================= C5 ================= */
{ id: "C5", block: "C", date: "2026-10-29", title: "Volumes by shells", test: "Problem set",
  topics: ["Shell radius and height", "Shells around the y-axis, the x-axis and other lines", "When shells beat washers"],
  links: [["Paul: Volumes (Cylinders)", P1 + "VolumeWithCylinder.aspx"]],
  parts: [
    { t: "A different kind of slice", h: "<p>Washers use strips <b>perpendicular</b> to the axis. Shells use strips <b>parallel</b> to it. Spin a thin vertical strip around the y-axis and it sweeps out a hollow tube, like a soup can with no ends.</p>" +
      fig({ x: [-0.5, 2.6], y: [-0.42, 1.35], curves: [{ f: "2x - x^2", from: 0, to: 2 }], fill: [{ top: "2x - x^2", bot: "0", from: 0, to: 2 }], rect: [[1.36, 0, 1.44, 0.84]], xt: [2],
        seg: [[0, -0.2, 1.4, -0.2], [0, -0.25, 0, -0.15], [1.4, -0.25, 1.4, -0.15]], lab: [[0.7, -0.36, "radius = x", "middle"], [1.3, 0.4, "height", "end"], [1.15, 1.12, "y = 2x − x²"]],
        alt: "The region under y = 2x - x squared from 0 to 2, with one thin vertical strip at distance x from the y-axis", cap: "Spin this strip around the y-axis and it sweeps out a thin tube." }) +
      "<p>Cut the tube and unroll it. It’s a flat sheet: its length is the circumference 2π·(radius), its height is the strip’s height, and its thickness is <i>dx</i>.</p>" +
      rule(mx("<i>V</i> = ") + DIH("a", "b", "2π·(radius)·(height)", "x")) },
    { t: "Shells around the y-axis", h: steps(["Use vertical strips, so integrate in <i>x</i>.", "<b>Radius</b> = the strip’s distance from the y-axis = <i>x</i>.", "<b>Height</b> = top curve − bottom curve."]) +
      "<p>Spin the region under " + yq("2x - x^2") + " (above the x-axis) around the y-axis:</p>" +
      steps(["The curve meets the axis at x = 0 and x = 2.", "Radius = x. Height = " + M("2x - x^2") + ".", mx("<i>V</i> = 2π") + DI("0", "2", "x(2x - x^2)") + " = 2π" + DI("0", "2", "2x^2 - x^3"), "= 2π(16/3 − 4) = 8π/3"]) +
      "<p>With washers you’d have to solve " + yq("2x - x^2") + " for x. Shells skip that.</p>" },
    { t: "Shells around the x-axis", h: "<p>Turn everything sideways. Use horizontal strips and integrate in <i>y</i>.</p>" +
      steps(["<b>Radius</b> = the strip’s distance from the x-axis = <i>y</i>.", "<b>Height</b> (really a length now) = right curve − left curve, both written as x = …"]) +
      "<p>Spin the region between " + yq("sqrt(x)") + ", the x-axis and " + mx("<i>x</i> = 4") + " around the x-axis:</p>" +
      steps(["The curve is " + xq("x^2") + ". A strip at height y runs from there to x = 4, so its length is " + M("4 - x^2", "y") + ".", "y runs from 0 to 2.", mx("<i>V</i> = 2π") + DI("0", "2", "x(4 - x^2)", "y") + " = 2π(8 − 4) = 8π"]) +
      "<p>That matches the 8π from disks in <a href=\"#/s/C4\">C4</a>. Both methods always give the same volume.</p>" },
    { t: "Spinning around another line", h: "<p>Only the <b>radius</b> changes. It’s the distance from the strip to the line you spin around.</p>" +
      tbl(["Spin around", "Radius of a strip at x"], [["the y-axis (x = 0)", mx("<i>x</i>")], ["the line x = 3 (to the right of the region)", mx("3 − <i>x</i>")], ["the line x = −1 (to the left)", mx("<i>x</i> + 1")]]) +
      "<p>Spin the region under " + yq("x^2") + " from 0 to 2 around " + mx("<i>x</i> = 2") + ":</p>" +
      steps(["Radius = 2 − x. Height = x².", mx("<i>V</i> = 2π") + DI("0", "2", "(2 - x)x^2") + " = 2π" + DI("0", "2", "2x^2 - x^3"), "= 2π(16/3 − 4) = 8π/3"]) },
    { t: "Shells or washers?", h: tbl(["", "Disks / washers", "Shells"], [
        ["Strips are", "perpendicular to the axis", "parallel to the axis"],
        ["Around a vertical axis", "integrate in <i>y</i>", "integrate in <i>x</i>"],
        ["Around a horizontal axis", "integrate in <i>x</i>", "integrate in <i>y</i>"],
        ["Formula", mx("π(<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>)"), "2π·(radius)·(height)"]]) +
      rule("<b>Pick the variable first.</b> If the curves are given as y = (something with x) and are hard to solve for x, stay in <i>x</i>. Then the axis tells you the method: strips perpendicular to it are washers, strips parallel to it are shells.") }
  ],
  probs: [
    { k: "txt", text: "The region under " + yq("x^2") + " from x = 0 to x = 2 is spun around the <b>y-axis</b>. Use shells to find the volume.", type: "number", ans: "8pi", chk: [["x*x^2", "0", "2", "2pi"]],
      hint: "Radius = x, height = x². Type pi for π.", sol: ["2π" + DI("0", "2", "x^3"), "= 2π·4", "= 8π"] },
    { k: "txt", text: "The region under " + yq("1/x") + " from x = 1 to x = 3 is spun around the y-axis. Find the volume.", type: "number", ans: "4pi", chk: [["x*(1/x)", "1", "3", "2pi"]],
      hint: "Radius × height = x·(1/x). That simplifies a lot.", sol: ["Radius × height = 1", "2π" + DI("1", "3", "1") + " = 2π·2", "= 4π"] },
    { k: "txt", text: "The region under " + yq("e^(-x^2)") + " from x = 0 to x = 1 is spun around the y-axis. Find the volume.", type: "number", ans: "pi(1 - 1/e)", chk: [["x e^(-x^2)", "0", "1", "2pi"]],
      hint: "Shells give 2π∫ x·e^(−x²) dx. Use u = −x².", sol: ["u = −x², so x dx = −du/2. Limits become 0 to −1.", "2π·(−1/2)" + DI("0", "-1", "e^x", "u") + " = −π(1/e − 1)", "= π(1 − 1/e)"] },
    { k: "txt", text: "The region between " + yq("x") + " and " + yq("x^2") + " is spun around the y-axis. Find the volume.", type: "number", ans: "pi/6", chk: [["x(x - x^2)", "0", "1", "2pi"]],
      hint: "Radius = x. Height = top − bottom = x − x².", sol: ["2π" + DI("0", "1", "x(x - x^2)") + " = 2π" + DI("0", "1", "x^2 - x^3"), "= 2π(1/3 − 1/4) = 2π/12", "= π/6"] },
    { k: "txt", text: "The region under " + yq("sin(x^2)") + " from x = 0 to x = " + M("sqrt(pi)") + " is spun around the y-axis. Find the volume.", type: "number", ans: "2pi", chk: [["x sin(x^2)", "0", "sqrt(pi)", "2pi"]],
      hint: "Shells put an x next to sin(x²), which is exactly what u = x² needs.", sol: ["u = x², so x dx = du/2. Limits become 0 to π.", "2π·(1/2)" + DI("0", "pi", "sin(x)", "u") + " = π·2", "= 2π"] },
    { k: "txt", text: "The region between " + xq("x^2") + ", the y-axis and " + mx("<i>y</i> = 3") + " is spun around the <b>x-axis</b>. Use shells to find the volume.", type: "number", ans: "81pi/2", chk: [["x*x^2", "0", "3", "2pi"]],
      hint: "Horizontal strips. Radius = y. Length = y² − 0. y runs from 0 to 3.", sol: ["2π" + DI("0", "3", "x^3", "y"), "= 2π·81/4", "= 81π/2"] },
    { k: "txt", text: "The region under " + yq("sqrt(x)") + " from x = 0 to x = 1 is spun around the line " + mx("<i>x</i> = 1") + ". Find the volume.", type: "number", ans: "8pi/15", chk: [["(1 - x)sqrt(x)", "0", "1", "2pi"]],
      hint: "Radius = 1 − x. Height = √x. Multiply out before integrating.", sol: ["Radius × height = " + M("x^(1/2) - x^(3/2)"), "2π" + DI("0", "1", "x^(1/2) - x^(3/2)") + " = 2π(2/3 − 2/5)", "= 2π·4/15 = 8π/15"] },
    { k: "txt", text: "The region under " + yq("2x - x^2") + " is spun around the y-axis. Which method avoids solving for x?", type: "choice", opts: ["Shells, integrating in x", "Washers, integrating in y"], ans: 0,
      why: ["", "Washers around the y-axis need x = (something with y). Solving y = 2x − x² for x is messy."],
      hint: "Around a vertical axis, washers integrate in y and shells integrate in x.", sol: ["The curve is given as y = (something with x), so stay in x.", "Around the y-axis, vertical strips are parallel to the axis: shells."] }
  ]
},
/* ================= C6 ================= */
{ id: "C6", block: "C", date: "2026-11-01", title: "Arc length and surface area", test: "Problem set",
  topics: ["∫ √(1 + (f′)²) dx", "Simplifying 1 + (f′)² into a perfect square", "Surface area formula"],
  links: [["Paul: Arc Length", P2 + "ArcLength.aspx"], ["Paul: Surface Area", P2 + "SurfaceArea.aspx"]],
  parts: [
    { t: "The arc length formula", h: "<p>To measure a curve, cut it into tiny straight pieces. Each piece is the long side of a tiny right triangle with legs <i>dx</i> and <i>dy</i>.</p>" +
      fig({ x: [-0.3, 3.4], y: [-0.3, 3.6], curves: [{ f: "0.3x^2 + 0.4", from: 0, to: 3.1 }], seg: [[1.4, 0.988, 2.4, 0.988], [2.4, 0.988, 2.4, 2.128], [1.4, 0.988, 2.4, 2.128, true]], dots: [[1.4, 0.988], [2.4, 2.128]],
        lab: [[1.9, 0.68, "dx", "middle"], [2.5, 1.5, "dy"], [1.75, 1.75, "piece", "end"]], alt: "A curve with a small right triangle under it. The legs are dx and dy, and the slanted side follows the curve.", cap: "Pythagoras: (piece)² = dx² + dy²" }) +
      rule(mx("<i>L</i> = ") + DIH("a", "b", '√<span class="ov">1 + [<i>f</i>′(<i>x</i>)]<sup>2</sup></span>', "x")) +
      "<p>The formula is short. The work is all in simplifying what’s under the root.</p>" },
    { t: "The recipe", h: steps(["Find " + mx("<i>f</i>′(<i>x</i>)") + ".", "<b>Square it.</b>", "<b>Add 1.</b>", "Simplify. Look for a perfect square, so the root cancels.", "Integrate."]) +
      "<p>Length of " + yq("(2/3)x^(3/2)") + " from x = 0 to x = 3:</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = ") + M("x^(1/2)"), "Square it: " + M("x"), "Add 1: " + M("1 + x"), mx("<i>L</i> = ") + DI("0", "3", "sqrt(1 + x)") + " = " + M("(2/3)(1 + x)^(3/2)") + " from 0 to 3", "(2/3)(8 − 1) = 14/3"]) },
    { t: "The perfect-square trick", h: "<p>Homework and exam problems are built so that " + mx("1 + (<i>f</i>′)<sup>2</sup>") + " turns into a perfect square. Here’s the usual pattern.</p>" +
      "<p>Length of " + yq("x^3/6 + 1/(2x)") + " from x = 1 to x = 2:</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = ") + M("x^2/2 - 1/(2x^2)"),
        "Square it: " + M("x^4/4 - 1/2 + 1/(4x^4)") + ". The middle term is 2 × (first)(second) = −1/2.",
        "Add 1: " + M("x^4/4 + 1/2 + 1/(4x^4)") + ". Only the middle sign changed.",
        "That’s the same square with a plus inside: " + M("(x^2/2 + 1/(2x^2))^2"),
        "The root removes the square: " + mx("<i>L</i> = ") + DI("1", "2", "x^2/2 + 1/(2x^2)"),
        "= " + M("x^3/6 - 1/(2x)") + " from 1 to 2 = 13/12 − (−4/12) = 17/12"]) +
      rule("<b>Shortcut:</b> if " + mx("<i>f</i>′") + " is (one term) − (another term) and those two terms multiply to 1/4, then " + mx("1 + (<i>f</i>′)<sup>2</sup>") + " is the same two terms <b>added</b>, squared. Flip the minus to a plus and integrate.") },
    { t: "Surface area", h: "<p>Spin a curve around the x-axis and it sweeps out a surface, like the skin of a vase. Each tiny piece of the curve sweeps out a thin band.</p>" +
      rule(mx("<i>S</i> = ") + DIH("a", "b", '2π <i>f</i>(<i>x</i>) √<span class="ov">1 + [<i>f</i>′(<i>x</i>)]<sup>2</sup></span>', "x") + "<br>Band area = circumference (2π·radius) × the length of the tiny piece. The radius is the height " + mx("<i>f</i>(<i>x</i>)") + ".") +
      "<p>It’s the arc length integral with an extra " + mx("2π <i>f</i>(<i>x</i>)") + " inside.</p>" +
      "<p>Spin " + yq("2x") + ", 0 ≤ x ≤ 3, around the x-axis (a cone):</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = 2") + ", so the root is √5.", mx("<i>S</i> = 2π") + DI("0", "3", "2x sqrt(5)"), "= 4π√5·(9/2) = 18π√5"]) },
    { t: "Surface area with a u-sub", h: "<p>Spin " + yq("x^3") + ", 0 ≤ x ≤ 1, around the x-axis:</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = ") + M("3x^2") + ", so " + mx("1 + (<i>f</i>′)<sup>2</sup> = ") + M("1 + 9x^4"),
        mx("<i>S</i> = 2π") + DI("0", "1", "x^3 sqrt(1 + 9x^4)"),
        "u = " + M("1 + 9x^4") + ", du = " + M("36x^3") + " dx. The " + M("x^3") + " outside is exactly what the u-sub needs. Limits become 1 to 10.",
        "(2π/36)" + DI("1", "10", "sqrt(x)", "u") + " = (π/18)·(2/3)·" + mx("(10<sup>3/2</sup> − 1)"),
        "= π(10√10 − 1)/27"]) +
      "<p>Many surface area problems work this way: the " + mx("<i>f</i>(<i>x</i>)") + " in front supplies the piece that a u-sub needs.</p>" }
  ],
  probs: [
    { k: "txt", text: "Find the length of the line " + yq("2x + 1") + " from x = 0 to x = 3.", type: "number", ans: "3sqrt(5)", chk: [["sqrt(1 + 2^2)", "0", "3"]],
      hint: "f′ = 2, so the root is a constant. Type sqrt(5) for √5.", sol: ["1 + 2² = 5", DI("0", "3", "sqrt(5)") + " = 3√5", "Check with the distance formula from (0, 1) to (3, 7): √(9 + 36) = √45 = 3√5 ✓"] },
    { k: "txt", text: "Find the length of " + yq("(2/3)x^(3/2)") + " from x = 0 to x = 8.", type: "number", ans: "52/3", chk: [["sqrt(1 + (x^(1/2))^2)", "0", "8"]],
      hint: "f′ = " + M("x^(1/2)") + ", so 1 + (f′)² = 1 + x.", sol: [DI("0", "8", "sqrt(1 + x)") + " = " + M("(2/3)(1 + x)^(3/2)") + " from 0 to 8", "(2/3)(27 − 1)", "= 52/3"] },
    { k: "txt", text: "Find the length of " + yq("(x^2 + 2)^(3/2)/3") + " from x = 0 to x = 3.", type: "number", ans: "12", chk: [["sqrt(1 + (x sqrt(x^2 + 2))^2)", "0", "3"]],
      hint: "Chain rule: f′ = " + M("x sqrt(x^2 + 2)") + ". Then 1 + (f′)² = " + M("x^4 + 2x^2 + 1") + ", which factors.", sol: ["(f′)² = " + M("x^2(x^2 + 2)") + " = " + M("x^4 + 2x^2"), "Add 1: " + M("x^4 + 2x^2 + 1") + " = " + M("(x^2 + 1)^2"), DI("0", "3", "x^2 + 1") + " = 9 + 3 = 12"] },
    { k: "txt", text: "Find the length of " + yq("x^3/12 + 1/x") + " from x = 1 to x = 2.", type: "number", ans: "13/12", chk: [["sqrt(1 + (x^2/4 - 1/x^2)^2)", "1", "2"]],
      hint: "f′ = " + M("x^2/4 - 1/x^2") + ". Those two terms multiply to 1/4, so flip the minus to a plus.", sol: ["1 + (f′)² = " + M("(x^2/4 + 1/x^2)^2"), DI("1", "2", "x^2/4 + 1/x^2") + " = " + M("x^3/12 - 1/x") + " from 1 to 2", "(8/12 − 1/2) − (1/12 − 1) = 2/12 + 11/12", "= 13/12"] },
    { k: "txt", text: "Find the length of " + yq("x^2/2 - ln(x)/4") + " from x = 1 to x = e.", type: "number", ans: "e^2/2 - 1/4", chk: [["sqrt(1 + (x - 1/(4x))^2)", "1", "e"]],
      hint: "f′ = " + M("x - 1/(4x)") + ". Same pattern: the two terms multiply to 1/4.", sol: ["1 + (f′)² = " + M("(x + 1/(4x))^2"), DI("1", "e", "x + 1/(4x)") + " = " + M("x^2/2 + ln(x)/4") + " from 1 to e", "(e²/2 + 1/4) − (1/2 + 0)", "= e²/2 − 1/4"] },
    { k: "txt", text: "Set up only: for the length of " + yq("x^2") + ", what goes <b>inside</b> the integral? (Don’t integrate it. That one needs a Chapter 8 technique.)", type: "expr", ans: "sqrt(1 + 4x^2)",
      hint: "f′ = 2x. Square it, add 1, take the root.", sol: [mx("<i>f</i>′(<i>x</i>) = ") + M("2x"), "(f′)² = " + M("4x^2"), M("sqrt(1 + 4x^2)")] },
    { k: "txt", text: "Spin the line " + yq("3x") + ", 0 ≤ x ≤ 2, around the x-axis. Find the surface area.", type: "number", ans: "12pi sqrt(10)", chk: [["3x sqrt(1 + 3^2)", "0", "2", "2pi"]],
      hint: "f′ = 3, so the root is √10. Type √10 as sqrt(10).", sol: ["2π" + DI("0", "2", "3x sqrt(10)"), "= 6π√10·(4/2)", "= 12π√10"] },
    { k: "txt", text: "Spin " + yq("sqrt(x)") + ", 2 ≤ x ≤ 6, around the x-axis. Find the surface area.", type: "number", ans: "49pi/3", chk: [["sqrt(x) sqrt(1 + (1/(2sqrt(x)))^2)", "2", "6", "2pi"]],
      hint: "f′ = " + M("1/(2sqrt(x))") + ", so 1 + (f′)² = " + M("1 + 1/(4x)") + ". Multiply the √x into the root.", sol: [M("sqrt(x)") + "·" + M("sqrt(1 + 1/(4x))") + " = " + M("sqrt(x + 1/4)"), "2π" + DI("2", "6", "sqrt(x + 1/4)") + " = 2π·" + M("(2/3)(x + 1/4)^(3/2)") + " from 2 to 6", "(25/4)^(3/2) = 125/8 and (9/4)^(3/2) = 27/8", "(4π/3)(98/8) = 49π/3"] }
  ]
},

{ id: "C7", block: "C", date: "2026-11-03", title: "Physical applications", test: "Problem set",
  topics: ["Mass from density", "Work = force × distance, sliced", "Springs (Hooke’s law) and pumping liquid", "Force from fluid pressure"],
  links: [["Paul: Work", P1 + "Work.aspx"], ["Paul: Hydrostatic Pressure", P2 + "HydrostaticPressure.aspx"]],
  parts: [
    { t: "One idea, four costumes", h: "<p>Every 6.7 problem is the same move you’ve used all chapter:</p>" +
      steps(["<b>Slice</b> the object into thin pieces.", "Write the mass, work or force for <b>one slice</b>. That’s where the physics goes.", "<b>Integrate</b> to add the slices."]) +
      "<p>The integrals are easy. Spend your time on step 2, and write the units next to every quantity.</p>" },
    { t: "Mass from density", h: "<p>A thin bar isn’t the same all the way along. Its density " + mx("ρ(<i>x</i>)") + " (mass per unit length) changes with <i>x</i>. A slice of length <i>dx</i> has mass ρ(<i>x</i>) <i>dx</i>.</p>" +
      rule(mx("mass = ") + DIH("a", "b", "ρ(<i>x</i>)", "x")) +
      "<p>A 4 m bar has density " + mx("ρ(<i>x</i>) = 2 + <i>x</i>") + " kg/m. Its mass is " + DI("0", "4", "2 + x") + " = 8 + 8 = 16 kg.</p>" },
    { t: "Work and springs", h: "<p>With a constant force, work = force × distance. When the force changes as you go, integrate it.</p>" +
      rule(mx("<i>W</i> = ") + DIH("a", "b", "<i>F</i>(<i>x</i>)", "x") + "<br>Units: newtons × meters = joules (J), or pounds × feet = ft·lb") +
      "<p><b>Hooke’s law:</b> a spring pulls back harder the farther you stretch it. " + mx("<i>F</i>(<i>x</i>) = <i>kx</i>") + ", where <i>x</i> is the distance from its natural length.</p>" +
      "<p>A 40 N force holds a spring stretched 0.2 m. How much work stretches it from rest to 0.3 m?</p>" +
      steps(["<b>Find k first.</b> 40 = k·0.2, so k = 200.", mx("<i>W</i> = ") + DI("0", "0.3", "200x"), "= " + M("100x^2") + " from 0 to 0.3 = 100·0.09 = 9 J"]) +
      rule("Spring problems give you a force and a stretch so you can find <i>k</i>. Always do that before integrating.") },
    { t: "Lifting a rope or chain", h: "<p>A hanging rope is hard because each bit of it is lifted a different distance. Slice it.</p>" +
      "<p>A 50 ft rope weighing 0.5 lb per foot hangs off a roof. How much work pulls it all up?</p>" +
      steps(["Let <i>y</i> = how far a slice hangs below the roof. y runs from 0 to 50.", "Weight of the slice: 0.5 <i>dy</i> pounds.", "Distance it gets lifted: <i>y</i> feet.", mx("<i>W</i> = ") + DI("0", "50", "0.5x", "y") + " = 0.25·2500 = 625 ft·lb"]) },
    { t: "Pumping liquid", h: "<p>Same idea with horizontal layers of water. Each layer has a weight and a distance to travel.</p>" +
      fig({ axes: false, w: 220, h: 200, x: [-1.6, 5.4], y: [-0.6, 5.8], seg: [[0, 0, 4, 0], [0, 0, 0, 5], [4, 0, 4, 5], [4.5, 2.15, 4.5, 5], [4.35, 5, 4.65, 5], [4.35, 2.15, 4.65, 2.15], [-0.5, 0, -0.5, 2.15], [-0.65, 0, -0.35, 0], [-0.65, 2.15, -0.35, 2.15]],
        fill: [{ top: "5", bot: "0", from: 0, to: 4 }], rect: [[0, 2, 4, 2.3]], lab: [[4.7, 3.5, "5 − y"], [-0.7, 1, "y", "end"], [2, 2.55, "one layer", "middle"]],
        alt: "A tank 5 meters tall, full of water. One thin layer sits at height y and has to be lifted 5 minus y to reach the top.", cap: "A layer at height y travels 5 − y to reach the top." }) +
      rule("<b>Work</b> = ∫ (weight per m³) × (area of the layer) × (distance lifted) <i>dy</i><br>Water weighs 9800 N per m³ (that’s density 1000 × gravity 9.8).") +
      "<p>A full cylinder tank has radius 2 m and height 5 m. How much work pumps all the water out over the top?</p>" +
      steps(["Layer area: π·2² = 4π m².", "A layer at height y is lifted 5 − y.", mx("<i>W</i> = ") + DI("0", "5", "9800*4pi*(5 - x)", "y"), "= 39200π·(25 − 12.5) = 490000π J"]) +
      "<p>The limits are where the <b>water</b> is. A half-full tank would run from 0 to 2.5, but the distance is still 5 − y.</p>" },
    { t: "Force on a dam", h: "<p>Water pressure grows with depth: pressure = 9800 × depth (in N/m²). Force = pressure × area. A dam’s face is at many depths, so slice it into horizontal strips.</p>" +
      rule("<b>Force</b> = ∫ 9800 × (depth) × (width of the strip) <i>dy</i>") +
      "<p>A rectangular dam is 20 m wide and the water behind it is 10 m deep.</p>" +
      steps(["Put y = 0 at the bottom. A strip at height y is at depth 10 − y.", "Its width is 20, so its area is 20 <i>dy</i>.", mx("<i>F</i> = ") + DI("0", "10", "9800*20*(10 - x)", "y"), "= 196000·50 = 9,800,000 N"]) }
  ],
  probs: [
    { k: "txt", text: "A 2 m bar has density " + mx("ρ(<i>x</i>) = 4 + 3<i>x</i><sup>2</sup>") + " kg/m. Find its mass in kg.", type: "number", ans: "16", chk: [["4 + 3x^2", "0", "2"]],
      hint: "Integrate the density from 0 to 2.", sol: [DI("0", "2", "4 + 3x^2") + " = " + M("4x + x^3") + " from 0 to 2", "8 + 8 = 16 kg"] },
    { k: "txt", text: "A 30 N force holds a spring stretched 0.5 m from its natural length. Find the spring constant <i>k</i>.", type: "number", ans: "60",
      hint: "Hooke’s law: F = kx. Plug in the force and the stretch.", sol: ["30 = k·0.5", "k = 60 N/m"] },
    { k: "txt", text: "Same spring (k = 60). How much work stretches it from its natural length to 0.5 m? Answer in joules.", type: "number", ans: "7.5", chk: [["60x", "0", "0.5"]],
      hint: "W = ∫ 60x dx from 0 to 0.5.", sol: [DI("0", "0.5", "60x") + " = " + M("30x^2") + " from 0 to 0.5", "30·0.25 = 7.5 J"] },
    { k: "txt", text: "Same spring (k = 60). How much work stretches it from 0.5 m to 1 m?", type: "number", ans: "22.5", chk: [["60x", "0.5", "1"]],
      hint: "Same integral, new limits. It takes more work than the first half meter.", sol: [M("30x^2") + " from 0.5 to 1", "30 − 7.5 = 22.5 J"] },
    { k: "txt", text: "A 40 ft rope weighing 0.5 lb per foot hangs off a roof. How much work (in ft·lb) pulls it all the way up?", type: "number", ans: "400", chk: [["0.5x", "0", "40"]],
      hint: "A slice hanging y feet down weighs 0.5 dy and gets lifted y.", sol: [DI("0", "40", "0.5x", "y") + " = " + M("0.25x^2", "y") + " from 0 to 40", "0.25·1600 = 400 ft·lb"] },
    { k: "txt", text: "A layer of water sits at height <i>y</i> in a tank 5 m tall. It’s pumped out over the top. How far is it lifted?", type: "choice", opts: [mx("<i>y</i>"), mx("5 − <i>y</i>"), "5"], ans: 1,
      why: ["y is how far the layer is from the bottom. It’s going to the top.", "", "Only the bottom layer travels the full 5 m."],
      hint: "Top of the tank minus where the layer is now.", sol: ["The top is at height 5 and the layer is at height y.", "Distance = 5 − y"] },
    { k: "txt", text: "A box-shaped tank has a 3 m × 2 m base and is 4 m tall. It’s full of water (9800 N per m³). How much work, in joules, pumps all of it out over the top?", type: "number", ans: "470400", chk: [["9800*6*(4 - x)", "0", "4"]],
      hint: "Layer area = 6 m². A layer at height y is lifted 4 − y. Type the number with no commas.", sol: [DI("0", "4", "9800*6*(4 - x)", "y"), "= 58800·(16 − 8)", "= 470,400 J"] },
    { k: "txt", text: "Same tank (3 m × 2 m base, 4 m tall), but the water is only 2 m deep. How much work pumps it out over the top?", type: "number", ans: "352800", chk: [["9800*6*(4 - x)", "0", "2"]],
      hint: "Only the limits change: the water is from y = 0 to y = 2. The distance is still 4 − y.", sol: [DI("0", "2", "9800*6*(4 - x)", "y"), "= 58800·(8 − 2)", "= 352,800 J"] },
    { k: "txt", text: "A rectangular dam is 10 m wide. The water behind it is 6 m deep. Find the total force on the dam in newtons.", type: "number", ans: "1764000", chk: [["9800*10*(6 - x)", "0", "6"]],
      hint: "A strip at height y is at depth 6 − y and has width 10.", sol: [DI("0", "6", "9800*10*(6 - x)", "y"), "= 98000·(36 − 18)", "= 1,764,000 N"] }
  ]
},

{ id: "C8", block: "C", date: "2026-11-07", title: "Exam 2 practice test", test: "Practice exam", star: true,
  topics: ["Everything on Exam 2: 6.1–6.7", "A timed practice test under exam conditions", "Sunday–Monday: redo misses, finish HW before Mon Nov 9", "Exam 2 is Tue Nov 10, 3:30 PM"],
  links: [["Khan: Applications of integrals", KA + "cs1-applications-of-integrals"], ["Paul: Calculus I practice problems (Applications of Integrals)", "https://tutorial.math.lamar.edu/Problems/CalcI/IntAppsIntro.aspx"]],
  parts: [
    { t: "What’s on Exam 2", h: "<p>Exam 2 is <b>Tue Nov 10 at 3:30 PM</b> and covers 6.1–6.7. Here’s every skill on it and where you learned it. If a row makes you nervous, reread that session first.</p>" +
      tbl(["Section", "Skill", "Review"], [
        ["6.1", "Displacement, total distance, position from velocity, net change", '<a href="#/s/C1">C1</a>'],
        ["6.2", "Area between curves, in x or in y, splitting where they cross", '<a href="#/s/C2">C2</a>, <a href="#/s/C3">C3</a>'],
        ["6.3", "Volume by slicing: disks and washers", '<a href="#/s/C4">C4</a>'],
        ["6.4", "Volume by shells", '<a href="#/s/C5">C5</a>'],
        ["6.5", "Arc length, including the perfect-square trick", '<a href="#/s/C6">C6</a>'],
        ["6.6", "Surface area", '<a href="#/s/C6">C6</a>'],
        ["6.7", "Mass, springs, lifting, pumping, force on a dam", '<a href="#/s/C7">C7</a>']
      ]) },
    { t: "Formulas to write from memory", h: tbl(["What", "Formula"], [
        ["Distance traveled", DIH("a", "b", "|" + VT + "|", "t")],
        ["Area between curves", DIH("a", "b", "(top − bottom)", "x") + " &nbsp;or&nbsp; " + DIH("c", "d", "(right − left)", "y")],
        ["Washers", mx("π") + DIH("a", "b", "(<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>)", "x")],
        ["Shells", DIH("a", "b", "2π·(radius)·(height)", "x")],
        ["Arc length", DIH("a", "b", '√<span class="ov">1 + [<i>f</i>′(<i>x</i>)]<sup>2</sup></span>', "x")],
        ["Surface area", DIH("a", "b", '2π <i>f</i>(<i>x</i>) √<span class="ov">1 + [<i>f</i>′(<i>x</i>)]<sup>2</sup></span>', "x")],
        ["Spring", mx("<i>F</i> = <i>kx</i>") + ", then " + mx("<i>W</i> = ") + DIH("a", "b", "<i>kx</i>", "x")],
        ["Pumping water", "∫ 9800 × (layer area) × (distance lifted) <i>dy</i>"]
      ]) + "<p>Cover the right column and write each one. Repeat until all eight come out clean.</p>" },
    { t: "How to take the practice test", h: steps([
        "Do it in one sitting, like the real thing: phone in another room, no notes, no hints.",
        "For every problem, <b>sketch first</b>. Most lost points in this chapter come from the setup, not the integral.",
        "Skim every problem and do the ones you know first.",
        "If one stalls you for 3 minutes, skip it and come back.",
        "Every miss goes to your mistake log. Sunday and Monday, redo them there, then finish any HW left before the Mon Nov 9 deadline."
      ]) + rule("Aim for 80%. If you’re under that, the mistake log tells you exactly which sessions to reread.") },
    { t: "Exam-day plan", h: "<p><b>Monday night:</b> HW done, mistakes redone, then stop. Sleep beats cramming.</p>" +
      "<p><b>Tuesday, an hour before:</b> write the eight formulas above once from memory. Nothing new.</p>" +
      "<p><b>During the exam:</b></p>" + steps([
        "Write the formulas on your scratch paper in the first minute.",
        "Sketch every region, and label which curve is on top (or on the right).",
        "For volumes, write “R = …, r = …” or “radius = …, height = …” before you write the integral.",
        "Before you hand it in: check that every area, volume and length came out positive, and that every answer has its π."
      ]) }
  ],
  probs: [
    { k: "txt", text: "A particle has velocity " + tq(VT, "x^2 - 4x + 3") + " m/s. Find the total distance it travels from t = 0 to t = 3.", type: "number", ans: "8/3", chk: [["abs(x^2 - 4x + 3)", "0", "3"]],
      hint: "Factor to find where v = 0: (t − 1)(t − 3). Split at t = 1.", sol: ["v = 0 at t = 1 and t = 3. Split at 1.", "0 to 1: " + M("x^3/3 - 2x^2 + 3x", "t") + " gives 4/3", "1 to 3: 0 − 4/3 = −4/3", "4/3 + 4/3 = 8/3 m"] },
    { k: "txt", text: "Find the area between " + yq("3 - x^2") + " and " + yq("2x") + ".", type: "number", ans: "32/3", chk: [["3 - x^2 - 2x", "-3", "1"]],
      hint: "Set them equal: x² + 2x − 3 = 0. Test x = 0 to see which is on top.", sol: [mx("(<i>x</i> + 3)(<i>x</i> − 1) = 0") + ", so x = −3 and x = 1", "At x = 0 the parabola gives 3 and the line gives 0. The parabola is on top.", DI("-3", "1", "3 - x^2 - 2x") + " = " + M("3x - x^3/3 - x^2") + " from −3 to 1", "5/3 − (−9) = 32/3"] },
    { k: "txt", text: "The region between " + yq("x") + " and " + yq("x^3") + " in the first quadrant is spun around the x-axis. Find the volume.", type: "number", ans: "4pi/21", chk: [["x^2 - (x^3)^2", "0", "1", "pi"]],
      hint: "Washers. They cross at 0 and 1. The line is farther from the axis.", sol: ["R = x, r = x³, so R² − r² = " + M("x^2 - x^6"), "π" + DI("0", "1", "x^2 - x^6") + " = π(1/3 − 1/7)", "= 4π/21"] },
    { k: "txt", text: "The region between " + yq("x - x^2") + " and the x-axis is spun around the y-axis. Find the volume.", type: "number", ans: "pi/6", chk: [["x(x - x^2)", "0", "1", "2pi"]],
      hint: "Shells. Radius = x, height = x − x², from 0 to 1.", sol: ["2π" + DI("0", "1", "x^2 - x^3"), "= 2π(1/3 − 1/4)", "= π/6"] },
    { k: "txt", text: "Find the length of " + yq("x^3/3 + 1/(4x)") + " from x = 1 to x = 3.", type: "number", ans: "53/6", chk: [["sqrt(1 + (x^2 - 1/(4x^2))^2)", "1", "3"]],
      hint: "f′ = " + M("x^2 - 1/(4x^2)") + ". The two terms multiply to 1/4, so flip the minus to a plus.", sol: ["1 + (f′)² = " + M("(x^2 + 1/(4x^2))^2"), DI("1", "3", "x^2 + 1/(4x^2)") + " = " + M("x^3/3 - 1/(4x)") + " from 1 to 3", "(9 − 1/12) − (1/3 − 1/4) = 107/12 − 1/12", "= 53/6"] },
    { k: "txt", text: "A 50 N force holds a spring stretched 0.25 m. How much work, in joules, stretches it from its natural length to 0.5 m?", type: "number", ans: "25", chk: [["200x", "0", "0.5"]],
      hint: "Find k from F = kx first.", sol: ["50 = k·0.25, so k = 200", DI("0", "0.5", "200x") + " = " + M("100x^2") + " from 0 to 0.5", "100·0.25 = 25 J"] }
  ],
  quiz: { minutes: 50, count: 12, name: "Practice test", blurb: "12 problems drawn from everything on Exam 2. No notes, no hints. Sketch each one before you set it up. Type pi for π and big numbers without commas. Missed problems go to your mistake log.", pool: [
    { k: "txt", text: "A particle has velocity " + tq(VT, "6 - 2x") + " m/s. Find its displacement from t = 0 to t = 4.", type: "number", ans: "8", chk: [["6 - 2x", "0", "4"]], sol: [DI("0", "4", "6 - 2x", "t") + " = " + M("6x - x^2", "t") + " from 0 to 4", "24 − 16 = 8"] },
    { k: "txt", text: "A particle has velocity " + tq(VT, "6 - 2x") + " m/s. Find the total distance it travels from t = 0 to t = 4.", type: "number", ans: "10", chk: [["abs(6 - 2x)", "0", "4"]], sol: ["v = 0 at t = 3. Split there.", DI("0", "3", "6 - 2x", "t") + " = 18 − 9 = 9", DI("3", "4", "6 - 2x", "t") + " = 8 − 9 = −1", "Distance: 9 + 1 = 10"] },
    { k: "txt", text: "A particle has acceleration " + tq(AT, "6x") + " and " + mx("<i>v</i>(0) = 2") + ". Find " + mx(VT) + ".", type: "expr", ivp: true, v: "t", ans: "3x^2 + 2", sol: ["v(t) = ∫6t dt = 3t² + C", "v(0) = 0 + C = 2, so C = 2", M("3x^2 + 2", "t")] },
    { k: "txt", text: "Find the area between " + yq("x^2") + " and " + yq("3x") + ".", type: "number", ans: "9/2", chk: [["3x - x^2", "0", "3"]], sol: ["Cross: x² = 3x, so x(x − 3) = 0: x = 0 or 3.", "At x = 1 the line (3) is above the parabola (1).", DI("0", "3", "3x - x^2") + " = " + M("3x^2/2 - x^3/3") + " from 0 to 3", "27/2 − 9 = 9/2"] },
    { k: "txt", text: "Find the area between " + yq("x^2") + " and " + yq("8 - x^2") + ".", type: "number", ans: "64/3", chk: [["8 - x^2 - x^2", "-2", "2"]], sol: ["Cross: x² = 8 − x², so x² = 4: x = ±2.", "At x = 0, 8 − x² is on top.", DI("-2", "2", "8 - 2x^2") + " = " + M("8x - 2x^3/3") + " from −2 to 2", "(16 − 16/3) − (−16 + 16/3) = 64/3"] },
    { k: "txt", text: "Use horizontal slices: find the area between " + xq("x^2") + " and " + mx("<i>x</i> = 9") + ".", type: "number", ans: "36", chk: [["9 - x^2", "-3", "3"]], sol: ["Cross: y² = 9, so y = ±3.", "Right minus left: 9 − y²", DI("-3", "3", "9 - x^2", "y") + " = " + M("9x - x^3/3", "y") + " from −3 to 3", "(27 − 9) − (−27 + 9) = 36"] },
    { k: "txt", text: "Find the area between " + yq("e^x") + " and " + yq("e^(-x)") + " from x = 0 to x = 1.", type: "number", ans: "e + 1/e - 2", chk: [["e^x - e^(-x)", "0", "1"]], sol: ["On 0 to 1, eˣ is on top (at x = 1: e vs 1/e).", DI("0", "1", "e^x - e^(-x)") + " = " + M("e^x + e^(-x)") + " from 0 to 1", "(e + 1/e) − (1 + 1) = e + 1/e − 2"] },
    { k: "txt", text: "The region under " + yq("x^2 + 1") + " from x = 0 to x = 1 is spun around the x-axis. Find the volume.", type: "number", ans: "28pi/15", chk: [["(x^2 + 1)^2", "0", "1", "pi"]], sol: ["Radius = x² + 1, so radius² = " + M("x^4 + 2x^2 + 1"), "π" + DI("0", "1", "x^4 + 2x^2 + 1") + " = π(1/5 + 2/3 + 1)", "= π(3 + 10 + 15)/15 = 28π/15"] },
    { k: "txt", text: "The region between " + yq("x^2") + " and " + yq("x^3") + " is spun around the x-axis. Find the volume.", type: "number", ans: "2pi/35", chk: [["(x^2)^2 - (x^3)^2", "0", "1", "pi"]], sol: ["They cross at x = 0 and 1. In between x² ≥ x³, so R = x² and r = x³.", "R² − r² = " + M("x^4 - x^6"), "π" + DI("0", "1", "x^4 - x^6") + " = π(1/5 − 1/7)", "= 2π/35"] },
    { k: "txt", text: "The region between " + yq("sqrt(x)") + ", " + mx("<i>y</i> = 2") + " and the y-axis is spun around the y-axis. Find the volume.", type: "number", ans: "32pi/5", chk: [["(x^2)^2", "0", "2", "pi"]], sol: ["Horizontal slices: x = y², from y = 0 to 2.", "Radius = y², so radius² = y⁴.", "π" + DI("0", "2", "x^4", "y") + " = π·32/5", "= 32π/5"] },
    { k: "txt", text: "The region under " + yq("4 - x^2") + " in the first quadrant is spun around the y-axis. Find the volume.", type: "number", ans: "8pi", chk: [["x(4 - x^2)", "0", "2", "2pi"]], sol: ["Shells: radius x, height 4 − x², from x = 0 to 2.", "2π" + DI("0", "2", "4x - x^3") + " = 2π(8 − 4)", "= 8π"] },
    { k: "txt", text: "The region under " + yq("cos(x^2)") + " from x = 0 to x = " + M("sqrt(pi/2)") + " is spun around the y-axis. Find the volume.", type: "number", ans: "pi", chk: [["x cos(x^2)", "0", "sqrt(pi/2)", "2pi"]], sol: ["Shells: radius x, height cos(x²).", "2π" + DI("0", "sqrt(pi/2)", "x cos(x^2)"), "u = x², du = 2x dx, so 2x dx = du. New limits: 0 to π/2.", "π" + DI("0", "pi/2", "cos(x)", "u") + " = π(sin(π/2) − sin 0) = π"] },

    { k: "txt", text: "Find the length of " + yq("(2/3)(x - 1)^(3/2)") + " from x = 1 to x = 4.", type: "number", ans: "14/3", chk: [["sqrt(1 + (sqrt(x - 1))^2)", "1", "4"]], sol: ["y′ = (x − 1)^(1/2), so 1 + (y′)² = 1 + (x − 1) = x.", DI("1", "4", "sqrt(x)") + " = " + M("(2/3)x^(3/2)") + " from 1 to 4", "(2/3)(8 − 1) = 14/3"] },

// a flashcard that asks for a sketch: the back shows the graph and one line to remember
function gcard(eq, g, note) {
  g.w = 200; g.h = 140; g.alt = "Graph";
  return ["Picture the graph of " + eq + ".", fig(g) + '<span style="display:block;font-size:15px">' + note + "</span>"];
}
