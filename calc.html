{ id: "C2", block: "C", date: "2026-10-23", title: "Sketching graphs and finding intersections", test: "Recall drill", flash: "graphs",
  topics: ["Common graphs by heart", "Solving f(x) = g(x) for crossing points", "Which curve is on top", "Rewriting a curve as x = g(y)"],
  links: [["Paul: Common Graphs", P1 + "CommonGraphs.aspx"], ["Paul: Solving Equations", PA + "Solving.aspx"], ["Paul: Transformations", PA + "Transformations.aspx"]],
  parts: [
    { t: "Why this comes first", h: "<p>Every area and volume problem in 6.2–6.4 starts the same way: <b>sketch the region, find where the curves cross, and see which one is on top</b>. The integral at the end is the easy part.</p><p>This session is that setup, with no calculus in it. If it feels quick, good. Drill the Flashcards tab until the shapes are automatic.</p>" },
    { t: "Graphs to know by heart", h: tbl(["Shape", "Curve", "What to remember"], [
        [fig({ w: 120, h: 86, x: [-2.4, 2.4], y: [-0.8, 4.6], curves: [{ f: "x^2" }], alt: "Parabola opening up" }), yq("x^2"), "A U with its lowest point at (0, 0). Through (1, 1) and (2, 4)."],
        [fig({ w: 120, h: 86, x: [-2, 2], y: [-4, 4], curves: [{ f: "x^3" }], alt: "Cubic curve" }), yq("x^3"), "An S through (0, 0). Negative on the left, positive on the right."],
        [fig({ w: 120, h: 86, x: [-0.6, 4.6], y: [-0.5, 2.6], curves: [{ f: "sqrt(x)", from: 0 }], alt: "Square root curve" }), yq("sqrt(x)"), "Starts at (0, 0), rises, then flattens. Through (1, 1) and (4, 2)."],
        [fig({ w: 120, h: 86, x: [-3.2, 3.2], y: [-3.6, 3.6], curves: [{ f: "1/x", from: 0.2 }, { f: "1/x", to: -0.2 }], alt: "Hyperbola" }), yq("1/x"), "Huge near x = 0, close to 0 far out. Through (1, 1)."],
        [fig({ w: 120, h: 86, x: [-2.6, 2.2], y: [-0.8, 5], curves: [{ f: "e^x" }], alt: "Exponential curve" }), yq("e^x"), "Always above the x-axis. Through (0, 1). Shoots up to the right."],
        [fig({ w: 120, h: 86, x: [-0.6, 5], y: [-2.4, 2.2], curves: [{ f: "ln(x)", from: 0.08 }], alt: "Natural log curve" }), yq("ln(x)"), "Only exists for x &gt; 0. Through (1, 0). Climbs slowly."],
        [fig({ w: 120, h: 86, x: [-0.5, 6.6], y: [-1.5, 1.5], curves: [{ f: "sin(x)", from: 0, to: 6.283 }, { f: "cos(x)", from: 0, to: 6.283, alt: true }], alt: "Sine and cosine from 0 to 2 pi" }), yq("sin(x)") + " and " + yq("cos(x)"), "sin starts at 0 and peaks at π/2. cos (blue) starts at 1 and hits 0 at π/2. They cross at π/4."]]) },
    { t: "Shifts and flips", h: tbl(["Change", "What it does", "Example"], [
        [mx("<i>f</i>(<i>x</i>) + <i>k</i>"), "Moves the graph up <i>k</i>", yq("x^2 + 1") + ": the U, raised 1"],
        [mx("<i>f</i>(<i>x</i> − <i>h</i>)"), "Moves it right <i>h</i>", yq("(x - 2)^2") + ": the U, with its bottom at x = 2"],
        [mx("−<i>f</i>(<i>x</i>)"), "Flips it upside down", yq("-x^2") + ": an upside-down U"]]) +
      "<p>Put two together: " + yq("4 - x^2") + " is the U flipped over and raised 4, so its top is at (0, 4).</p>" +
      fig({ x: [-3, 3], y: [-1.2, 4.8], curves: [{ f: "4 - x^2", from: -2, to: 2 }], xt: [-2, 2], lab: [[0.2, 4.25, "(0, 4)"]], alt: "Upside-down parabola with its top at (0, 4), crossing the x-axis at -2 and 2" }) +
      "<p>To find where a graph crosses the x-axis, set y = 0. Here " + mx("4 − <i>x</i><sup>2</sup> = 0") + " gives x = −2 and x = 2.</p>" },
    { t: "Where two curves cross", h: steps(["Set the two formulas equal to each other.", "Move everything to one side so it equals 0.", "Factor, then set each factor to 0."]) +
      "<p>Where do " + yq("x^2") + " and " + yq("x + 2") + " cross?</p>" +
      steps([mx("<i>x</i><sup>2</sup> = <i>x</i> + 2"), mx("<i>x</i><sup>2</sup> − <i>x</i> − 2 = 0"), mx("(<i>x</i> − 2)(<i>x</i> + 1) = 0") + ", so x = 2 or x = −1", "Plug back in for the points: (−1, 1) and (2, 4)."]) +
      rule("<b>Never divide both sides by x.</b> You lose the answer x = 0. For " + mx("<i>x</i><sup>3</sup> = <i>x</i>") + ", move it over and factor: " + mx("<i>x</i>(<i>x</i> − 1)(<i>x</i> + 1) = 0") + ", so x = −1, 0, 1.") },
    { t: "Which curve is on top?", h: "<p>Pick any x between two crossing points and plug it into both formulas. The bigger result is the top curve <b>for that whole stretch</b>.</p>" +
      fig({ x: [-2.2, 3.2], y: [-0.7, 5.4], curves: [{ f: "x^2", from: -1.7, to: 2.12 }, { f: "x + 2", from: -2, to: 3, alt: true }], fill: [{ top: "x + 2", bot: "x^2", from: -1, to: 2 }], xt: [-1, 2], dots: [[-1, 1], [2, 4]],
        lab: [[2.3, 3.2, "y = x²"], [1.85, 5, "y = x + 2", "end"]], alt: "The line y = x + 2 sits above the parabola y = x squared between x = -1 and x = 2" }) +
      "<p>Between x = −1 and x = 2, try x = 0: the line gives 2 and the parabola gives 0. The line is on top.</p><p>If the curves cross again, test each stretch separately. The top curve can change.</p>" },
    { t: "Sideways: x in terms of y", h: "<p>Some regions are easier to slice horizontally. Then you need each curve written as <b>x = (something with y)</b>. Solve for x.</p>" +
      tbl(["Written as y = …", "Same curve as x = …"], [[yq("sqrt(x)"), xq("x^2") + " &nbsp;(top half only)"], [yq("x - 2"), xq("x + 2")], [yq("x^3"), xq("cbrt(x)")], [yq("ln(x)"), xq("e^x")]]) +
      fig({ x: [-0.8, 5], y: [-2.2, 2.9], curves: [{ f: "x^2", inv: true, from: -1.9, to: 2.15 }, { f: "x + 2", inv: true, from: -2, to: 2.6, alt: true }], fill: [{ top: "x + 2", bot: "x^2", from: -1, to: 2, inv: true }], dots: [[1, -1], [4, 2]], yt: [-1, 2],
        lab: [[1.2, -1.95, "x = y²"], [3.55, 0.85, "x = y + 2"]], alt: "A sideways parabola x = y squared and the line x = y + 2, crossing at y = -1 and y = 2" }) +
      "<p>" + xq("x^2") + " is a parabola lying on its side. It crosses " + xq("x + 2") + " where " + mx("<i>y</i><sup>2</sup> = <i>y</i> + 2") + ", at y = −1 and y = 2. For sideways slices you compare <b>right and left</b> instead of top and bottom: here the line is on the right.</p>" }
  ],
  probs: [
    { k: "txt", text: "Find the x-values where " + yq("x^2") + " and " + yq("2x") + " cross. Type them separated by a comma.", type: "set", ans: "0, 2",
      hint: "Set them equal, move everything to one side, and factor out x.", sol: [mx("<i>x</i><sup>2</sup> − 2<i>x</i> = 0"), mx("<i>x</i>(<i>x</i> − 2) = 0"), "x = 0 or x = 2"] },
    { k: "txt", text: "Find the x-values where " + yq("x^2") + " and " + yq("x + 6") + " cross.", type: "set", ans: "-2, 3",
      hint: "You need two numbers that multiply to −6 and add to −1.", sol: [mx("<i>x</i><sup>2</sup> − <i>x</i> − 6 = 0"), mx("(<i>x</i> − 3)(<i>x</i> + 2) = 0"), "x = 3 or x = −2"] },
    { k: "txt", text: "Find the x-values where " + yq("x^3") + " and " + yq("4x") + " cross. There are three.", type: "set", ans: "-2, 0, 2",
      hint: "Don’t divide by x. Factor it out instead.", sol: [mx("<i>x</i><sup>3</sup> − 4<i>x</i> = 0"), mx("<i>x</i>(<i>x</i> − 2)(<i>x</i> + 2) = 0"), "x = −2, 0, 2"] },
    { k: "txt", text: "Where does " + yq("9 - x^2") + " cross the x-axis?", type: "set", ans: "-3, 3",
      hint: "Set y = 0.", sol: [mx("9 − <i>x</i><sup>2</sup> = 0"), mx("<i>x</i><sup>2</sup> = 9"), "x = −3 or x = 3"] },
    { k: "txt", text: yq("x^2") + " and " + yq("2x") + " cross at x = 0 and x = 2. Which one is on top between them?", type: "choice", opts: [yq("2x"), yq("x^2")], ans: 0,
      why: ["", "Try x = 1: the parabola gives 1, but the line gives 2."],
      hint: "Plug x = 1 into both.", sol: ["At x = 1: 2x = 2 and x² = 1.", "2 is bigger, so the line is on top from 0 to 2."] },
    { k: "txt", text: "Find the x-values where " + yq("sqrt(x)") + " and " + yq("x/2") + " cross.", type: "set", ans: "0, 4",
      hint: "Square both sides to clear the root, then factor.", sol: ["Square both sides: " + mx("<i>x</i> = <i>x</i><sup>2</sup>/4"), mx("<i>x</i><sup>2</sup> − 4<i>x</i> = 0") + ", so " + mx("<i>x</i>(<i>x</i> − 4) = 0"), "x = 0 or x = 4. Check: √4 = 2 and 4/2 = 2 ✓"] },
    { k: "txt", text: "Rewrite " + yq("x^2 + 1") + " (for x ≥ 0) as x = … Type the right side, using y.", type: "expr", v: "y", ans: "sqrt(x - 1)", pts: [1.2, 1.6, 2.1, 2.9, 3.5, 4.4],
      hint: "Subtract 1 from both sides, then take the square root.", sol: [mx("<i>y</i> − 1 = <i>x</i><sup>2</sup>"), xq("sqrt(x - 1)")] },
    { k: "txt", text: "Find the y-values where " + xq("x^2") + " and " + xq("x + 6") + " cross.", type: "set", ans: "-2, 3",
      hint: "Same method, with y as the variable.", sol: [mx("<i>y</i><sup>2</sup> − <i>y</i> − 6 = 0"), mx("(<i>y</i> − 3)(<i>y</i> + 2) = 0"), "y = 3 or y = −2"] }
  ]
},
/* ================= C3 ================= */
{ id: "C3", block: "C", date: "2026-10-25", title: "Area between curves", test: "Problem set",
  topics: ["Top minus bottom (dx) or right minus left (dy)", "When to split into pieces"],
  links: [["Paul: Area Between Curves", P1 + "AreaBetweenCurves.aspx"]],
  parts: [
    { t: "The idea", h: "<p>Cut the region into thin vertical strips. Each strip is a rectangle: its height is <b>top curve − bottom curve</b>, and its width is <i>dx</i>. The integral adds them up.</p>" +
      fig({ x: [-2.2, 3.2], y: [-0.7, 5.4], curves: [{ f: "x^2", from: -1.7, to: 2.12 }, { f: "x + 2", from: -2, to: 3, alt: true }], fill: [{ top: "x + 2", bot: "x^2", from: -1, to: 2 }], rect: [[0.9, 1, 1.1, 3]], xt: [-1, 2],
        lab: [[2.3, 3.2, "y = x²"], [1.85, 5, "y = x + 2", "end"]], alt: "The region between the line y = x + 2 and the parabola y = x squared, with one thin vertical strip drawn in", cap: "One strip. Its height is (x + 2) − x²." }) +
      rule(mx("Area = ") + DIH("a", "b", "(top − bottom)", "x")) +
      "<p>It doesn’t matter if part of the region is below the x-axis. Top − bottom is always positive.</p>" },
    { t: "The 4-step recipe", h: steps(["<b>Sketch</b> both curves.", "<b>Find where they cross.</b> Those x-values are your limits, unless the problem gives you limits.", "<b>Decide which is on top</b> by plugging in a test point.", "<b>Integrate</b> top − bottom."]) +
      "<p>Steps 1–3 are session <a href=\"#/s/C2\">C2</a>. Step 4 is Block B.</p>" },
    { t: "Worked example", h: "<p>Find the area between " + yq("x + 2") + " and " + yq("x^2") + " (the region pictured in part 1).</p>" +
      steps(["They cross where " + mx("<i>x</i><sup>2</sup> = <i>x</i> + 2") + ": x = −1 and x = 2.", "Test x = 0: the line gives 2, the parabola gives 0. The line is on top.", "Area = " + DI("-1", "2", "x + 2 - x^2"), "Antiderivative: " + M("x^2/2 + 2x - x^3/3"), "Top limit: 2 + 4 − 8/3 = 10/3. Bottom limit: 1/2 − 2 + 1/3 = −7/6.", "10/3 − (−7/6) = 27/6 = 9/2"]) },
    { t: "When the curves trade places", h: "<p>If the curves cross inside the region, the top one changes. <b>Split at the crossing</b> and do each piece separately.</p>" +
      fig({ x: [-1.5, 1.5], y: [-1.3, 1.3], curves: [{ f: "x^3", from: -1.08, to: 1.08 }, { f: "x", from: -1.25, to: 1.25, alt: true }], fill: [{ top: "x^3", bot: "x", from: -1, to: 0 }, { top: "x", bot: "x^3", from: 0, to: 1 }], xt: [-1, 1],
        lab: [[0.2, 0.8, "y = x"], [0.75, 0.12, "y = x³"]], alt: "The line y = x and the cubic y = x cubed. The cubic is on top from -1 to 0 and the line is on top from 0 to 1." }) +
      "<p>Area between " + yq("x^3") + " and " + yq("x") + ":</p>" +
      steps(["They cross at x = −1, 0, 1.", "From −1 to 0 the cubic is on top. From 0 to 1 the line is on top.", "Right piece: " + DI("0", "1", "x - x^3") + " = 1/2 − 1/4 = 1/4", "The left piece is the same size by symmetry: 1/4.", "Total: 1/2"]) +
      rule("If you skip the split and integrate " + M("x - x^3") + " from −1 to 1, you get 0. The two pieces cancel. An area of 0 or a negative area means you missed a split.") },
    { t: "Sideways slices (dy)", h: "<p>Sometimes vertical strips are awkward: the bottom curve changes partway across. Slice <b>horizontally</b> instead.</p>" +
      fig({ x: [-0.8, 5], y: [-2.2, 2.9], curves: [{ f: "x^2", inv: true, from: -1.9, to: 2.15 }, { f: "x + 2", inv: true, from: -2, to: 2.6, alt: true }], fill: [{ top: "x + 2", bot: "x^2", from: -1, to: 2, inv: true }], rect: [[0.25, 0.42, 2.5, 0.58]], yt: [-1, 2],
        lab: [[1.2, -1.95, "x = y²"], [3.55, 0.85, "x = y + 2"]], alt: "The region between the sideways parabola x = y squared and the line x = y + 2, with one thin horizontal strip drawn in", cap: "One horizontal strip. Its length is (y + 2) − y²." }) +
      rule(mx("Area = ") + DIH("c", "d", "(right − left)", "y") + "<br>Write both curves as x = …, and use y-values for the limits.") +
      steps(["The curves cross where " + mx("<i>y</i><sup>2</sup> = <i>y</i> + 2") + ": y = −1 and y = 2.", "The line is on the right.", "Area = " + DI("-1", "2", "x + 2 - x^2", "y") + " = 9/2"]) +
      "<p>With vertical strips this region needs two integrals, because the bottom edge switches from the parabola to the line at x = 1. With horizontal strips it needs one.</p>" }
  ],
  probs: [
    { k: "txt", text: "Find the area between " + yq("x") + " and " + yq("x^2") + ".", type: "number", ans: "1/6", chk: [["x - x^2", "0", "1"]],
      hint: "They cross at x = 0 and x = 1. Which is bigger at x = 1/2?", sol: ["At x = 1/2: the line gives 1/2, the parabola gives 1/4. The line is on top.", DI("0", "1", "x - x^2") + " = 1/2 − 1/3", "= 1/6"] },
    { k: "txt", text: "Find the area between " + yq("4 - x^2") + " and the x-axis.", type: "number", ans: "32/3", chk: [["4 - x^2", "-2", "2"]],
      hint: "The curve crosses the axis at x = −2 and x = 2. The bottom curve is y = 0.", sol: [DI("-2", "2", "4 - x^2"), "Even function: 2 × (8 − 8/3) = 2 × 16/3", "= 32/3"] },
    { k: "txt", text: "Find the area between " + yq("x^2") + " and " + yq("2x") + ".", type: "number", ans: "4/3", chk: [["2x - x^2", "0", "2"]],
      hint: "They cross at x = 0 and x = 2. The line is on top.", sol: [DI("0", "2", "2x - x^2") + " = " + M("x^2 - x^3/3") + " from 0 to 2", "4 − 8/3 = 4/3"] },
    { k: "txt", text: "Find the area between " + yq("sqrt(x)") + " and " + yq("x/2") + ".", type: "number", ans: "4/3", chk: [["sqrt(x) - x/2", "0", "4"]],
      hint: "They cross at x = 0 and x = 4. At x = 1 the root gives 1 and the line gives 1/2.", sol: [DI("0", "4", "sqrt(x) - x/2") + " = " + M("(2/3)x^(3/2) - x^2/4") + " from 0 to 4", "(2/3)(8) − 4 = 16/3 − 4", "= 4/3"] },
    { k: "txt", text: "Find the <b>total</b> area between " + yq("x^3") + " and " + yq("4x") + ".", type: "number", ans: "8", chk: [["abs(4x - x^3)", "-2", "2"]],
      hint: "They cross at x = −2, 0 and 2, so there are two pieces. The top curve switches at 0.", sol: ["Right piece (0 to 2), line on top: " + DI("0", "2", "4x - x^3") + " = 8 − 4 = 4", "The left piece is the same size by symmetry: 4", "Total: 8"] },
    { k: "txt", text: "Find the area between " + yq("e^x") + " and " + mx("<i>y</i> = 1") + " from x = 0 to x = 1.", type: "number", ans: "e - 2", chk: [["e^x - 1", "0", "1"]],
      hint: "The limits are given. " + M("e^x") + " is on top. Type e for Euler’s number.", sol: [DI("0", "1", "e^x - 1") + " = " + M("e^x - x") + " from 0 to 1", "(e − 1) − (1 − 0)", "= e − 2"] },
    { k: "txt", text: "Use horizontal slices: find the area between " + xq("x^2") + " and " + xq("x + 6") + ".", type: "number", ans: "125/6", chk: [["x + 6 - x^2", "-2", "3"]],
      hint: "They cross at y = −2 and y = 3. The line is on the right. Integrate right − left in y.", sol: [DI("-2", "3", "x + 6 - x^2", "y") + " = " + M("x^2/2 + 6x - x^3/3", "y") + " from −2 to 3", "Top: 9/2 + 18 − 9 = 27/2. Bottom: 2 − 12 + 8/3 = −22/3.", "27/2 + 22/3 = 125/6"] },
    { k: "txt", text: "Find the area between " + yq("cos(x)") + " and " + yq("sin(x)") + " from x = 0 to x = π/4.", type: "number", ans: "sqrt(2) - 1", chk: [["cos(x) - sin(x)", "0", "pi/4"]],
      hint: "On this stretch cos is on top. Remember sin(π/4) = cos(π/4) = √2/2. Type sqrt(2).", sol: [DI("0", "pi/4", "cos(x) - sin(x)") + " = " + M("sin(x) + cos(x)") + " from 0 to π/4", "(√2/2 + √2/2) − (0 + 1)", "= √2 − 1"] }
  ]
},
/* ================= C4 ================= */
{ id: "C4", block: "C", date: "2026-10-27", title: "Volumes by slicing: disks and washers", test: "Problem set",
  topics: ["Volume = integral of the slice area", "Disk and washer area", "Choosing dx vs dy from the axis of rotation"],
  links: [["Paul: Area & Volume Formulas", P1 + "Area_Volume_Formulas.aspx"], ["Paul: Volumes (Rings)", P1 + "VolumeWithRings.aspx"], ["Paul: More Volume Problems", P1 + "MoreVolume.aspx"]],
  parts: [
    { t: "Volume = add up the slices", h: "<p>Cut a solid into thin slices, like a loaf of bread. Each slice has volume (area of its face) × (thickness). An integral adds them up.</p>" +
      rule(mx("<i>V</i> = ") + DIH("a", "b", "<i>A</i>(<i>x</i>)", "x") + ", where " + mx("<i>A</i>(<i>x</i>)") + " is the area of the slice at <i>x</i>") +
      "<p>Example: every slice of a solid is a square with side " + M("sqrt(x)") + ", for 0 ≤ x ≤ 4. Then " + mx("<i>A</i>(<i>x</i>) = (√<i>x</i>)<sup>2</sup> = <i>x</i>") + ", and " + mx("<i>V</i> = ") + DI("0", "4", "x") + " = 8.</p>" },
    { t: "Disks", h: "<p>Take the region under a curve and spin it around the x-axis. Each thin vertical strip sweeps out a <b>disk</b>: a circle whose radius is the height of the curve.</p>" +
      fig({ x: [-0.5, 4.8], y: [-0.6, 2.7], curves: [{ f: "sqrt(x)", from: 0, to: 4.3 }], fill: [{ top: "sqrt(x)", bot: "0", from: 0, to: 4 }], rect: [[1.9, 0, 2.1, 1.414]], xt: [4], seg: [[4, 0, 4, 2, true]],
        lab: [[2.25, 0.62, "radius = √x"], [3.1, 2.25, "y = √x", "end"]], alt: "The region under y = square root of x from 0 to 4, with one thin vertical strip", cap: "Spin the strip around the x-axis and it sweeps out a disk." }) +
      rule(mx("<i>V</i> = π") + DIH("a", "b", "(radius)<sup>2</sup>", "x") + "<br>The area of a circle is π·(radius)². Here the radius is " + mx("<i>f</i>(<i>x</i>)") + ".") +
      "<p>For " + yq("sqrt(x)") + " on [0, 4]: " + mx("<i>V</i> = π") + DI("0", "4", "x") + " = 8π. Square the radius <b>before</b> you integrate.</p>" },
    { t: "Washers", h: "<p>If the region doesn’t touch the axis, each slice is a disk with a hole in it: a <b>washer</b>.</p>" +
      fig({ x: [-0.25, 1.45], y: [-0.2, 1.25], curves: [{ f: "x^2", from: 0, to: 1.1 }, { f: "x", from: 0, to: 1.2, alt: true }], fill: [{ top: "x", bot: "x^2", from: 0, to: 1 }], rect: [[0.57, 0.36, 0.63, 0.6]], xt: [1],
        seg: [[0.6, 0, 0.6, 0.36, true]], lab: [[0.66, 0.16, "r = x²"], [0.5, 0.66, "R = x", "end"]], alt: "The region between y = x and y = x squared from 0 to 1, with one thin vertical strip that does not reach the axis", cap: "The strip doesn’t reach the axis, so the slice has a hole." }) +
      rule(mx("<i>V</i> = π") + DIH("a", "b", "(<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>)", "x") + "<br><i>R</i> = outer radius, the curve <b>farther</b> from the axis. <i>r</i> = inner radius, the closer one.") +
      "<p>Spin the region between " + yq("x") + " and " + yq("x^2") + " around the x-axis:</p>" +
      steps(["They cross at x = 0 and x = 1. The line is farther from the axis, so R = x and r = x².", mx("<i>V</i> = π") + DI("0", "1", "x^2 - x^4"), "= π(1/3 − 1/5) = 2π/15"]) +
      rule("It’s " + mx("<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>") + ", <b>not</b> " + mx("(<i>R</i> − <i>r</i>)<sup>2</sup>") + ". Square each radius first, then subtract.") },

{ id: "C5", block: "C", date: "2026-10-29", title: "Volumes by shells", test: "Problem set",

    { t: "A different kind of slice", h: "<p>Washers use strips <b>perpendicular</b> to the axis. Shells use strips <b>parallel</b> to it. Spin a thin vertical strip around the y-axis and it sweeps out a hollow tube, like a soup can with no ends.</p>" +

        alt: "The region under y = 2x - x squared from 0 to 2, with one thin vertical strip at distance x from the y-axis", cap: "Spin this strip around the y-axis and it sweeps out a thin tube." }) +

    { t: "Shells around the y-axis", h: steps(["Use vertical strips, so integrate in <i>x</i>.", "<b>Radius</b> = the strip’s distance from the y-axis = <i>x</i>.", "<b>Height</b> = top curve − bottom curve."]) +
      "<p>Spin the region under " + yq("2x - x^2") + " (above the x-axis) around the y-axis:</p>" +
      steps(["The curve meets the axis at x = 0 and x = 2.", "Radius = x. Height = " + M("2x - x^2") + ".", mx("<i>V</i> = 2π") + DI("0", "2", "x(2x - x^2)") + " = 2π" + DI("0", "2", "2x^2 - x^3"), "= 2π(16/3 − 4) = 8π/3"]) +
      "<p>With washers you’d have to solve " + yq("2x - x^2") + " for x. Shells skip that.</p>" },
    { t: "Shells around the x-axis", h: "<p>Turn everything sideways. Use horizontal strips and integrate in <i>y</i>.</p>" +
      steps(["<b>Radius</b> = the strip’s distance from the x-axis = <i>y</i>.", "<b>Height</b> (really a length now) = right curve − left curve, both written as x = …"]) +
      "<p>Spin the region between " + yq("sqrt(x)") + ", the x-axis and " + mx("<i>x</i> = 4") + " around the x-axis:</p>" +
      steps(["The curve is " + xq("x^2") + ". A strip at height y runs from there to x = 4, so its length is " + M("4 - x^2", "y") + ".", "y runs from 0 to 2.", mx("<i>V</i> = 2π") + DI("0", "2", "x(4 - x^2)", "y") + " = 2π(8 − 4) = 8π"]) +
      "<p>That matches the 8π from disks in <a href=\"#/s/C4\">C4</a>. Both methods always give the same volume.</p>" },
    { t: "Spinning around another line", h: "<p>Only the <b>radius</b> changes. It’s the distance from the strip to the line you spin around.</p>" +
      tbl(["Spin around", "Radius of a strip at x"], [["the y-axis (x = 0)", mx("<i>x</i>")], ["the line x = 3 (to the right of the region)", mx("3 − <i>x</i>")], ["the line x = −1 (to the left)", mx("<i>x</i> + 1")]]) +
      "<p>Spin the region under " + yq("x^2") + " from 0 to 2 around " + mx("<i>x</i> = 2") + ":</p>" +
      steps(["Radius = 2 − x. Height = x².", mx("<i>V</i> = 2π") + DI("0", "2", "(2 - x)x^2") + " = 2π" + DI("0", "2", "2x^2 - x^3"), "= 2π(16/3 − 4) = 8π/3"]) },
    { t: "Shells or washers?", h: tbl(["", "Disks / washers", "Shells"], [
        ["Strips are", "perpendicular to the axis", "parallel to the axis"],
        ["Around a vertical axis", "integrate in <i>y</i>", "integrate in <i>x</i>"],
        ["Around a horizontal axis", "integrate in <i>x</i>", "integrate in <i>y</i>"],
        ["Formula", mx("π(<i>R</i><sup>2</sup> − <i>r</i><sup>2</sup>)"), "2π·(radius)·(height)"]]) +
      rule("<b>Pick the variable first.</b> If the curves are given as y = (something with x) and are hard to solve for x, stay in <i>x</i>. Then the axis tells you the method: strips perpendicular to it are washers, strips parallel to it are shells.") }
  ],
  probs: [

      hint: "Radius = x, height = x². Type pi for π.", sol: ["2π" + DI("0", "2", "x^3"), "= 2π·4", "= 8π"] },
    { k: "txt", text: "The region under " + yq("1/x") + " from x = 1 to x = 3 is spun around the y-axis. Find the volume.", type: "number", ans: "4pi", chk: [["x*(1/x)", "1", "3", "2pi"]],

    { k: "txt", text: "The region between " + yq("x") + " and " + yq("x^2") + " is spun around the y-axis. Find the volume.", type: "number", ans: "pi/6", chk: [["x(x - x^2)", "0", "1", "2pi"]],
      hint: "Radius = x. Height = top − bottom = x − x².", sol: ["2π" + DI("0", "1", "x(x - x^2)") + " = 2π" + DI("0", "1", "x^2 - x^3"), "= 2π(1/3 − 1/4) = 2π/12", "= π/6"] },
    { k: "txt", text: "The region under " + yq("sin(x^2)") + " from x = 0 to x = " + M("sqrt(pi)") + " is spun around the y-axis. Find the volume.", type: "number", ans: "2pi", chk: [["x sin(x^2)", "0", "sqrt(pi)", "2pi"]],
      hint: "Shells put an x next to sin(x²), which is exactly what u = x² needs.", sol: ["u = x², so x dx = du/2. Limits become 0 to π.", "2π·(1/2)" + DI("0", "pi", "sin(x)", "u") + " = π·2", "= 2π"] },
    { k: "txt", text: "The region between " + xq("x^2") + ", the y-axis and " + mx("<i>y</i> = 3") + " is spun around the <b>x-axis</b>. Use shells to find the volume.", type: "number", ans: "81pi/2", chk: [["x*x^2", "0", "3", "2pi"]],
      hint: "Horizontal strips. Radius = y. Length = y² − 0. y runs from 0 to 3.", sol: ["2π" + DI("0", "3", "x^3", "y"), "= 2π·81/4", "= 81π/2"] },
    { k: "txt", text: "The region under " + yq("sqrt(x)") + " from x = 0 to x = 1 is spun around the line " + mx("<i>x</i> = 1") + ". Find the volume.", type: "number", ans: "8pi/15", chk: [["(1 - x)sqrt(x)", "0", "1", "2pi"]],
      hint: "Radius = 1 − x. Height = √x. Multiply out before integrating.", sol: ["Radius × height = " + M("x^(1/2) - x^(3/2)"), "2π" + DI("0", "1", "x^(1/2) - x^(3/2)") + " = 2π(2/3 − 2/5)", "= 2π·4/15 = 8π/15"] },
    { k: "txt", text: "The region under " + yq("2x - x^2") + " is spun around the y-axis. Which method avoids solving for x?", type: "choice", opts: ["Shells, integrating in x", "Washers, integrating in y"], ans: 0,

{ id: "C6", block: "C", date: "2026-11-01", title: "Arc length and surface area", test: "Problem set",
  topics: ["∫ √(1 + (f′)²) dx", "Simplifying 1 + (f′)² into a perfect square", "Surface area formula"],
  links: [["Paul: Arc Length", P2 + "ArcLength.aspx"], ["Paul: Surface Area", P2 + "SurfaceArea.aspx"]],
  parts: [
    { t: "The arc length formula", h: "<p>To measure a curve, cut it into tiny straight pieces. Each piece is the long side of a tiny right triangle with legs <i>dx</i> and <i>dy</i>.</p>" +
      fig({ x: [-0.3, 3.4], y: [-0.3, 3.6], curves: [{ f: "0.3x^2 + 0.4", from: 0, to: 3.1 }], seg: [[1.4, 0.988, 2.4, 0.988], [2.4, 0.988, 2.4, 2.128], [1.4, 0.988, 2.4, 2.128, true]], dots: [[1.4, 0.988], [2.4, 2.128]],
        lab: [[1.9, 0.68, "dx", "middle"], [2.5, 1.5, "dy"], [1.75, 1.75, "piece", "end"]], alt: "A curve with a small right triangle under it. The legs are dx and dy, and the slanted side follows the curve.", cap: "Pythagoras: (piece)² = dx² + dy²" }) +
      rule(mx("<i>L</i> = ") + DIH("a", "b", '√<span class="ov">1 + [<i>f</i>′(<i>x</i>)]<sup>2</sup></span>', "x")) +
      "<p>The formula is short. The work is all in simplifying what’s under the root.</p>" },
    { t: "The recipe", h: steps(["Find " + mx("<i>f</i>′(<i>x</i>)") + ".", "<b>Square it.</b>", "<b>Add 1.</b>", "Simplify. Look for a perfect square, so the root cancels.", "Integrate."]) +
      "<p>Length of " + yq("(2/3)x^(3/2)") + " from x = 0 to x = 3:</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = ") + M("x^(1/2)"), "Square it: " + M("x"), "Add 1: " + M("1 + x"), mx("<i>L</i> = ") + DI("0", "3", "sqrt(1 + x)") + " = " + M("(2/3)(1 + x)^(3/2)") + " from 0 to 3", "(2/3)(8 − 1) = 14/3"]) },
    { t: "The perfect-square trick", h: "<p>Homework and exam problems are built so that " + mx("1 + (<i>f</i>′)<sup>2</sup>") + " turns into a perfect square. Here’s the usual pattern.</p>" +
      "<p>Length of " + yq("x^3/6 + 1/(2x)") + " from x = 1 to x = 2:</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = ") + M("x^2/2 - 1/(2x^2)"),
        "Square it: " + M("x^4/4 - 1/2 + 1/(4x^4)") + ". The middle term is 2 × (first)(second) = −1/2.",
        "Add 1: " + M("x^4/4 + 1/2 + 1/(4x^4)") + ". Only the middle sign changed.",
        "That’s the same square with a plus inside: " + M("(x^2/2 + 1/(2x^2))^2"),
        "The root removes the square: " + mx("<i>L</i> = ") + DI("1", "2", "x^2/2 + 1/(2x^2)"),
        "= " + M("x^3/6 - 1/(2x)") + " from 1 to 2 = 13/12 − (−4/12) = 17/12"]) +
      rule("<b>Shortcut:</b> if " + mx("<i>f</i>′") + " is (one term) − (another term) and those two terms multiply to 1/4, then " + mx("1 + (<i>f</i>′)<sup>2</sup>") + " is the same two terms <b>added</b>, squared. Flip the minus to a plus and integrate.") },
    { t: "Surface area", h: "<p>Spin a curve around the x-axis and it sweeps out a surface, like the skin of a vase. Each tiny piece of the curve sweeps out a thin band.</p>" +
      rule(mx("<i>S</i> = ") + DIH("a", "b", '2π <i>f</i>(<i>x</i>) √<span class="ov">1 + [<i>f</i>′(<i>x</i>)]<sup>2</sup></span>', "x") + "<br>Band area = circumference (2π·radius) × the length of the tiny piece. The radius is the height " + mx("<i>f</i>(<i>x</i>)") + ".") +
      "<p>It’s the arc length integral with an extra " + mx("2π <i>f</i>(<i>x</i>)") + " inside.</p>" +
      "<p>Spin " + yq("2x") + ", 0 ≤ x ≤ 3, around the x-axis (a cone):</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = 2") + ", so the root is √5.", mx("<i>S</i> = 2π") + DI("0", "3", "2x sqrt(5)"), "= 4π√5·(9/2) = 18π√5"]) },
    { t: "Surface area with a u-sub", h: "<p>Spin " + yq("x^3") + ", 0 ≤ x ≤ 1, around the x-axis:</p>" +
      steps([mx("<i>f</i>′(<i>x</i>) = ") + M("3x^2") + ", so " + mx("1 + (<i>f</i>′)<sup>2</sup> = ") + M("1 + 9x^4"),
        mx("<i>S</i> = 2π") + DI("0", "1", "x^3 sqrt(1 + 9x^4)"),
        "u = " + M("1 + 9x^4") + ", du = " + M("36x^3") + " dx. The " + M("x^3") + " outside is exactly what the u-sub needs. Limits become 1 to 10.",
        "(2π/36)" + DI("1", "10", "sqrt(x)", "u") + " = (π/18)·(2/3)·" + mx("(10<sup>3/2</sup> − 1)"),
        "= π(10√10 − 1)/27"]) +
      "<p>Many surface area problems work this way: the " + mx("<i>f</i>(<i>x</i>)") + " in front supplies the piece that a u-sub needs.</p>" }
  ],
  probs: [
    { k: "txt", text: "Find the length of the line " + yq("2x + 1") + " from x = 0 to x = 3.", type: "number", ans: "3sqrt(5)", chk: [["sqrt(1 + 2^2)", "0", "3"]],

      hint: "f′ = " + M("x^2/4 - 1/x^2") + ". Those two terms multiply to 1/4, so flip the minus to a plus.", sol: ["1 + (f′)² = " + M("(x^2/4 + 1/x^2)^2"), DI("1", "2", "x^2/4 + 1/x^2") + " = " + M("x^3/12 - 1/x") + " from 1 to 2", "(8/12 − 1/2) − (1/12 − 1) = 2/12 + 11/12", "= 13/12"] },

{ id: "C7", block: "C", date: "2026-11-03", title: "Physical applications", test: "Problem set",
  topics: ["Mass from density", "Work = force × distance, sliced", "Springs (Hooke’s law) and pumping liquid", "Force from fluid pressure"],

  parts: [
    { t: "One idea, four costumes", h: "<p>Every 6.7 problem is the same move you’ve used all chapter:</p>" +
      steps(["<b>Slice</b> the object into thin pieces.", "Write the mass, work or force for <b>one slice</b>. That’s where the physics goes.", "<b>Integrate</b> to add the slices."]) +
      "<p>The integrals are easy. Spend your time on step 2, and write the units next to every quantity.</p>" },
    { t: "Mass from density", h: "<p>A thin bar isn’t the same all the way along. Its density " + mx("ρ(<i>x</i>)") + " (mass per unit length) changes with <i>x</i>. A slice of length <i>dx</i> has mass ρ(<i>x</i>) <i>dx</i>.</p>" +
      rule(mx("mass = ") + DIH("a", "b", "ρ(<i>x</i>)", "x")) +
      "<p>A 4 m bar has density " + mx("ρ(<i>x</i>) = 2 + <i>x</i>") + " kg/m. Its mass is " + DI("0", "4", "2 + x") + " = 8 + 8 = 16 kg.</p>" },
    { t: "Work and springs", h: "<p>With a constant force, work = force × distance. When the force changes as you go, integrate it.</p>" +
      rule(mx("<i>W</i> = ") + DIH("a", "b", "<i>F</i>(<i>x</i>)", "x") + "<br>Units: newtons × meters = joules (J), or pounds × feet = ft·lb") +
      "<p><b>Hooke’s law:</b> a spring pulls back harder the farther you stretch it. " + mx("<i>F</i>(<i>x</i>) = <i>kx</i>") + ", where <i>x</i> is the distance from its natural length.</p>" +
      "<p>A 40 N force holds a spring stretched 0.2 m. How much work stretches it from rest to 0.3 m?</p>" +
      steps(["<b>Find k first.</b> 40 = k·0.2, so k = 200.", mx("<i>W</i> = ") + DI("0", "0.3", "200x"), "= " + M("100x^2") + " from 0 to 0.3 = 100·0.09 = 9 J"]) +
      rule("Spring problems give you a force and a stretch so you can find <i>k</i>. Always do that before integrating.") },
    { t: "Lifting a rope or chain", h: "<p>A hanging rope is hard because each bit of it is lifted a different distance. Slice it.</p>" +
      "<p>A 50 ft rope weighing 0.5 lb per foot hangs off a roof. How much work pulls it all up?</p>" +
      steps(["Let <i>y</i> = how far a slice hangs below the roof. y runs from 0 to 50.", "Weight of the slice: 0.5 <i>dy</i> pounds.", "Distance it gets lifted: <i>y</i> feet.", mx("<i>W</i> = ") + DI("0", "50", "0.5x", "y") + " = 0.25·2500 = 625 ft·lb"]) },
    { t: "Pumping liquid", h: "<p>Same idea with horizontal layers of water. Each layer has a weight and a distance to travel.</p>" +
      fig({ axes: false, w: 220, h: 200, x: [-1.6, 5.4], y: [-0.6, 5.8], seg: [[0, 0, 4, 0], [0, 0, 0, 5], [4, 0, 4, 5], [4.5, 2.15, 4.5, 5], [4.35, 5, 4.65, 5], [4.35, 2.15, 4.65, 2.15], [-0.5, 0, -0.5, 2.15], [-0.65, 0, -0.35, 0], [-0.65, 2.15, -0.35, 2.15]],
        fill: [{ top: "5", bot: "0", from: 0, to: 4 }], rect: [[0, 2, 4, 2.3]], lab: [[4.7, 3.5, "5 − y"], [-0.7, 1, "y", "end"], [2, 2.55, "one layer", "middle"]],
        alt: "A tank 5 meters tall, full of water. One thin layer sits at height y and has to be lifted 5 minus y to reach the top.", cap: "A layer at height y travels 5 − y to reach the top." }) +
      rule("<b>Work</b> = ∫ (weight per m³) × (area of the layer) × (distance lifted) <i>dy</i><br>Water weighs 9800 N per m³ (that’s density 1000 × gravity 9.8).") +
      "<p>A full cylinder tank has radius 2 m and height 5 m. How much work pumps all the water out over the top?</p>" +
      steps(["Layer area: π·2² = 4π m².", "A layer at height y is lifted 5 − y.", mx("<i>W</i> = ") + DI("0", "5", "9800*4pi*(5 - x)", "y"), "= 39200π·(25 − 12.5) = 490000π J"]) +
      "<p>The limits are where the <b>water</b> is. A half-full tank would run from 0 to 2.5, but the distance is still 5 − y.</p>" },
    { t: "Force on a dam", h: "<p>Water pressure grows with depth: pressure = 9800 × depth (in N/m²). Force = pressure × area. A dam’s face is at many depths, so slice it into horizontal strips.</p>" +
      rule("<b>Force</b> = ∫ 9800 × (depth) × (width of the strip) <i>dy</i>") +
      "<p>A rectangular dam is 20 m wide and the water behind it is 10 m deep.</p>" +

  ],
  probs: [

    { k: "txt", text: "A 40 ft rope weighing 0.5 lb per foot hangs off a roof. How much work (in ft·lb) pulls it all the way up?", type: "number", ans: "400", chk: [["0.5x", "0", "40"]],

    { k: "txt", text: "Same tank (3 m × 2 m base, 4 m tall), but the water is only 2 m deep. How much work pumps it out over the top?", type: "number", ans: "352800", chk: [["9800*6*(4 - x)", "0", "2"]],

    { k: "txt", text: "A rectangular dam is 10 m wide. The water behind it is 6 m deep. Find the total force on the dam in newtons.", type: "number", ans: "1764000", chk: [["9800*10*(6 - x)", "0", "6"]],

    if (!run.done) {
      h += '<div class="qbar" id="qbar"><span>Quiz in progress</span><span class="tm" id="qtm">' + mmss(Math.max(0, Math.round((run.end - Date.now()) / 1000))) + '</span><button class="btn small" data-act="q-submit" data-sid="' + s.id + '">Submit</button></div>';
      h += '<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">' + run.items.map(function (p, k) { var x = Object.assign({}, p, { n: k }); return probHTML(x, true); }).join("") + "</div>";
      h += '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="q-submit" data-sid="' + s.id + '">Submit quiz</button></div>';
      return h;
    }
    h += '<div class="card"><div class="muted">Your score</div><div class="score">' + run.score + "/" + run.items.length + "</div><p>" + (run.score === run.items.length ? "Perfect. You’re ready for the homework." : run.score >= run.items.length * 0.75 ? "Solid. Redo the misses below, then move on." : "Worth another pass. Redo the misses, review the matching lessons, then retake it in a day or two.") + '</p><div class="row"><button class="btn" data-act="q-again" data-sid="' + s.id + '">Retake with new problems</button><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>';
    h += '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">' + run.items.map(function (p, k) {
      var r = run.res[k];
      return '<div class="prob ' + r.status + '"><div class="prob-q"><span class="qn">' + (k + 1) + "</span><div>" + prompt(p) + "</div></div>" +
        '<div class="mcmp"><span class="l">You</span><span>' + givenHTML(p, run.vals[k]) + '</span><span class="l">Answer</span><span>' + ansHTML(p) + "</span></div>" + fbHTML(r.status, r.msg, { n: k }) + "</div>";
    }).join("") + "</div>";
    return h;
  }
  function safePretty(v) { try { return '<span class="m">' + E.pretty(E.parse(v)) + "</span>"; } catch (e) { return '<span class="mono">' + esc(v) + "</span>"; } }
  function quizStart(sid) {
    var s = BY[sid], items = shuffle(s.quiz.pool.slice()).slice(0, s.quiz.count);
    QZ[sid] = { items: items, end: Date.now() + s.quiz.minutes * 60000, done: false, vals: [] };
    rerenderTab();
  }
  function quizSubmit(sid) {
    var run = QZ[sid]; if (!run || run.done) return;
    var boxes = $$("#tabBody .prob");
    run.vals = run.items.map(function (p, k) { var bx = boxes[k]; if (!bx) return ""; if (p.type === "choice") { var sb = $(".choice.sel", bx); return sb ? sb.dataset.i : ""; } var ip = $(".ans", bx); return ip ? ip.value : ""; });
    run.res = run.items.map(function (p, k) { var v = run.vals[k]; if (!String(v).trim()) return { status: "wrong", msg: "Left blank." }; var r = grade(p, v); if (r.status === "error") r = { status: "wrong", msg: "Couldn’t read: " + esc(r.msg) }; return r; });
    run.score = run.res.filter(function (r) { return r.status === "correct"; }).length;
    run.done = true;
    run.items.forEach(function (p, k) { if (run.res[k].status !== "correct") logMistake(p, run.vals[k] || "(blank)"); else resolveMistakes(p.pid); });
    var rec = S.quiz[sid] || { best: 0, total: run.items.length, hist: [] };
    rec.best = Math.max(rec.best, run.score); rec.total = run.items.length; rec.hist.push({ when: today(), score: run.score });
    S.quiz[sid] = rec; mark(); save();
    rerenderTab(); renderNav("s:" + sid); window.scrollTo({ top: 0 });
  }
  setInterval(function () {
    var el = $("#qtm"); if (!el) return;
    var m = /#\/s\/([\w.]+)/.exec(location.hash); if (!m) return;
    var run = QZ[m[1]]; if (!run || run.done) return;
    var left = Math.max(0, Math.round((run.end - Date.now()) / 1000));
    el.textContent = mmss(left);
    $("#qbar").classList.toggle("low", left < 120);
    if (left <= 0) { toast("Time’s up. Here’s how you did."); quizSubmit(m[1]); }
  }, 500);

  /* ---------- resources ---------- */
  function resTab(s) {
    var h = "";
    if (!s.parts) h += '<div class="empty" style="text-align:left"><b>This lesson isn’t written yet.</b> When you get close to ' + (s.date ? fmtD(s.date, true) : "it") + ", ask Claude to “write session " + s.id + "” and it’ll be added here with practice problems. Until then, the links below cover it.</div>";
    h += '<h2 style="font-size:17px;margin:18px 0 10px">In this session</h2><ul style="margin:0 0 6px;padding-left:20px">' + s.topics.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>";
    h += '<h2 style="font-size:17px;margin:18px 0 10px">Resources</h2><div class="res">' + s.links.map(function (l) { return '<a href="' + l[1] + '" target="_blank" rel="noopener"><span>' + l[0] + "</span><span>↗</span></a>"; }).join("") + "</div>";
    if (WAM[s.id]) h += '<h2 style="font-size:17px;margin:22px 0 6px">Extra practice on WAMAP</h2><p class="muted" style="margin:0 0 8px">Optional review sets already in your STMATH 125 WAMAP course. Same answer format as the homework.</p><ul class="wamap">' + WAM[s.id].map(function (w) { return "<li><span class=\"muted\">" + w[0] + " \u203a</span> " + w[1] + "</li>"; }).join("") + '</ul><a class="btn small" href="https://www.wamap.org" target="_blank" rel="noopener">Open WAMAP \u2197</a>';
    h += '<h2 style="font-size:17px;margin:22px 0 10px">Your notes</h2><textarea class="notes" data-sid="' + s.id + '" placeholder="Anything that confused you, questions for class, or a rule in your own words.">' + esc(S.notes[s.id] || "") + "</textarea>";
    return h;
  }

  /* ---------- mistakes ---------- */
  var mFilter = "open";
  function renderMistakes() {
    var list = S.mistakes.slice().reverse().filter(function (m) { return mFilter === "all" || !m.resolved; });
    var open = S.mistakes.filter(function (m) { return !m.resolved; }).length;
    var h = '<div><div class="eyebrow">Mistake log</div><h1>Missed problems</h1><p class="lede">Every wrong answer lands here automatically. Redo them a day or two later. Tagging why you missed it shows you a pattern: mostly algebra slips means slow down, mostly concept gaps means reread the lesson.</p></div>';
    h += '<div class="row" style="justify-content:space-between"><div class="seg"><button class="' + (mFilter === "open" ? "on" : "") + '" data-act="mf" data-v="open">Open (' + open + ')</button><button class="' + (mFilter === "all" ? "on" : "") + '" data-act="mf" data-v="all">All (' + S.mistakes.length + ")</button></div>" + tally() + "</div>";
    if (!list.length) return h + '<div class="empty">' + (S.mistakes.length ? "No open mistakes. Nice work." : "Nothing here yet. Missed practice and quiz problems will show up here.") + "</div>";
    h += '<div class="mist">' + list.map(function (m) {
      var p = PROB[m.pid]; if (!p) return "";
      var link = p.quiz ? "#/s/" + m.sid + "/quiz" : "#/s/" + m.sid + "/practice";
      return '<div class="mrow' + (m.resolved ? " res-ok" : "") + '"><div class="mrow-h"><span class="row" style="gap:8px"><span class="tag">' + m.sid + (p.quiz ? (/quiz/i.test(m.sid) ? "" : " quiz") : " #" + (p.n + 1)) + '</span><span class="muted">' + fmtD(m.when) + (m.tries > 1 ? " · missed " + m.tries + "×" : "") + (m.auto ? " · fixed on retry" : "") + "</span></span>" +
        '<span class="row" style="gap:10px"><select data-act="reason" data-id="' + m.id + '" aria-label="Why you missed it"><option value="">Why?</option>' + ["Concept gap", "Algebra slip", "Careless", "Didn’t know where to start"].map(function (o) { return "<option" + (m.reason === o ? " selected" : "") + ">" + o + "</option>"; }).join("") + "</select>" +
        '<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" class="ck" data-act="resolve" data-id="' + m.id + '"' + (m.resolved ? " checked" : "") + "> Got it now</label>" +
        (p.quiz ? "" : '<a class="btn small" href="' + link + '" data-act="retry" data-pid="' + p.pid + '">Redo</a>') + "</span></div>" +
        '<div class="mq">' + prompt(p) + '</div><div class="mcmp"><span class="l">You wrote</span><span>' + givenHTML(p, m.given) + '</span><span class="l">Answer</span><span>' + ansHTML(p) + "</span></div></div>";
    }).join("") + "</div>";
    return h;
  }
  function tally() {
    var c = {}; S.mistakes.forEach(function (m) { if (m.reason) c[m.reason] = (c[m.reason] || 0) + 1; });
    var k = Object.keys(c); if (!k.length) return "";
    return '<span class="muted">' + k.map(function (x) { return x + ": " + c[x]; }).join(" · ") + "</span>";
  }

  /* ---------- router ---------- */
  var currentRoute = "";
  function render() {
    var hsh = location.hash || "#/", m, html, route;
    if ((m = /^#\/s\/([\w.]+)(?:\/(\w+))?/.exec(hsh))) { route = "s:" + m[1]; html = renderSession(m[1], m[2]); }
    else if (hsh === "#/plan") { route = "plan"; html = renderPlan(); }
    else if (hsh === "#/mistakes") { route = "mistakes"; html = renderMistakes(); }
    else { route = "today"; html = renderToday(); }
    $("#page").innerHTML = html;
    if (route !== currentRoute) window.scrollTo(0, 0);
    currentRoute = route;
    renderNav(route); renderTop(); save();
    $("#app").classList.remove("nav-open");
    afterRender();
  }
  function rerenderTab() {
    var m = /^#\/s\/([\w.]+)/.exec(location.hash); if (!m) return render();
    var s = BY[m[1]], tb = $("#tabBody"); if (!tb) return render();
    render();
  }
  function afterRender() {
    mountScratches();
    $$(".ans").forEach(function (i) { if (i.value) preview(i); });
    var first = $("#tabBody .prob:not(.correct) .ans");
    if (first && S.prefs.oneAtATime && window.innerWidth > 860 && !$("#qbar")) first.focus({ preventScroll: true });
    var top = $(".top"); if (top) document.documentElement.style.setProperty("--topH", top.offsetHeight + "px");
  }
  window.addEventListener("hashchange", render);
  window.addEventListener("resize", function () { var top = $(".top"); if (top) document.documentElement.style.setProperty("--topH", top.offsetHeight + "px"); });

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.dataset.act, sid = t.dataset.sid;
    switch (a) {
      case "menu": $("#app").classList.toggle("nav-open"); break;
      case "scrim": $("#app").classList.remove("nav-open"); break;
      case "theme":
        S.prefs.theme = { system: "light", light: "dark", dark: "system" }[S.prefs.theme] || "system"; save(); applyTheme();
        toast("Theme: " + (S.prefs.theme === "system" ? "match your computer" : S.prefs.theme)); break;
      case "timer-start": startTimer("focus", S.prefs.sprint); break;
      case "timer-len":
        S.prefs.sprint = { 10: 15, 15: 25, 25: 10 }[S.prefs.sprint] || 15; save(); renderTimer();
        toast("Sprints are now " + S.prefs.sprint + " minutes."); break;
      case "timer-pause":
        if (T.paused) { T.paused = false; T.end = Date.now() + T.left * 1000; } else { T.paused = true; }
        renderTimer(); break;
      case "timer-stop": T.mode = "idle"; renderTimer(); break;
      case "go-sprint": startTimer("focus", S.prefs.sprint); S.tab[sid] = t.dataset.tab; location.hash = "#/s/" + sid + "/" + t.dataset.tab; break;
      case "go-five": startTimer("focus", 5); S.tab[sid] = t.dataset.tab; location.hash = "#/s/" + sid + "/" + t.dataset.tab; toast("Five minutes. You can stop when the timer ends."); break;
      case "tab": S.tab[sid] = t.dataset.tab; save(); location.hash = "#/s/" + sid + "/" + t.dataset.tab; break;
      case "part": var i = +t.dataset.i; openPart[sid] = openPart[sid] === i ? -1 : i; rerenderTab(); break;
      case "got":
        var gi = +t.dataset.i, s = BY[sid]; S.read[sid] = S.read[sid] || {}; S.read[sid][gi] = 1; mark();
        var nx = gi + 1; while (nx < s.parts.length && S.read[sid][nx]) nx++;
        if (nx >= s.parts.length) { openPart[sid] = -1; save(); if (s.probs) { location.hash = "#/s/" + sid + "/practice"; return; } }
        else openPart[sid] = nx;
        save(); rerenderTab();
        var op = $(".part.open"); if (op) op.scrollIntoView({ block: "start", behavior: "smooth" });
        break;
      case "review": openPart[sid] = +t.dataset.i; S.tab[sid] = "learn"; save(); location.hash = "#/s/" + sid + "/learn"; break;
      case "pgo": S.pstep[sid] = Math.max(0, +t.dataset.i); save(); rerenderTab(); break;
      case "one": S.prefs.oneAtATime = t.dataset.v === "1"; save(); rerenderTab(); break;
      case "check": doCheck(t.dataset.pid); break;
      case "scratch-toggle": var wrap = t.closest(".scratch-wrap"), pp = t.dataset.pid; SCR_OPEN[pp] = !$(".scratch", wrap); var tmp = document.createElement("div"); tmp.innerHTML = scratchHTML(PROB[pp]); wrap.replaceWith(tmp.firstChild); mountScratches(); break;
      case "scr-tool": t.closest(".scratch").__api.tool(t.dataset.tool); break;
      case "scr-undo": t.closest(".scratch").__api.undo(); break;
      case "scr-clear": t.closest(".scratch").__api.clear(); break;
      case "scr-taller": t.closest(".scratch").__api.taller(); break;
      case "scr-ask": if (CONFIG.web) handoff(t.dataset.pid, t); else askClaude(t.dataset.pid, t); break;
      case "gh-connect": ghConnect(($("#ghToken") || {}).value); break;
      case "gh-off": ghDisconnect(); break;
      case "gh-sync": GH.state = "saving"; fileChip(); ghSync(true).then(function () { toast(GH.state === "saved" ? "Synced." : GH.err || "Couldn\u2019t sync right now."); }); break;
      case "choose": doCheck(t.dataset.pid, t.dataset.i); break;
      case "qchoose": $$(".choice", t.closest(".prob")).forEach(function (b) { b.classList.toggle("sel", b === t); }); break;
      case "hint": case "sol":
        var box = t.closest(".prob"), r = $('[data-r="' + a + '"]', box); r.hidden = !r.hidden;
        if (a === "sol" && !r.hidden) { var an = S.ans[t.dataset.pid] || {}; an.revealed = true; S.ans[t.dataset.pid] = an; save(); }
        break;
      case "done": S.done[sid] = true; mark(); save(); toast("Session " + sid + " complete. " + SESSIONS.filter(function (x) { return S.done[x.id]; }).length + " of " + SESSIONS.length + " done."); render(); window.scrollTo(0, 0); break;
      case "undone": delete S.done[sid]; save(); render(); break;
      case "fc-flip": FC[sid].flip = !FC[sid].flip; rerenderTab(); break;
      case "fc-know": var st = FC[sid]; st.q.shift(); st.known++; st.flip = false; mark(); save(); rerenderTab(); break;
      case "fc-miss": var st2 = FC[sid], c = st2.q.shift(); st2.missed++; st2.q.splice(Math.min(2, st2.q.length), 0, c); st2.flip = false; rerenderTab(); break;
      case "fc-reset": delete FC[sid]; rerenderTab(); break;
      case "q-start": quizStart(sid); break;
      case "q-submit": quizSubmit(sid); break;
      case "q-again": delete QZ[sid]; quizStart(sid); break;
      case "mf": mFilter = t.dataset.v; render(); break;
      case "retry": var pr = PROB[t.dataset.pid]; S.pstep[pr.sid] = pr.n; S.tab[pr.sid] = "practice"; save(); break;
      case "file-link": linkFile(); break;
      case "file-chip": if (CONFIG.web) {
          if (GH.token && GH.gist && GH.state !== "error") { if (GH.err) toast(GH.err); else { GH.state = "saving"; fileChip(); ghSync(true).then(function () { toast(GH.state === "saved" ? "Synced. Progress and handwriting are up to date on GitHub." : GH.err || "Couldn\u2019t sync right now."); }); } }
          else { if (location.hash !== "" && location.hash !== "#/") location.hash = "#/"; setTimeout(function () { var el = document.getElementById("sync"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); var i = document.getElementById("ghToken"); if (i) i.focus(); }, 80); }
          break;
        }
        if (CONFIG.hosted) { toast(CLOUD.state === "error" ? CLOUD.err : CLOUD.state === "offline" ? "Saving to your account isn\u2019t available in this view, so progress is kept on this device. Open the page from claude.ai to sync." : CLOUD.state === "readonly" ? "This is a view-only copy." : "Your progress saves to your Claude account and shows up on every device you open this on."); break; } if (EXT.on) { toast(EXT.err ? "Sync problem: " + EXT.err : "Progress is saved for Firefox Sync. Firefox sends it about every 10 minutes; to send it now, open the Firefox menu and choose Sync Now."); break; } if (!FILE.can) downloadSelf(); else if (!FILE.ok) regrant(); else toast("Auto-save is on. " + (FILE.last ? "Last saved at " + new Date(FILE.last).toLocaleTimeString() + "." : "")); break;
      case "file-download": downloadSelf(); break;
      case "export":
        if (CONFIG.hosted && !CONFIG.web) {
          var fname = (CONFIG.file || "study") + "-progress-" + today() + ".json";
          claude.use("downloads").then(function (dl) {
            if (!dl) { toast("Backup download isn\u2019t available in this view."); return; }
            return dl.save({ filename: fname, data: JSON.stringify(S, null, 1) }).then(function (r) { if (r && r.status === "saved") toast("Backup saved."); });
          }).catch(function (err) { if (!err || err.code !== "cancelled" && err.code !== "declined") toast("Couldn\u2019t save the backup."); });
          break;
        }
        var blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }), u = URL.createObjectURL(blob), lk = document.createElement("a");
        lk.href = u; lk.download = (CONFIG.file || "study") + "-progress-" + today() + ".json"; document.body.appendChild(lk); lk.click(); lk.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
        toast("Backup downloaded."); break;
      case "reset":
        if (t.dataset.confirm === "1") { S = JSON.parse(JSON.stringify(DEF)); save(); applyTheme(); toast("Everything reset."); render(); }
        else { t.dataset.confirm = "1"; t.textContent = "Click again to erase all progress"; t.classList.remove("ghost"); setTimeout(function () { if (t.isConnected) { t.dataset.confirm = ""; t.textContent = "Reset everything"; t.classList.add("ghost"); } }, 4000); }
        break;
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, a = t.dataset && t.dataset.act;
    if (a === "hw") { S.hw[t.dataset.id] = t.checked; if (t.checked) { mark(); toast("HW " + t.dataset.id + " marked submitted."); } save(); render(); }
    else if (a === "resolve") { var m = S.mistakes.filter(function (x) { return x.id === t.dataset.id; })[0]; if (m) { m.resolved = t.checked; m.auto = false; save(); render(); } }
    else if (a === "reason") { var m2 = S.mistakes.filter(function (x) { return x.id === t.dataset.id; })[0]; if (m2) { m2.reason = t.value; save(); render(); } }
    else if (a === "pref-sound") { S.prefs.sound = t.checked; save(); }
    else if (a === "scr-finger") { var sc = t.closest(".scratch"); if (sc && sc.__api) sc.__api.finger(t.checked); }
    else if (a === "import" && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try { var d = JSON.parse(fr.result); if (!d || d.v !== 1 || typeof d.done !== "object") throw 0; S = mergeState(S, d); save(); applyTheme(); toast("Progress imported and combined with what was already here."); render(); }
        catch (err) { toast("That file isn’t a Calc Catch-Up backup. Choose the .json file you exported."); }
      };
      fr.readAsText(t.files[0]);
    }
  });
  var pvT;
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.classList.contains("ans") && t.closest(".prob")) { clearTimeout(pvT); pvT = setTimeout(function () { preview(t); }, 220); }
    if (t.classList.contains("notes")) { S.notes[t.dataset.sid] = t.value; save(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ans") && !e.target.closest("#tabBody .qbar")) {
      if ($("#qbar")) { var ins = $$("#tabBody .ans"), ix = ins.indexOf(e.target); if (ins[ix + 1]) ins[ix + 1].focus(); return; }
      e.preventDefault(); doCheck(e.target.dataset.pid);
    }
    if (e.key === " " && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)) {
      var fc = $(".fcard"); if (fc) { e.preventDefault(); fc.click(); }
    }
    if (e.key === "Escape") $("#app").classList.remove("nav-open");
  });

  applyTheme();
  lastJSON = fingerprint();
  render();
  if (CONFIG.web) initGH(); else if (CONFIG.hosted) { initCloud(); initSample(); } else { initFile(); extPost("hello"); }
  if (fromFile && !CONFIG.web) setTimeout(function () { toast("Picked up where you left off, using the progress saved in this file."); }, 400);
})();

</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});</script>
