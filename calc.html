    "A0-2": ["Dividing by a fraction is the same as multiplying by its flip: (2/3) ÷ (4/9) = (2/3) × (9/4).", "Multiply the tops and the bottoms: (2 · 9)/(3 · 4) = 18/12.", "Simplify by dividing top and bottom by 6: 3/2."],
    "A0-4": ["Power of a power: multiply the exponents. (x³)² = x^(3·2) = x⁶.", "Multiplying powers with the same base: add the exponents. x⁶ · x⁻⁴ = x^(6 + (−4)).", "6 − 4 = 2, so the answer is x²."],
    "A0-5": ["Factoring x² − 5x + 6 means finding two numbers that multiply to +6 and add to −5.", "Pairs that multiply to 6: 1 and 6, 2 and 3, and their negatives. (−2) × (−3) = 6 and (−2) + (−3) = −5. ✓", "So x² − 5x + 6 = (x − 2)(x − 3), and a = 3."],
    "A0-6": ["(2x − 3)² means (2x − 3)(2x − 3). Don’t just square each part: that misses the middle terms.", "FOIL. First: 2x · 2x = 4x². Outer: 2x · (−3) = −6x. Inner: (−3) · 2x = −6x. Last: (−3)(−3) = 9.", "Combine the middle terms: −6x − 6x = −12x, so (2x − 3)² = 4x² − 12x + 9.", "The coefficient of x is −12."],
    "A0-8": ["f(g(x)) means: take g(x) and put it into f wherever f has an x.", "g(x) = x + 1, so f(g(x)) = f(x + 1).", "f squares whatever you give it: f(x + 1) = (x + 1)². (Multiplied out, that’s x² + 2x + 1. Either form is right.)"],
    "A0-9": ["π radians is 180°: half a turn around the unit circle.", "Start at (1, 0) and go half a turn. You land at (−1, 0).", "cos is the x-coordinate of that point, so cos π = −1."],
    "A0-10": ["Convert to degrees: π/6 = 180°/6 = 30°.", "On the unit circle, 30° is the point (√3/2, 1/2).", "sin is the y-coordinate, so sin(π/6) = 1/2."],
    "B1-3": ["This means 1² + 2² + … + 10². You could add ten squares, but the formula is faster.", "Σk² from 1 to n = n(n + 1)(2n + 1)/6. Here n = 10.", "10 · 11 · 21 = 2310.", "2310 ÷ 6 = 385."],
    "B1-4": ["Δx = (b − a)/n: the length of the interval, cut into n equal pieces.", "Here a = 1, b = 5 and n = 8.", "Δx = (5 − 1)/8 = 4/8 = 0.5."],
    "B1-5": ["Δx = (2 − 0)/2 = 1. The strips are [0, 1] and [1, 2].", "Right sum: use each strip’s right edge, x = 1 and x = 2.", "Heights: f(1) = 1² = 1 and f(2) = 2² = 4.", "Area ≈ (1 + 4) × 1 = 5."],
    "B1-6": ["Δx = (4 − 0)/4 = 1. The strips are [0, 1], [1, 2], [2, 3], [3, 4].", "Left sum: use each strip’s left edge, x = 0, 1, 2, 3.", "Heights: f(0) = 3(0) + 1 = 1, f(1) = 4, f(2) = 7, f(3) = 10.", "Area ≈ (1 + 4 + 7 + 10) × 1 = 22."],
    "B1-7": ["Δx = (2 − 0)/2 = 1. The strips are [0, 1] and [1, 2].", "Midpoint sum: use the middle of each strip, x = 0.5 and x = 1.5.", "Heights: 0.5³ = 0.125 and 1.5³ = 3.375.", "Area ≈ (0.125 + 3.375) × 1 = 3.5."],
    "B2-1": ["Sketch y = 3: a flat line 3 units above the x-axis.", "From x = 0 to 5 the region under it is a rectangle: width 5 − 0 = 5, height 3.", "Area = 5 × 3 = 15. It’s above the axis, so the integral is 15."],
    "B2-2": ["Sketch y = x: a straight line through the origin.", "From 0 to 6 the region is a triangle: base 6, and height 6 (the line’s height at x = 6).", "Area = ½ · 6 · 6 = 18. It’s above the axis, so the integral is 18."],
    "B2-3": ["y = √(9 − x²) is the top half of a circle: squaring gives y² = 9 − x², so x² + y² = 9, radius 3.", "From x = −3 to 3 the region is the whole top half.", "Half of πr²: ½ · π · 3² = 9π/2."],
    "B2-4": ["Sketch y = x from −2 to 0. That part of the line is below the x-axis.", "The region is a triangle: base 2, height 2 (the line is at y = −2 when x = −2).", "Area = ½ · 2 · 2 = 2. It’s below the axis, so it counts as −2."],
    "B2-5": ["An interval can be cut into pieces: " + I_("0", "4") + " = " + I_("0", "1") + " + " + I_("1", "4") + ".", "Plug in what you know: 7 = 2 + " + I_("1", "4") + ".", I_("1", "4") + " = 7 − 2 = 5."],
    "B2-6": ["Flipping the limits flips the sign: " + I_("5", "2") + " = −" + I_("2", "5") + " = −6.", "Constants pull out: " + I_("5", "2", "3" + FX) + " = 3 × " + I_("5", "2") + ".", "3 × (−6) = −18."],
    "B2-7": ["Sums split into separate integrals, and constants pull out front:", "2" + I_("0", "5") + " − 3" + I_("0", "5", GX) + " + " + I_("0", "5", HX), "= 2(10) − 3(4) + 3", "= 20 − 12 + 3 = 11."],
    "B2-8": ["Split it: " + I_("2", "6") + " − " + I_("2", "6", GX) + " + " + I_("2", "6", "4") + ".", "A lone constant integrates to itself times the width: " + I_("2", "6", "4") + " = 4 × (6 − 2) = 16. (It’s a rectangle of height 4 and width 4.)", "7 − 3 + 16 = 20."],
    "B2-9": ["Join the two pieces of f: " + I_("1", "3") + " + " + I_("3", "8") + " = " + I_("1", "8") + " = 2 + 5 = 7.", "Split the integral you want: " + I_("1", "8") + " + 2" + I_("1", "8", GX) + ".", "7 + 2(3) = 13."],
    "B2-10": ["Bounding rule: if m ≤ g(x) ≤ M on [a, b], then m(b − a) ≤ " + I_("a", "b", GX) + " ≤ M(b − a).", "The smallest g can be is 2 the whole way, so the smallest " + I_("1", "4", GX) + " = 2 × (4 − 1) = 6.", "Split what you want: " + I_("1", "4", GX) + " + " + I_("1", "4") + ". Smallest: 6 + 3 = 9."],
    "B2-11": ["Bounding rule: " + I_("a", "b", GX) + " ≤ M(b − a) when g(x) ≤ M.", "The largest g can be is 5 the whole way, so the largest " + I_("1", "4", GX) + " = 5 × (4 − 1) = 15.", "Add " + I_("1", "4") + " = 3: 15 + 3 = 18."],
    "B2-15": ["The absolute value flips anything below the axis up, so every piece counts as positive area.", "4 − x hits 0 at x = 4. From 0 to 4: a triangle with base 4 and height 4, area 8.", "From 4 to 6: a triangle with base 2 and height |4 − 6| = 2, area 2.", "Total: 8 + 2 = 10."],
    "B2-16": [I_("0", "7") + " is the net area: regions above the axis count as +, regions below count as −.", "+5 (above), −2 (below), +4 (above).", "5 − 2 + 4 = 7."],
    "B2-17": ["|f(x)| is never negative: the region below the axis gets flipped up.", "So every region counts as +: 5, 2 and 4.", "5 + 2 + 4 = 11."],
    "B3-2": ["Chain rule: derivative of the outside (leave the inside alone) × derivative of the inside.", "Outside: sin( ). Inside: 3x.", "Derivative of the outside: cos(3x). Derivative of the inside: 3.", "Multiply: 3cos(3x)."],
    "B3-4": ["Chain rule. Outside: ln( ). Inside: g = x² + 1.", "The derivative of ln g is 1/g, so the outside gives 1/(x² + 1).", "The derivative of the inside is 2x.", "Multiply: 2x/(x² + 1)."],
    "B3-5": ["Write the root as a power: (4x − 3)^(1/2).", "Chain rule. Outside: ( )^(1/2), whose derivative is (1/2)( )^(−1/2). Inside: 4x − 3, whose derivative is 4.", "Multiply: (1/2)(4x − 3)^(−1/2) × 4 = 2(4x − 3)^(−1/2).", "A negative power means 1 over it: 2/√(4x − 3)."],
    "B3-6": ["Chain rule. Outside: cos( ). Inside: x².", "The derivative of cos is −sin, so the outside gives −sin(x²).", "The derivative of the inside is 2x.", "Multiply: −2x sin(x²)."],
    "B3-7": ["Chain rule. Outside: ( )⁶. Inside: x³ − x.", "Derivative of the outside: 6( )⁵, with the inside left alone: 6(x³ − x)⁵.", "Derivative of the inside: 3x² − 1.", "Multiply: 6(x³ − x)⁵(3x² − 1)."],
    "B4-7": ["The antiderivative of eˣ is eˣ itself.", "Top limit: e¹ = e. Bottom limit: e⁰ = 1.", "Subtract, top minus bottom: e − 1 (about 1.718)."],
    "B4-13": [II("1/(1 + x^2)") + " = arctan x, so the antiderivative is 2 arctan x.", "Top limit: 2 arctan √3. arctan √3 = π/3, because tan(π/3) = √3. So 2π/3.", "Bottom limit: 2 arctan 0 = 0, because tan 0 = 0.", "Subtract: 2π/3 − 0 = 2π/3."],
    "B4-15": ["Antiderivative of sin(3x): −cos(3x), divided by the 3 in front of x, so −cos(3x)/3. (Check: its derivative is sin(3x).)", "Top limit: −cos(3 · π/3)/3 = −cos(π)/3 = −(−1)/3 = 1/3.", "Bottom limit: −cos(0)/3 = −1/3.", "Subtract: 1/3 − (−1/3) = 2/3."],
    "B5-1": ["Check the symmetry: (−x)⁷ = −x⁷, so x⁷ is odd.", "An odd function is flipped below the axis on the left side, so the area left of 0 cancels the area right of 0.", "Over symmetric limits like [−5, 5], the integral is 0."],
    "B5-2": ["Check the symmetry: (−x)² + 1 = x² + 1, so it’s even.", "Even over [−2, 2]: double the integral from 0 to 2.", DI("0", "2", "x^2 + 1") + " = " + M("x^3/3 + x") + " from 0 to 2 = 8/3 + 2 = 14/3.", "Double it: 2 × 14/3 = 28/3."],
    "B5-3": ["Check the symmetry: sin(−x) = −sin x, so sin is odd.", "The area above the axis on one side cancels the area below on the other side.", "Over [−π, π] the integral is 0."],
    "B5-6": ["The Mean Value Theorem for integrals: somewhere in the interval, the function equals its average.", "So set f(c) equal to the average: c² = 3.", "c = √3 or −√3. Only √3 ≈ 1.732 is inside [0, 3]."],
    "B5-7": ["Even means f(−x) = f(x): the graph is mirrored across the y-axis.", "So the area from −3 to 0 equals the area from 0 to 3: " + I_("-3", "0") + " = 5 too.", I_("-3", "3") + " = 5 + 5 = 10."],
    "B5-8": ["Split [−4, 9] into [−4, 0], [0, 4] and [4, 9].", "f is even, so " + I_("-4", "0") + " = " + I_("0", "4") + " = 3.", I_("-4", "9") + " = 3 + 3 + 2 = 8.", "The 5 pulls out: 5 × 8 = 40."],
    "B5-9": ["Split at 2: " + I_("-2", "7") + " = " + I_("-2", "2") + " + " + I_("2", "7") + ".", "f is odd and [−2, 2] is symmetric, so " + I_("-2", "2") + " = 0.", "9 = 0 + " + I_("2", "7") + ", so " + I_("2", "7") + " = 9."],
    "B5-10": ["Average = integral ÷ width, so integral = average × width.", I_("1", "6") + " = 4 × (6 − 1) = 20.", "Split: 3" + I_("1", "6") + " + " + I_("1", "6", "2") + " = 3(20) + 2 × 5.", "= 60 + 10 = 70."],
    "B6-2": ["Let u = 5x, the inside.", "du = 5 dx, so dx = du/5.", II("cos(5x)") + " = ∫ cos u · du/5 = (1/5) ∫ cos u du = (1/5) sin u.", "Put x back in for u: " + M("sin(5x)/5 + C")],
    "B7-2": ["Let u = x². Then du = 2x dx, so x dx = du/2.", "Change the limits: x = 0 gives u = 0, and x = 2 gives u = 4.", "(1/2)" + DI("0", "4", "e^x", "u") + " = (1/2)eᵘ from 0 to 4.", "(1/2)(e⁴ − e⁰) = (e⁴ − 1)/2."],
    "B7-3": ["Let u = x/2. Then du = dx/2, so dx = 2 du.", "Change the limits: x = 0 gives u = 0, and x = π gives u = π/2.", "2" + DI("0", "pi/2", "cos(x)", "u") + " = 2 sin u from 0 to π/2.", "2(sin(π/2) − sin 0) = 2(1 − 0) = 2."],
    "B7-4": ["Let u = x³ + 1. Then du = 3x² dx, which is exactly the top.", "Change the limits: x = 0 gives u = 1, and x = 1 gives u = 2.", DI("1", "2", "1/x", "u") + " = ln u from 1 to 2.", "ln 2 − ln 1 = ln 2 − 0 = ln 2."],
    "B7-5": ["Let u = 2x + 1. Then du = 2 dx, so dx = du/2.", "Change the limits: x = 0 gives u = 1, and x = 4 gives u = 9.", "(1/2)" + DI("1", "9", "x^(-1/2)", "u") + " = (1/2) · 2u^(1/2) = √u, from 1 to 9.", "√9 − √1 = 3 − 1 = 2."],
    "B8-3": ["Δx = (3 − 0)/3 = 1. The strips are [0, 1], [1, 2], [2, 3].", "Right sum: right edges x = 1, 2, 3.", "Heights: f(1) = 2(1) + 1 = 3, f(2) = 5, f(3) = 7.", "Area ≈ (3 + 5 + 7) × 1 = 15."],
    "B8-4": ["An interval can be cut into pieces: " + I_("1", "5") + " = " + I_("1", "3") + " + " + I_("3", "5") + ".", "8 = 3 + " + I_("3", "5") + ".", I_("3", "5") + " = 8 − 3 = 5."],
    "B8-6": ["Let u = x² + 16. Then du = 2x dx, so x dx = du/2.", "Change the limits: x = 0 gives u = 16, and x = 3 gives u = 25.", "(1/2)" + DI("16", "25", "x^(-1/2)", "u") + " = (1/2) · 2√u = √u, from 16 to 25.", "√25 − √16 = 5 − 4 = 1."],
    "B8-q22": ["Let u = ln x. Then du = (1/x) dx.", "Change the limits: x = 1 gives u = ln 1 = 0, and x = e gives u = ln e = 1.", DI("0", "1", "x", "u") + " = u²/2 from 0 to 1.", "1/2 − 0 = 1/2."],
    "B8-q24": [II("1/(1 + x^2)") + " = arctan x, so the antiderivative is 3 arctan x.", "Top limit: 3 arctan 1 = 3 · π/4, because tan(π/4) = 1.", "Bottom limit: 3 arctan 0 = 0.", "3π/4 − 0 = 3π/4."],
    "B8-q70": [II("1/(1 + x^2)") + " = arctan x, so the antiderivative is 4 arctan x.", "Top limit: 4 arctan 1 = 4 · π/4 = π, because tan(π/4) = 1.", "Bottom limit: 4 arctan 0 = 0.", "π − 0 = π."],
    "B8-q25": ["Split at 3: " + I_("-3", "5") + " = " + I_("-3", "3") + " + " + I_("3", "5") + ".", "f is odd and [−3, 3] is symmetric, so " + I_("-3", "3") + " = 0.", "4 = 0 + " + I_("3", "5") + ", so " + I_("3", "5") + " = 4."],
    "B8-q26": ["Bounding rule: if g(x) ≤ M on [a, b], then " + I_("a", "b", GX) + " ≤ M(b − a).", "The largest g can be is 6, the whole way across.", "6 × (3 − 0) = 18."],
    "B8-q51": ["Split it: " + I_("2", "5") + " − 2" + I_("2", "5", GX) + " + " + I_("2", "5", "1") + ".", "The lone 1 integrates to 1 × (5 − 2) = 3.", "9 − 2(4) + 3 = 9 − 8 + 3 = 4."],
    "B8-q52": ["An interval can be cut into pieces: " + I_("0", "7") + " = " + I_("0", "3") + " + " + I_("3", "7") + ".", "10 = 4 + " + I_("3", "7") + ".", I_("3", "7") + " = 10 − 4 = 6."],
    "B8-q53": ["Flipping the limits flips the sign: " + I_("4", "1") + " = −" + I_("1", "4") + " = −(−2) = 2.", "The 3 pulls out: " + I_("4", "1", "3" + FX) + " = 3 × 2.", "= 6."],
    "B8-q54": ["Even means f(−x) = f(x): the graph is mirrored across the y-axis.", "So " + I_("-6", "0") + " = " + I_("0", "6") + " = 8.", I_("-6", "6") + " = 8 + 8 = 16."],
    "B8-q55": ["Bounding rule: if g(x) ≥ m on [a, b], then " + I_("a", "b", GX) + " ≥ m(b − a).", "The smallest g can be is −1, the whole way across.", "−1 × (7 − 2) = −5."],
    "B8-q56": ["Average = integral ÷ width, so " + I_("0", "8") + " = 3 × 8 = 24.", "Split: " + I_("0", "8") + " + " + I_("0", "8", "1") + " = 24 + 1 × (8 − 0).", "= 24 + 8 = 32."],
    "B8-q57": ["Constants pull out: " + I_("a", "b", "2<i>x</i>") + " = 2" + I_("a", "b", "<i>x</i>") + " = 16, so " + I_("a", "b", "<i>x</i>") + " = 8.", I_("a", "b", "5") + " = 5(b − a) = 10, so b − a = 2, and " + I_("a", "b", "1") + " = 2.", "Split what you want: 3" + I_("a", "b", "<i>x</i>") + " − " + I_("a", "b", "1") + " = 3(8) − 2.", "= 22."],
    "B8-q58": ["y = √(16 − x²) is the top half of a circle: x² + y² = 16, radius 4.", "From −4 to 4 the region is the whole top half.", "½ · π · 4² = 8π."],
    "B8-q59": ["y = √(4 − x²) is the top half of a circle of radius 2.", "From 0 to 2 is only the right half of that: a quarter circle.", "¼ · π · 2² = π."],
    "B8-q60": ["|x| is a V with its point at the origin. It’s never below the axis.", "From −4 to 0: a triangle with base 4 and height |−4| = 4, area ½ · 4 · 4 = 8.", "From 0 to 2: a triangle with base 2 and height 2, area ½ · 2 · 2 = 2.", "Total: 8 + 2 = 10."],
    "B8-q61": ["y = 5 is a flat line, so the region is a rectangle.", "Width 9 − 2 = 7, height 5.", "7 × 5 = 35."],
    "B8-q62": ["y = 2x is a straight line through the origin, so the region is a triangle.", "Base 5. Height at x = 5: 2(5) = 10.", "½ · 5 · 10 = 25."],
    "B8-q63": ["y = 6 − 2x starts at height 6 and hits 0 when 6 − 2x = 0, at x = 3.", "From 0 to 3 that’s a triangle with base 3 and height 6.", "½ · 3 · 6 = 9."],
    "B8-q65": ["|x − 2| is a V with its point at x = 2. It’s never below the axis.", "From 0 to 2: a triangle with base 2 and height |0 − 2| = 2, area 2.", "From 2 to 5: a triangle with base 3 and height |5 − 2| = 3, area 4.5.", "Total: 2 + 4.5 = 6.5 = 13/2."],
    "B8-q66": ["y = −√(9 − x²) is the bottom half of a circle of radius 3.", "From −3 to 3 that’s the whole bottom half, with area ½ · π · 3² = 9π/2.", "It’s below the axis, so it counts as negative: −9π/2."],
    "B8-q104": ["cos(−x) = cos x, so cos is even: double the integral from 0 to π.", "2" + DI("0", "pi", "cos(x)") + " = 2 sin x from 0 to π.", "2(sin π − sin 0) = 2(0 − 0) = 0.", "That makes sense: the area above the axis from 0 to π/2 cancels the area below it from π/2 to π."],
    "C1-4": ["Displacement only compares where it ended with where it started. Distance adds up every meter moved, in either direction.", "Displacement 0: it ended where it started.", "Distance 10: it moved 10 m in total. So it went 5 m one way and 5 m back.", "Forward 5 and back 5 cancel in the displacement (5 − 5 = 0) but add up in the distance (5 + 5 = 10)."],
    "C2-5": ["Pick a test x between the crossing points 0 and 2, like x = 1.", "Line: 2x = 2(1) = 2. Parabola: x² = 1² = 1.", "2 is bigger, so the line y = 2x is on top from 0 to 2."],
    "C2-7": ["Get x² by itself: subtract 1 from both sides. y − 1 = x².", "Take the square root of both sides: x = ±√(y − 1).", "The problem says x ≥ 0, so keep the positive root: x = √(y − 1)."],
    "C3-3": ["Find where they cross: x² = 2x, so x² − 2x = 0, x(x − 2) = 0: x = 0 and x = 2.", "Which is on top? At x = 1: 2x = 2 and x² = 1, so the line is on top.", "Area = top minus bottom: " + DI("0", "2", "2x - x^2") + " = " + M("x^2 - x^3/3") + " from 0 to 2.", "(4 − 8/3) − 0 = 4/3."],
    "C5-8": ["The curve is given as y = 2x − x² (y in terms of x). To slice horizontally you’d have to solve it for x, which is messy.", "So slice vertically, in x. Around the y-axis, vertical strips are parallel to the axis of rotation.", "Strips parallel to the axis sweep out shells. Use shells, integrating in x."],
    "C7-1": ["Mass = the integral of the density along the bar: " + DI("0", "2", "4 + 3x^2") + ".", "Antiderivative: " + M("4x + x^3") + ".", "At 2: 4(2) + 2³ = 8 + 8 = 16. At 0: 0.", "Mass = 16 − 0 = 16 kg."],
    "C7-2": ["Hooke’s law: force = k × stretch, F = kx.", "Here F = 30 N and x = 0.5 m: 30 = k × 0.5.", "k = 30 ÷ 0.5 = 60 N/m."],
    "C7-3": ["Work = the integral of force over the distance. The spring pulls back with force 60x at stretch x.", DI("0", "0.5", "60x") + " = " + M("30x^2") + " from 0 to 0.5.", "30(0.5)² − 0 = 30(0.25) = 7.5 J."],
    "C7-4": ["Same force, 60x, but now from x = 0.5 to x = 1.", DI("0.5", "1", "60x") + " = " + M("30x^2") + " from 0.5 to 1.", "30(1)² − 30(0.5)² = 30 − 7.5 = 22.5 J."],
    "C7-5": ["Slice the rope. A piece y feet below the roof is dy long, weighs 0.5 dy lb, and has to be lifted y feet.", "Its work is 0.5y dy. Add up all the pieces: " + DI("0", "40", "0.5x", "y") + ".", "= 0.25y² from 0 to 40 = 0.25 × 1600.", "= 400 ft·lb."],
    "C7-6": ["The water leaves over the top of the tank, at height 5.", "A layer at height y has to rise from y up to 5.", "Distance = 5 − y meters."],
    "B3-1": CH("2x + 1", "4(2x + 1)³", "2", "8(2x + 1)³"),
    "B3-3": CH("5x", "e^(5x) (eˣ is its own derivative)", "5", "5e^(5x)"),
    "B6-1": U("x² + 3", "du = 2x dx, which is exactly the 2x dx in the problem", "∫ u⁴ du", "u⁵/5", "(x² + 3)⁵/5 + C"),
    "B6-3": U("2x", "du = 2 dx, so dx = du/2", "∫ eᵘ · du/2 = (1/2) ∫ eᵘ du", "(1/2)eᵘ", "e^(2x)/2 + C"),
    "B6-4": U("x³ + 1", "du = 3x² dx, so x² dx = du/3", "(1/3) ∫ u³ du", "(1/3) · u⁴/4 = u⁴/12", "(x³ + 1)⁴/12 + C"),
    "B6-5": U("x² + 1", "du = 2x dx, which is exactly the top", "∫ du/u", "ln|u|", "ln(x² + 1) + C. No bars needed: x² + 1 is always positive"),

/* ================= Full worked steps =================
   Added Oct 17, 2026 at the user's request: "make it so all steps are shown for every problem".
   For problems that are mechanical (sums of powers of x, roots, e^x, e^(kx), ln, the basic trig
   functions, 1/(x^2 + 1)), this writes the solution out step by step from the problem itself: the
   rewrite, every term with the rule used and the exponent arithmetic, each substitution and each
   subtraction. A generated solution replaces the hand-written one only when its answer matches the
   answer key (checked here and in tests/check-answers.js). Problems whose method is the point (geometry,
   symmetry) keep their own steps. Everything else keeps its hand-written steps. Calc build only. */
(function () {
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  function R(p, q) { q = q === undefined ? 1 : q; if (q < 0) { p = -p; q = -q; } var g = gcd(p, q); return { p: p / g, q: q / g }; }
  function add(a, b) { return R(a.p * b.q + b.p * a.q, a.q * b.q); }
  function mul(a, b) { return R(a.p * b.p, a.q * b.q); }
  function div(a, b) { return R(a.p * b.q, a.q * b.p); }
  function neg(a) { return R(-a.p, a.q); }
  function rs(r) { return r.q === 1 ? String(r.p) : r.p + "/" + r.q; }

      case "scr-ask": if (CONFIG.web) handoff(t.dataset.pid, t); else askClaude(t.dataset.pid, t); break;
      case "gh-connect": ghConnect(($("#ghToken") || {}).value); break;
      case "gh-off": ghDisconnect(); break;
      case "gh-sync": GH.state = "saving"; fileChip(); ghSync(true).then(function () { toast(GH.state === "saved" ? "Synced." : GH.err || "Couldn\u2019t sync right now."); }); break;
      case "choose": doCheck(t.dataset.pid, t.dataset.i); break;
      case "qchoose": $$(".choice", t.closest(".prob")).forEach(function (b) { b.classList.toggle("sel", b === t); }); break;
      case "msol": var rv = $('[data-r="msol"]', t.parentNode.parentNode); rv.hidden = !rv.hidden; t.textContent = rv.hidden ? "Show solution" : "Hide solution"; break;
      case "hint": case "sol":
        var box = t.closest(".prob"), r = $('[data-r="' + a + '"]', box); r.hidden = !r.hidden;
        if (a === "sol" && !r.hidden) { var an = S.ans[t.dataset.pid] || {}; an.revealed = true; S.ans[t.dataset.pid] = an; save(); }
        break;
      case "done": S.done[sid] = true; mark(); save(); toast("Session " + sid + " complete. " + SESSIONS.filter(function (x) { return S.done[x.id]; }).length + " of " + SESSIONS.length + " done."); render(); window.scrollTo(0, 0); break;
      case "undone": delete S.done[sid]; save(); render(); break;
      case "fc-flip": FC[sid].flip = !FC[sid].flip; rerenderTab(); break;
      case "fc-know": var st = FC[sid]; st.q.shift(); st.known++; st.flip = false; mark(); save(); rerenderTab(); break;
      case "fc-miss": var st2 = FC[sid], c = st2.q.shift(); st2.missed++; st2.q.splice(Math.min(2, st2.q.length), 0, c); st2.flip = false; rerenderTab(); break;
      case "fc-reset": delete FC[sid]; rerenderTab(); break;
      case "q-start": quizStart(sid); break;
      case "q-submit": quizSubmit(sid); break;
      case "q-again": delete QZ[sid]; quizStart(sid); break;
      case "mf": mFilter = t.dataset.v; render(); break;
      case "retry": var pr = PROB[t.dataset.pid]; S.pstep[pr.sid] = pr.n; S.tab[pr.sid] = "practice"; save(); break;
      case "file-link": linkFile(); break;
      case "file-chip": if (CONFIG.web) {
          if (GH.token && GH.gist && GH.state !== "error") { if (GH.err) toast(GH.err); else { GH.state = "saving"; fileChip(); ghSync(true).then(function () { toast(GH.state === "saved" ? "Synced. Progress and handwriting are up to date on GitHub." : GH.err || "Couldn\u2019t sync right now."); }); } }
          else { if (location.hash !== "" && location.hash !== "#/") location.hash = "#/"; setTimeout(function () { var el = document.getElementById("sync"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); var i = document.getElementById("ghToken"); if (i) i.focus(); }, 80); }
          break;
        }
        if (CONFIG.hosted) { toast(CLOUD.state === "error" ? CLOUD.err : CLOUD.state === "offline" ? "Saving to your account isn\u2019t available in this view, so progress is kept on this device. Open the page from claude.ai to sync." : CLOUD.state === "readonly" ? "This is a view-only copy." : "Your progress saves to your Claude account and shows up on every device you open this on."); break; } if (EXT.on) { toast(EXT.err ? "Sync problem: " + EXT.err : "Progress is saved for Firefox Sync. Firefox sends it about every 10 minutes; to send it now, open the Firefox menu and choose Sync Now."); break; } if (!FILE.can) downloadSelf(); else if (!FILE.ok) regrant(); else toast("Auto-save is on. " + (FILE.last ? "Last saved at " + new Date(FILE.last).toLocaleTimeString() + "." : "")); break;
      case "file-download": downloadSelf(); break;
      case "export":
        if (CONFIG.hosted && !CONFIG.web) {
          var fname = (CONFIG.file || "study") + "-progress-" + today() + ".json";
          claude.use("downloads").then(function (dl) {
            if (!dl) { toast("Backup download isn\u2019t available in this view."); return; }
            return dl.save({ filename: fname, data: JSON.stringify(S, null, 1) }).then(function (r) { if (r && r.status === "saved") toast("Backup saved."); });
          }).catch(function (err) { if (!err || err.code !== "cancelled" && err.code !== "declined") toast("Couldn\u2019t save the backup."); });
          break;
        }
        var blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }), u = URL.createObjectURL(blob), lk = document.createElement("a");
        lk.href = u; lk.download = (CONFIG.file || "study") + "-progress-" + today() + ".json"; document.body.appendChild(lk); lk.click(); lk.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
        toast("Backup downloaded."); break;
      case "reset":
        if (t.dataset.confirm === "1") { S = JSON.parse(JSON.stringify(DEF)); save(); applyTheme(); toast("Everything reset."); render(); }
        else { t.dataset.confirm = "1"; t.textContent = "Click again to erase all progress"; t.classList.remove("ghost"); setTimeout(function () { if (t.isConnected) { t.dataset.confirm = ""; t.textContent = "Reset everything"; t.classList.add("ghost"); } }, 4000); }
        break;
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, a = t.dataset && t.dataset.act;
    if (a === "hw") { S.hw[t.dataset.id] = t.checked; if (t.checked) { mark(); toast("HW " + t.dataset.id + " marked submitted."); } save(); render(); }
    else if (a === "resolve") { var m = S.mistakes.filter(function (x) { return x.id === t.dataset.id; })[0]; if (m) { m.resolved = t.checked; m.auto = false; save(); render(); } }
    else if (a === "reason") { var m2 = S.mistakes.filter(function (x) { return x.id === t.dataset.id; })[0]; if (m2) { m2.reason = t.value; save(); render(); } }
    else if (a === "pref-sound") { S.prefs.sound = t.checked; save(); }
    else if (a === "pref-claude-app") { S.prefs.claudeApp = t.checked; save(); }
    else if (a === "scr-finger") { var sc = t.closest(".scratch"); if (sc && sc.__api) sc.__api.finger(t.checked); }
    else if (a === "import" && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () {
        try { var d = JSON.parse(fr.result); if (!d || d.v !== 1 || typeof d.done !== "object") throw 0; S = mergeState(S, d); save(); applyTheme(); toast("Progress imported and combined with what was already here."); render(); }
        catch (err) { toast("That file isn’t a Calc Catch-Up backup. Choose the .json file you exported."); }
      };
      fr.readAsText(t.files[0]);
    }
  });
  var pvT;
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.classList.contains("ans") && t.closest(".prob")) { clearTimeout(pvT); pvT = setTimeout(function () { preview(t); }, 220); }
    if (t.classList.contains("notes")) { S.notes[t.dataset.sid] = t.value; save(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ans") && !e.target.closest("#tabBody .qbar")) {
      if ($("#qbar")) { var ins = $$("#tabBody .ans"), ix = ins.indexOf(e.target); if (ins[ix + 1]) ins[ix + 1].focus(); return; }
      e.preventDefault(); doCheck(e.target.dataset.pid);
    }
    if (e.key === " " && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)) {
      var fc = $(".fcard"); if (fc) { e.preventDefault(); fc.click(); }
    }
    if (e.key === "Escape") $("#app").classList.remove("nav-open");
  });

  applyTheme();
  /* ---------- calculator (added Oct 15: values, definite integrals, graphs and crossing points) ---------- */
  (function () {
    var btn = document.getElementById("calcBtn"); if (!btn) return;
    if (CONFIG.noPad || CONFIG.noCalc) { btn.hidden = true; return; } // not for apps without math, like History
    var box = document.createElement("div"); box.className = "calc"; box.hidden = true; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Calculator");
    box.innerHTML = '<div class="calc-h"><div class="seg"><button class="on" data-m="val">Calculate</button><button data-m="int">Integral</button><button data-m="gr">Graph</button></div><button class="icon-btn" data-x aria-label="Close calculator">×</button></div>' +
      '<div data-p="val"><input class="calc-in" data-f="e" placeholder="e.g. ln(865)/9 or sin(2)" aria-label="Expression" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
      '<div data-p="int" hidden><input class="calc-in" data-f="f" placeholder="f(x), e.g. sqrt(1 + 4x^2)" aria-label="Function to integrate" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row calc-lims"><input class="calc-in" data-f="a" placeholder="from" aria-label="Lower limit"><input class="calc-in" data-f="b" placeholder="to" aria-label="Upper limit"></div></div>' +
      '<div data-p="gr" hidden><input class="calc-in" data-f="g1" placeholder="y = …, e.g. x^3/10 + 1" aria-label="First curve" autocomplete="off" autocapitalize="off" spellcheck="false"><input class="calc-in" data-f="g2" placeholder="second curve (optional)" aria-label="Second curve" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row calc-lims"><input class="calc-in" data-f="ga" value="-5" aria-label="x from"><input class="calc-in" data-f="gb" value="5" aria-label="x to"></div><div class="calc-plot"></div></div>' +
      (CONFIG.web && typeof Reader !== "undefined" ? '<div class="row calc-from"><button class="btn small" data-from-pad title="Reads what you boxed on the problem’s scratch pad (or its last line) into the box above">Read from the problem’s scratch pad</button></div>' : "") +
      '<div class="calc-pad"></div>' +
      '<p class="muted calc-note">Radians. Type pi for π and e for Euler’s number, the same way as in answer boxes.</p><div class="calc-out" aria-live="polite"></div>';
    document.body.appendChild(box);
    var mode = "val", out = box.querySelector(".calc-out"), plot = box.querySelector(".calc-plot"), lastIn = null;
    if (CONFIG.web && typeof Reader !== "undefined") { // the calculator's own pad, with the same tools and reader
      PROB.__calc = { pid: "__calc", type: "calc", calc: true };
      box.querySelector(".calc-pad").innerHTML = scratchHTML(PROB.__calc);
    }
    box.addEventListener("focusin", function (ev) { if (ev.target.classList.contains("calc-in")) lastIn = ev.target; });
    function v(n) { return box.querySelector('[data-f="' + n + '"]').value.trim(); }
    function num(s) { return E.ev(E.parse(s), 0, 0); }
    function fn(s) { var a = E.parse(s); return function (x) { return E.ev(a, x, 0); }; }
    function r(x) { return isFinite(x) ? String(+x.toPrecision(10)) : "undefined"; }
    function f4(x) { return (Math.abs(x) < 5e-5 ? 0 : x).toFixed(4); }
    function simpson(f, a, b, n) { var h = (b - a) / n, s = f(a) + f(b); for (var i = 1; i < n; i++) s += f(a + i * h) * (i % 2 ? 4 : 2); return s * h / 3; }
    function draw(fs, A, B, roots) {
      var n = 300, ys = [], pts = fs.map(function (f) { var a = []; for (var i = 0; i <= n; i++) { var x = A + (B - A) * i / n, y = f(x); a.push([x, y]); if (isFinite(y)) ys.push(y); } return a; });
      if (!ys.length) { plot.innerHTML = ""; return; }
      ys.sort(function (p, q) { return p - q; });
      var lo = Math.min(ys[Math.floor(ys.length * 0.03)], 0), hi = Math.max(ys[Math.ceil(ys.length * 0.97) - 1], 0), pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
      var W = 340, H = 220, X = function (x) { return (x - A) / (B - A) * W; }, Y = function (y) { return H - (y - lo) / (hi - lo) * H; };
      var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Graph of the curves">';
      if (lo < 0 && hi > 0) s += '<line x1="0" x2="' + W + '" y1="' + Y(0) + '" y2="' + Y(0) + '" style="stroke:var(--ink-faint)"/>';
      if (A < 0 && B > 0) s += '<line y1="0" y2="' + H + '" x1="' + X(0) + '" x2="' + X(0) + '" style="stroke:var(--ink-faint)"/>';
      pts.forEach(function (a, k) {
        var d = "", pen = false;
        a.forEach(function (p) { if (!isFinite(p[1]) || p[1] < lo - (hi - lo) || p[1] > hi + (hi - lo)) { pen = false; return; } d += (pen ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); pen = true; });
        s += '<path d="' + d + '" style="fill:none;stroke-width:2;stroke:var(--' + (k ? "break" : "ink") + ')"/>';
      });
      roots.forEach(function (x) { s += '<circle cx="' + X(x).toFixed(1) + '" cy="' + Y(fs[0](x)).toFixed(1) + '" r="4" style="fill:var(--accent)"/>'; });
      plot.innerHTML = s + '<text x="4" y="12" style="font-size:11px;fill:var(--ink-faint)">y from ' + r(+lo.toPrecision(3)) + " to " + r(+hi.toPrecision(3)) + "</text></svg>";
    }
    function run() {
      try {
        if (mode === "val") {
          if (!v("e")) { out.textContent = ""; return; }
          var ast = E.parse(v("e")), pv = '<span class="m">' + E.pretty(ast) + "</span>", g1 = E.ev(ast, 0.3, 0.37), g2 = E.ev(ast, 0.7, 0.91);
          if (g1 !== g2 && !(isNaN(g1) && isNaN(g2))) { out.innerHTML = pv + '<br><span class="muted">This has x (or C) in it, so it isn’t a single number. Put a number in place of x, or use the Integral or Graph tab.</span>'; return; }
          out.innerHTML = pv + " = <b>" + r(g1) + "</b>"; return;
        }
        if (mode === "int") {
          if (!v("f") || !v("a") || !v("b")) { out.textContent = "Enter the function and both limits."; return; }
          var f = fn(v("f")), a = num(v("a")), b = num(v("b")), s1 = simpson(f, a, b, 2000), s2 = simpson(f, a, b, 4000);
          out.innerHTML = "≈ <b>" + r(s2) + "</b>" + (!isFinite(s2) || Math.abs(s1 - s2) > 1e-6 * Math.max(1, Math.abs(s2)) ? ' <span class="muted">The function blows up or jumps somewhere in there, so don’t trust this one.</span>' : "");
          return;
        }
        if (!v("g1")) { out.textContent = ""; plot.innerHTML = ""; return; }
        var f1 = fn(v("g1")), two = !!v("g2"), f2 = two ? fn(v("g2")) : function () { return 0; }, A = num(v("ga")), B = num(v("gb")), n = 2000, roots = [];
        if (!(B > A)) { out.textContent = "The second x-value must be bigger than the first."; return; }
        var d = function (x) { return f1(x) - f2(x); };
        for (var i = 0; i < n; i++) {
          var p = A + (B - A) * i / n, q = A + (B - A) * (i + 1) / n, dp = d(p), dq = d(q);
          if (!isFinite(dp) || !isFinite(dq)) continue;
          if (dp === 0) { roots.push(p); continue; }
          if (dp * dq < 0) { for (var k = 0; k < 60; k++) { var m = (p + q) / 2, dm = d(m); if (dp * dm <= 0) q = m; else { p = m; dp = dm; } } var x = (p + q) / 2; if (Math.abs(d(x)) < 1e-6 * (1 + Math.abs(f1(x)))) roots.push(x); }
        }
        draw(two ? [f1, f2] : [f1], A, B, roots);
        out.innerHTML = roots.length ? (two ? "They cross at " : "Zeros at ") + roots.map(function (x) { return "x ≈ <b>" + f4(x) + "</b> (y ≈ " + f4(f1(x)) + ")"; }).join(", ") : (two ? "They don’t cross" : "No zeros") + " between " + A + " and " + B + ". Try a wider range.";
      } catch (e) { out.textContent = e.message; if (mode === "gr") plot.innerHTML = ""; }
    }
    var tmr = null;
    box.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { box.hidden = true; btn.focus(); } });
    box.addEventListener("input", function () { clearTimeout(tmr); tmr = setTimeout(run, 250); });
    box.addEventListener("click", function (ev) {
      var t = ev.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-x")) { box.hidden = true; return; }
      if (t.hasAttribute("data-from-pad")) { // the pad under a problem: the one last used, else the first open one on the page
        var pad = LAST_PAD && LAST_PAD.isConnected && LAST_PAD.__api ? LAST_PAD : null;
        if (!pad) pad = $$("#page .scratch").filter(function (x) { return x.__api && !x.__api.isEmpty(); })[0] || null;
        if (!pad) { toast("Open a problem’s scratch pad and write on it first."); return; }
        readAnswer(pad.dataset.pid, t, true, pad); return;
      }
      if (t.dataset.m) {
        mode = t.dataset.m;
        box.querySelectorAll("[data-m]").forEach(function (b) { b.classList.toggle("on", b === t); });
        box.querySelectorAll("[data-p]").forEach(function (p) { p.hidden = p.dataset.p !== mode; });
        run();
      }
    });
    function open() { box.hidden = false; mountScratches(); }
    btn.addEventListener("click", function () { box.hidden = !box.hidden; if (!box.hidden) { mountScratches(); var i = box.querySelector('[data-p="' + mode + '"] input'); if (i) i.focus(); } });
    CALC = {
      open: open,
      target: function () { // the box last typed in, if it's on the tab showing; else the first box of that tab
        var pane = box.querySelector('[data-p="' + mode + '"]');
        if (lastIn && pane.contains(lastIn)) return lastIn;
        return pane.querySelector("input");
      }
    };
  })();
  initReader();
  lastJSON = fingerprint();
  render();
  if (CONFIG.web) initGH(); else if (CONFIG.hosted) { initCloud(); initSample(); } else { initFile(); extPost("hello"); }
  if (fromFile && !CONFIG.web) setTimeout(function () { toast("Picked up where you left off, using the progress saved in this file."); }, 400);
})();

</script>
