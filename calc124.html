<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc 1 Companion</title>
<link rel="manifest" href="calc124.webmanifest">
<meta name="theme-color" content="#4E1AC2">
<link rel="icon" type="image/png" href="icons/calc124-192.png">
<link rel="apple-touch-icon" href="icons/calc124-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calc I">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --bg: #EEF2F7; --bg-grid: #E0E7F1; --surface: #FFFFFF; --surface-2: #F6F8FB; --sunken: #E9EEF5;
  --border: #D4DCE8; --border-strong: #B9C5D6;
  --ink: #18202F; --ink-soft: #465169; --ink-faint: #67728A;
  --accent: #C24E1A; --accent-hover: #A8410F; --accent-ink: #FFFFFF; --accent-soft: #FBE7DC; --accent-soft-border: #EFC3A7;
  --good: #1B7A55; --good-soft: #DDF1E7; --good-border: #9FD3BB;
  --warn: #8A5D00; --warn-soft: #FBF0D6; --warn-border: #E7CB86;
  --bad: #B3261E; --bad-soft: #FBE3E1; --bad-border: #EDB1AC;
  --break: #2E6DB4; --break-soft: #DDEAF8;
  --shadow: 0 1px 2px rgba(24,32,47,.06), 0 4px 14px rgba(24,32,47,.05);
  --focus: #C24E1A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F15; --bg-grid: #141924; --surface: #141923; --surface-2: #10141C; --sunken: #0E121A;
    --border: #252D3B; --border-strong: #354055;
    --ink: #E8ECF3; --ink-soft: #AAB4C6; --ink-faint: #8792A6;
    --accent: #F0844C; --accent-hover: #F59B6A; --accent-ink: #1A0E05; --accent-soft: #2B1A10; --accent-soft-border: #4C301C;
    --good: #52C495; --good-soft: #11261D; --good-border: #24543F;
    --warn: #E6B85A; --warn-soft: #2A2110; --warn-border: #574320;
    --bad: #F28B82; --bad-soft: #2E1514; --bad-border: #5C2B28;
    --break: #7FB3EE; --break-soft: #13233A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    --focus: #F0844C;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F15; --bg-grid: #141924; --surface: #141923; --surface-2: #10141C; --sunken: #0E121A;
  --border: #252D3B; --border-strong: #354055;
  --ink: #E8ECF3; --ink-soft: #AAB4C6; --ink-faint: #8792A6;
  --accent: #F0844C; --accent-hover: #F59B6A; --accent-ink: #1A0E05; --accent-soft: #2B1A10; --accent-soft-border: #4C301C;
  --good: #52C495; --good-soft: #11261D; --good-border: #24543F;
  --warn: #E6B85A; --warn-soft: #2A2110; --warn-border: #574320;
  --bad: #F28B82; --bad-soft: #2E1514; --bad-border: #5C2B28;
  --break: #7FB3EE; --break-soft: #13233A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  --focus: #F0844C;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: "IBM Plex Serif", Georgia, serif; margin: 0; text-wrap: balance; line-height: 1.2; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- math ---------- */
.m { font-family: "IBM Plex Serif", "Cambria Math", Georgia, serif; font-size: 1.06em; white-space: nowrap; }
.m i, .pv i, .fb i { font-style: italic; }
.fn { font-style: normal; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; margin: 0 .12em; line-height: 1.15; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .2em .05em; }
.frac > span:last-child { padding: .05em .2em 0; }
.ov { border-top: 1px solid currentColor; padding: 0 .1em; margin-left: .05em; }
sup { font-size: .72em; line-height: 0; }
sup sup { font-size: .85em; }
.is { font-size: 1.45em; line-height: 1; vertical-align: -.18em; margin-right: .08em; font-weight: 300; }
.sg { font-size: 1.25em; line-height: 1; }
.intl { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin-right: .15em; line-height: 1; }
.intl .ib, .intl .ia { font-size: .66em; line-height: 1.2; }
.intl .is { vertical-align: 0; margin: 0; }

/* ---------- app frame ---------- */
.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--border); padding: 20px 14px 40px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: "IBM Plex Serif", Georgia, serif; font-size: 19px; font-weight: 600; }
.brand span { font-size: 12.5px; color: var(--ink-faint); }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-main a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; font-weight: 500; color: var(--ink-soft);
}
.nav-main a:hover { background: var(--surface-2); color: var(--ink); }
.nav-main a.on { background: var(--accent-soft); color: var(--ink); }
.badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
.nav-phase { display: flex; flex-direction: column; gap: 1px; }
.nav-ph { padding: 4px 10px 6px; display: flex; flex-direction: column; }
.nav-ph b { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.nav-ph span { font-size: 12.5px; color: var(--ink-soft); }
.nav-s {
  display: grid; grid-template-columns: 10px 36px 1fr auto; align-items: center; gap: 6px; padding: 6px 10px;
  border-radius: 7px; text-decoration: none; font-size: 13.5px; color: var(--ink-soft);
}
.nav-s:hover { background: var(--surface-2); color: var(--ink); }
.nav-s.on { background: var(--sunken); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.nav-s .sid { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.nav-s .stt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-s .sd { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: transparent; }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.active { border-color: var(--accent); background: var(--accent-soft); }
.dot.behind { border-color: var(--warn); background: var(--warn-soft); }
.dot.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 28px; background: var(--bg); /* solid: the frosted see-through look made the page under it look blurry */
  border-bottom: 1px solid var(--border);
}
.icon-btn.menu-btn { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft); white-space: nowrap; text-decoration: none;
}
.chip b { color: var(--ink); font-weight: 600; }
.chip.hot { background: var(--accent-soft); border-color: var(--accent-soft-border); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.spacer { flex: 1; }
.timer { display: inline-flex; align-items: center; gap: 0; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.timer button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.timer button:hover { background: var(--surface-2); }
.timer .tm { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.focus { border-color: var(--accent); background: var(--accent-soft); }
.timer.break { border-color: var(--break); background: var(--break-soft); }
.timer .sep { width: 1px; align-self: stretch; background: var(--border); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }

.page { width: 100%; max-width: 820px; margin: 0 auto; padding: 32px 28px 120px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.page h1 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 600; }
.lede { color: var(--ink-soft); font-size: 15.5px; max-width: 64ch; margin: 6px 0 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
.card h2 { font-size: 18px; font-weight: 600; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.muted { color: var(--ink-faint); font-size: 13.5px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink-soft); cursor: pointer; font-size: 13.5px; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.link-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* ---------- today ---------- */
.next { border: 1px solid var(--accent-soft-border); background: linear-gradient(var(--accent-soft), var(--surface) 70%); }
.next .big { font-family: "IBM Plex Serif", Georgia, serif; font-size: 24px; font-weight: 600; margin: 6px 0 4px; }
.next .where { color: var(--ink-soft); margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.count { font-family: "IBM Plex Mono", monospace; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.hw-list li { display: grid; grid-template-columns: 22px 44px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 6px; font-size: 14px; }
.hw-list li.done .hw-t { color: var(--ink-faint); text-decoration: line-through; }
.hw-list .hw-id { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; }
.hw-list a { font-size: 12px; color: var(--ink-faint); text-decoration: none; font-family: "IBM Plex Mono", monospace; }
.hw-list a:hover { color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border: 1px solid var(--border); border-radius: 9px; padding: 8px 6px; text-align: center; background: var(--surface-2); text-decoration: none; min-height: 74px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.wd .wdn { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-family: "IBM Plex Mono", monospace; }
.wd .wdd { font-size: 15px; font-weight: 600; }
.wd .wds { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; }
.wd.is-today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface); }
.wds.done { background: var(--good-soft); color: var(--good); }
.wds.todo { background: var(--sunken); color: var(--ink-soft); }
.wds.behind { background: var(--warn-soft); color: var(--warn); }
.streak { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.streak span { width: 16px; height: 16px; border-radius: 4px; background: var(--sunken); border: 1px solid var(--border); }
.streak span.on { background: var(--good); border-color: var(--good); }
.streak span.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.tip { font-size: 13.5px; color: var(--ink-soft); }
.tip summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.tip ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }

/* ---------- plan ---------- */
.phase-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.phase-h h2 { font-size: 21px; }
.blk { display: flex; flex-direction: column; gap: 8px; }
.blk-h { font-weight: 600; font-size: 15px; margin-top: 4px; }
.blk-g { font-size: 13.5px; color: var(--ink-soft); max-width: 66ch; margin: 0 0 4px; }
.prow {
  display: grid; grid-template-columns: 12px 42px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-decoration: none;
}
.prow:hover { border-color: var(--border-strong); }
.prow .sid { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; color: var(--ink-faint); }
.prow .pt { font-weight: 500; }
.prow .pd { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-faint); white-space: nowrap; }
.tag.ok { color: var(--good); border-color: var(--good-border); background: var(--good-soft); }
.tag.star { color: var(--accent); border-color: var(--accent-soft-border); background: var(--accent-soft); }

/* ---------- session ---------- */
.crumb { font-size: 13px; color: var(--ink-faint); }
.crumb a { color: inherit; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: var(--topH, 55px); z-index: 10; background: var(--bg); padding-top: 4px; }
.tab {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent;
  margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; font-size: 14px;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab .tc { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--sunken); color: var(--ink-faint); }
.tab .tc.full { background: var(--good-soft); color: var(--good); }

.parts { display: flex; flex-direction: column; gap: 10px; }
.part { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.part.open { box-shadow: var(--shadow); border-color: var(--border-strong); }
.part-h { width: 100%; border: 0; background: none; padding: 14px 18px; display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; cursor: pointer; text-align: left; }
.part-h .pn { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border-strong); color: var(--ink-faint); }
.part.read .pn { background: var(--good); border-color: var(--good); color: #fff; }
.part-h .ptl { font-weight: 600; font-size: 15.5px; }
.part-h .chev { color: var(--ink-faint); transition: transform .2s; }
.part.open .chev { transform: rotate(90deg); }
.part-b { padding: 0 22px 20px 56px; font-size: 15.5px; line-height: 1.7; }
.part-b p { margin: 0 0 12px; max-width: 64ch; }
.part-f { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.rule { border: 1px solid var(--accent-soft-border); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 12px 0; line-height: 1.8; }
.steps { margin: 8px 0 12px; padding-left: 22px; display: grid; gap: 6px; }
.steps li { padding-left: 4px; }
.steps li::marker { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.tbl-wrap { overflow-x: auto; margin: 10px 0 14px; border: 1px solid var(--border); border-radius: 10px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-weight: 600; background: var(--surface-2); }
.tbl th, .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- problems ---------- */
.prob-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.pdots { display: flex; gap: 6px; flex-wrap: wrap; }
.pdot { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.pdot.cur { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.pdot.correct { background: var(--good); border-color: var(--good); color: #fff; }
.pdot.almost { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pdot.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.prob { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); transition: border-color .25s; }
.prob.correct { border-color: var(--good); }
.prob.almost { border-color: var(--warn); }
.prob.wrong { border-color: var(--bad-border); }
.prob-q { display: flex; gap: 12px; align-items: baseline; font-size: 17px; line-height: 1.9; }
.prob-q .qn { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); font-weight: 600; flex: none; }
.ans-row { display: flex; gap: 8px; }
.ans, .calc-in {
  flex: 1; min-width: 0; font-family: "IBM Plex Mono", monospace; font-size: 16px; padding: 10px 12px; border-radius: 9px;
  border: 1.5px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
}
.ans:focus, .calc-in:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.pv { min-height: 26px; font-size: 14px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv .m { color: var(--ink); font-size: 1.15em; }
.pv.err { color: var(--warn); }
.fb { border-radius: 9px; padding: 10px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; }
.fb.correct { background: var(--good-soft); color: var(--good); border: 1px solid var(--good-border); }
.fb.almost { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-border); }
.fb.wrong, .fb.error { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
.fb b { font-weight: 600; }
.fb .fbm { color: var(--ink); }
.prob-tools { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.reveal { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 9px; padding: 10px 14px; font-size: 14.5px; }
.reveal .steps { margin: 4px 0; }
.howto { font-size: 13.5px; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.howto summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.howto table { margin-top: 8px; border-collapse: collapse; }
.howto td { padding: 3px 14px 3px 0; }
.howto code { font-family: "IBM Plex Mono", monospace; background: var(--sunken); padding: 1px 6px; border-radius: 5px; color: var(--ink); }
.pop { animation: pop .45s ease; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.012); } 100% { transform: scale(1); } }

/* flashcards */
.flash { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.fcard {
  min-height: 190px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 26px; cursor: pointer; padding: 24px; text-align: center;
}
.fcard .side-lbl { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.fcard.back { background: var(--surface-2); border-color: var(--accent-soft-border); }

/* quiz */
.qbar { position: sticky; top: calc(var(--topH, 55px) + 50px); z-index: 9; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); }
.qbar .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); }
.qbar .tm { font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qbar.low { background: var(--bad); color: #fff; }
.score { font-family: "IBM Plex Mono", monospace; font-size: 40px; font-weight: 600; }

/* notes, resources */
.res { display: grid; gap: 8px; }
.res a { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-decoration: none; }
.res a:hover { border-color: var(--accent-soft-border); background: var(--accent-soft); }
.res a span:last-child { color: var(--ink-faint); }
textarea.notes { width: 100%; min-height: 140px; resize: vertical; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--ink); padding: 12px 14px; font: inherit; line-height: 1.6; }
textarea.notes:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 18px; }
.done-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--good-soft); border: 1px solid var(--good-border); color: var(--good); border-radius: 12px; padding: 14px 18px; }
.done-banner b { color: var(--ink); }
.empty { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 22px; text-align: center; color: var(--ink-soft); background: var(--surface-2); }

/* mistakes */
.mist { display: flex; flex-direction: column; gap: 10px; }
.mrow { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: grid; gap: 8px; }
.mrow.res-ok { opacity: .62; }
.mrow-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.mq { font-size: 16px; line-height: 1.9; }
.mcmp { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; align-items: baseline; }
.mcmp .l { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--bg); }

input[type="checkbox"].ck { appearance: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer; position: relative; margin: 0; flex: none; }
input[type="checkbox"].ck:checked { background: var(--good); border-color: var(--good); }
input[type="checkbox"].ck:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(40deg); }

.calc { position: fixed; right: 16px; bottom: 16px; width: min(380px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; z-index: 45; }
.calc-h { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: center; gap: 8px; position: relative; padding-right: 40px; }
.calc-h > [data-x] { position: absolute; top: 0; right: 0; } /* the close button stays in the top right, even when the header wraps */
.calc input { width: 100%; box-sizing: border-box; margin-top: 8px; }
.calc-lims { gap: 8px; flex-wrap: nowrap; }
.calc-lims input { flex: 1; min-width: 0; }
.calc-note { margin: 6px 0 0; font-size: 13px; }
.calc-from { margin-top: 10px; }
.calc-out { margin-top: 10px; font-size: 15px; line-height: 1.5; }
.calc-plot svg { display: block; width: 100%; height: auto; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 50; transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; width: 300px; max-width: 86vw; transform: translateX(-102%); transition: transform .22s; box-shadow: var(--shadow); }
  .app.nav-open .side { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; }
  .icon-btn.menu-btn { display: inline-flex; }
  .timer [data-act="timer-len"], .timer .sep:first-of-type { display: none; }
  .top { gap: 8px; }
  .top { padding: 10px 16px; }
  .page { padding: 22px 16px 100px; }
  .part-b { padding: 0 16px 18px 16px; }
  .week { grid-template-columns: repeat(7, minmax(40px, 1fr)); overflow-x: auto; }
  .prow { grid-template-columns: 12px 30px 1fr auto; }
  .prow .tag { display: none; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.ulist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.urow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.urow .bar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.urow .bar span { display: block; height: 100%; background: var(--good); border-radius: 4px; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.choice { text-align: left; padding: 11px 14px; border-radius: 9px; border: 1.5px solid var(--border-strong); background: var(--surface-2); cursor: pointer; font-size: 15px; line-height: 1.5; }
.choice:hover { border-color: var(--accent); background: var(--surface); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.sel.correct { border-color: var(--good); background: var(--good-soft); }
.choice.sel.wrong { border-color: var(--bad); background: var(--bad-soft); }

.chip.ok { background: var(--good-soft); border-color: var(--good-border); color: var(--good); cursor: pointer; }
button.chip { font: inherit; font-size: 13px; cursor: pointer; }

.scratch-wrap { display: flex; flex-direction: column; gap: 8px; }
.scratch-toggle { align-self: flex-start; }
.scratch { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.scr-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface); }
.scr-tools .seg button { padding: 5px 10px; }
.scr-canvas { width: 100%; }
.scr-canvas canvas { display: block; touch-action: none; cursor: crosshair; background: var(--surface-2); }
.scr-fb { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; color: var(--ink-soft); background: var(--surface); }
.scr-fb.done { color: var(--ink); }

/* exams */
.dl-wrap { display: inline-flex; gap: 8px; align-items: center; min-width: 0; }
.exam-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent-soft-border); font-size: 14px; }
.exam-row.soon { background: var(--warn-soft); border-color: var(--warn-border); }
.exam-row .exam-a { display: inline-flex; gap: 10px; align-items: baseline; }
.exam-row a { color: var(--accent); font-weight: 600; text-decoration: none; }
.exam-row a:hover { text-decoration: underline; }
.wds.exam { background: var(--accent); color: var(--accent-ink); }
.hw-list .hw-links { display: inline-flex; gap: 10px; }
ul.wamap { margin: 0 0 10px; padding-left: 20px; line-height: 1.7; }
@media (max-width: 700px) { .hw-list .hw-links a[title="Open on Canvas"] { display: none; } }

/* a problem's pad as the Scratch Pad app in a frame (web build) */
.scratch.scratch-embed { border: 0; background: none; overflow: visible; border-radius: 0; }
.scr-frame { display: block; width: 100%; height: 560px; border: 0; background: transparent; color-scheme: normal; }

/* web build: a newer version was published while the app was open (src/web/update.js) */
.update-btn { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 10px 12px 10px 18px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); cursor: pointer; }
.update-btn b { background: var(--accent); color: var(--accent-ink); padding: 6px 12px; border-radius: 7px; font-weight: 600; }

/* "More like this": extra problems under a practice problem (more.js) */
.more-wrap { display: flex; flex-direction: column; gap: 12px; margin-top: -4px; }
.more-btn { align-self: flex-start; }
.more-list { display: flex; flex-direction: column; gap: 14px; padding-left: 14px; border-left: 3px solid var(--accent-soft-border); }

/* "Teach the reader" (ui.js, #/teach) */
.teach-syms { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.teach-sym { min-width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; cursor: pointer; }
.teach-sym.done { border-color: var(--good); color: var(--good); }
.teach-sym.on { outline: 2px solid var(--accent); outline-offset: 1px; }
.teach-now { font-size: 17px; margin-bottom: 10px; }
.teach-big { font-size: 30px; margin: 0 4px; }
.teach-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.teach-box { width: 100%; height: 150px; border: 1.5px dashed var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--ink); touch-action: none; cursor: crosshair; }
.teach-box.bad { border-color: var(--bad); border-style: solid; }
.teach-msg { min-height: 1.4em; margin: 8px 0; color: var(--bad); }
.badge.soft { background: var(--sunken); color: var(--ink-soft); border-color: var(--border); }
.teach-try { height: 170px; }

/* Ask Gemini on the iPad: "Picture copied" + Open Gemini (ui.js geminiBar) */
.gem-bar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); padding: 12px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 30px rgba(0,0,0,.25); font-size: 15px; }
.gem-bar[hidden] { display: none; }
.gem-bar .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); text-decoration: none; }
.gem-bar .btn.ghost { background: transparent; color: var(--bg); border-color: transparent; }

    </header>

  </div>
</div>

<script>
/* ===== Math engine: parse, pretty-print, evaluate, compare ===== */
var MathEngine = (function () {
  var UNIT = 1; // radians; evAngle() switches to degrees for one evaluation (the calculator's Deg mode)
  var NAMES = ["arcsin", "arccos", "arctan", "sqrt", "cbrt", "sin", "cos", "tan", "sec", "csc", "cot", "exp", "abs", "log", "ln", "pi", "e", "x", "c"];
  var FNS = { arcsin: 1, arccos: 1, arctan: 1, sqrt: 1, cbrt: 1, sin: 1, cos: 1, tan: 1, sec: 1, csc: 1, cot: 1, exp: 1, abs: 1, log: 1, ln: 1 };

  function normalize(s) {
    return String(s)
      .replace(/[−–—]/g, "-")
      .replace(/[×·⋅∙]/g, "*")
      .replace(/÷/g, "/")
      .replace(/π/g, "pi")
      .replace(/√/g, "sqrt")
      .replace(/∛/g, "cbrt")
      .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, function (m) { return "^(" + m.split("").map(function (ch) { return ch === "⁻" ? "-" : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(ch); }).join("") + ")"; })
      .replace(/\*\*/g, "^")
      .replace(/[\[{]/g, "(").replace(/[\]}]/g, ")")
      .replace(/\s*d\s*x\s*$/i, "");
  }

  function tokenize(src, sym) {
    var s = normalize(src), out = [], i = 0;
    while (i < s.length) {
      var c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        var m = /^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));
        if (!m) throw new Error('Check the number near "' + s.slice(i, i + 4) + '"');
        out.push({ k: "num", v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if (/[a-zA-Z]/.test(c)) {
        var run = /^[a-zA-Z]+/.exec(s.slice(i))[0];
        var low = run.toLowerCase(), j = 0;
        while (j < low.length) {
          var hit = null;
          for (var n = 0; n < NAMES.length; n++) {
            if (low.substr(j, NAMES[n].length) === NAMES[n]) { if (!hit || NAMES[n].length > hit.length) hit = NAMES[n]; }
          }
          if (!hit && sym) { out.push({ k: "sym", v: run[j] }); j++; continue; }
          if (!hit) throw new Error('I don’t recognize "' + run + '". Use x as the variable.');
          if (FNS[hit]) out.push({ k: "fn", v: hit });
          else if (hit === "x") out.push({ k: "x" });
          else if (hit === "c") out.push({ k: "C" });
          else out.push({ k: "const", v: hit });
          j += hit.length;
        }
        i += run.length; continue;
      }
      if ("+-*/^()|_".indexOf(c) >= 0) { out.push({ k: "op", v: c }); i++; continue; }
      if (c === "'") throw new Error("Type the answer itself, not f′(x).");
      if (c === "=") throw new Error("Leave out the “y =” part and type only the right side.");
      throw new Error('Unexpected "' + c + '"');
    }
    return out;
  }

  function parse(src, opts) {
    if (!String(src).trim()) throw new Error("Type an answer first.");
    var t = tokenize(src, opts && opts.sym), p = 0;
    if (!t.length) throw new Error("Type an answer first.");
    function peek() { return t[p]; }
    function isOp(v) { var x = t[p]; return x && x.k === "op" && x.v === v; }
    function expect(v) {
      if (!isOp(v)) throw new Error(v === ")" ? "A closing parenthesis is missing." : 'Expected "' + v + '"');
      p++;
    }
    function startsPrimary(x) {
      return x && (x.k === "num" || x.k === "x" || x.k === "const" || x.k === "C" || x.k === "fn" || x.k === "sym" || (x.k === "op" && x.v === "("));
    }
    function expr() {
      var n = term();
      while (isOp("+") || isOp("-")) { var op = t[p++].v; n = { t: "bin", op: op, a: n, b: term() }; }
      return n;
    }
    function term() {
      var n = unary();
      for (;;) {
        if (isOp("*") || isOp("/")) { var op = t[p++].v; n = { t: "bin", op: op, a: n, b: unary() }; }
        else if (startsPrimary(peek())) { n = { t: "bin", op: "*", a: n, b: power(), imp: true }; }
        else break;
      }
      return n;
    }
    function unary() {
      if (isOp("-")) { p++; return { t: "neg", a: unary() }; }
      if (isOp("+")) { p++; return unary(); }
      return power();
    }
    function power() {
      var b = primary();
      if (isOp("^")) { p++; return { t: "bin", op: "^", a: b, b: unary() }; }
      return b;
    }
    function primary() {
      var x = t[p++];
      if (!x) throw new Error("The answer ends too early. Is something missing?");
      if (x.k === "num") return { t: "num", v: x.v };
      if (x.k === "x") return { t: "x" };
      if (x.k === "C") return { t: "C" };
      if (x.k === "const") return { t: "const", v: x.v };
      if (x.k === "sym") {
        if ("fghFG".indexOf(x.v) >= 0 && isOp("(")) { p++; var sa = expr(); expect(")"); return { t: "fn", name: x.v, sym: true, a: sa }; }
        return { t: "sym", v: x.v };
      }
      if (x.k === "op" && x.v === "(") { var e = expr(); expect(")"); return e; }
      if (x.k === "op" && x.v === "|") { var a = expr(); expect("|"); return { t: "fn", name: "abs", a: a }; }
      if (x.k === "fn") {
        var pw = null, base = null;
        if (x.v === "log" && isOp("_")) { p++; base = primary(); }
        if (isOp("^")) { p++; pw = unary(); }
        var arg;
        if (isOp("(")) { p++; arg = expr(); expect(")"); }
        else if (isOp("|")) { arg = primary(); }
        else if (!peek()) throw new Error(x.v + " needs something after it, like " + x.v + "(x).");
        else arg = power();
        var node = { t: "fn", name: x.v, a: arg };
        if (base) node.base = base;
        return pw ? { t: "bin", op: "^", a: node, b: pw } : node;
      }
      throw new Error('Unexpected "' + (x.v || x.k) + '"');
    }
    var root = expr();
    if (p < t.length) {
      var bad = t[p];
      if (bad.k === "op" && bad.v === ")") throw new Error("There’s an extra closing parenthesis.");
      throw new Error('Unexpected "' + (bad.v || bad.k) + '"');
    }
    return root;
  }

  function ev(n, x, C) {
    switch (n.t) {
      case "num": return n.v;
      case "x": return x;
      case "C": return C;
      case "sym": return NaN;
      case "const": return n.v === "pi" ? Math.PI : Math.E;
      case "neg": return -ev(n.a, x, C);
      case "bin":
        var a = ev(n.a, x, C), b = ev(n.b, x, C);
        if (n.op === "+") return a + b;
        if (n.op === "-") return a - b;
        if (n.op === "*") return a * b;
        if (n.op === "/") return a / b;
        if (a < 0 && Math.abs(b) < 1 && !Number.isInteger(b)) {
          for (var d = 1; d <= 9; d += 2) { var nu = b * d; if (Math.abs(nu - Math.round(nu)) < 1e-9) { var r = Math.pow(-a, b); return Math.round(nu) % 2 ? -r : r; } }
        }
        return Math.pow(a, b);
      case "fn":
        var v = ev(n.a, x, C);

  function streakHTML() {

  /* ---------- SESSION ---------- */
  var openPart = {};

      tabs.push(["practice", "Check-in", nd + "/" + s.probs.length, nd === s.probs.length]);
      tabs.push(["learn", "Review", diagDone(s) ? (rv ? rv + " to review" : "all clear") : "", diagDone(s) && !rv]);
    }

    if (s.quiz) tabs.push(["quiz", "Quiz", S.quiz[s.id] ? S.quiz[s.id].best + "/" + S.quiz[s.id].total : "", false]);

  /* ---------- calculator (added Oct 15: values, definite integrals, graphs and crossing points) ---------- */
  (function () {

    box.innerHTML = '<div class="calc-h"><div class="seg"><button class="on" data-m="val">Calculate</button><button data-m="int">Integral</button><button data-m="gr">Graph</button></div><div class="seg calc-unit" title="Angles in radians or degrees"><button data-u="rad">Rad</button><button data-u="deg">Deg</button></div><button class="icon-btn" data-x aria-label="Close calculator">×</button></div>' +
      '<div data-p="val"><input class="calc-in" data-f="e" placeholder="e.g. ln(865)/9 or sin(2)" aria-label="Expression" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
      '<div data-p="int" hidden><input class="calc-in" data-f="f" placeholder="f(x), e.g. sqrt(1 + 4x^2)" aria-label="Function to integrate" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row calc-lims"><input class="calc-in" data-f="a" placeholder="from" aria-label="Lower limit"><input class="calc-in" data-f="b" placeholder="to" aria-label="Upper limit"></div></div>' +

      (CONFIG.web && typeof Reader !== "undefined" ? '<div class="row calc-from"><button class="btn small" data-from-pad title="Reads what you boxed on the problem’s scratch pad (or its last line) into the box above">Read from the problem’s scratch pad</button></div>' : "") +
      '<div class="calc-pad"></div>' +

    document.body.appendChild(box);
    var mode = "val", out = box.querySelector(".calc-out"), plot = box.querySelector(".calc-plot"), lastIn = null;
    if (CONFIG.web && typeof Reader !== "undefined") { // the calculator's own pad, with the same tools and reader

    }

    function v(n) { return box.querySelector('[data-f="' + n + '"]').value.trim(); }
    var deg = S.prefs.calcDeg === true;
    function unit() { box.querySelectorAll("[data-u]").forEach(function (b) { b.classList.toggle("on", (b.dataset.u === "deg") === deg); }); box.querySelector("[data-unit]").textContent = deg ? "Degrees" : "Radians"; }
    unit();
    function num(s) { return E.evAngle(E.parse(s), 0, 0, deg); }
    function fn(s) { var a = E.parse(s); return function (x) { return E.evAngle(a, x, 0, deg); }; }
    function r(x) { return isFinite(x) ? String(+x.toPrecision(10)) : "undefined"; }

    }
    function f4(x) { return (Math.abs(x) < 5e-5 ? 0 : x).toFixed(4); }
    function simpson(f, a, b, n) { var h = (b - a) / n, s = f(a) + f(b); for (var i = 1; i < n; i++) s += f(a + i * h) * (i % 2 ? 4 : 2); return s * h / 3; }
    function draw(fs, A, B, roots) {
      var n = 300, ys = [], pts = fs.map(function (f) { var a = []; for (var i = 0; i <= n; i++) { var x = A + (B - A) * i / n, y = f(x); a.push([x, y]); if (isFinite(y)) ys.push(y); } return a; });
      if (!ys.length) { plot.innerHTML = ""; return; }
      ys.sort(function (p, q) { return p - q; });

      var W = 340, H = 220, X = function (x) { return (x - A) / (B - A) * W; }, Y = function (y) { return H - (y - lo) / (hi - lo) * H; };
      var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Graph of the curves">';
      if (lo < 0 && hi > 0) s += '<line x1="0" x2="' + W + '" y1="' + Y(0) + '" y2="' + Y(0) + '" style="stroke:var(--ink-faint)"/>';
      if (A < 0 && B > 0) s += '<line y1="0" y2="' + H + '" x1="' + X(0) + '" x2="' + X(0) + '" style="stroke:var(--ink-faint)"/>';
      pts.forEach(function (a, k) {
        var d = "", pen = false;
        a.forEach(function (p) { if (!isFinite(p[1]) || p[1] < lo - (hi - lo) || p[1] > hi + (hi - lo)) { pen = false; return; } d += (pen ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); pen = true; });

      });

      plot.innerHTML = s + '<text x="4" y="12" style="font-size:11px;fill:var(--ink-faint)">y from ' + r(+lo.toPrecision(3)) + " to " + r(+hi.toPrecision(3)) + "</text></svg>";
    }
    function run() {
      try {
        if (mode === "val") {
          if (!v("e")) { out.textContent = ""; return; }
          var ast = E.parse(v("e")), pv = '<span class="m">' + E.pretty(ast) + "</span>", g1 = E.evAngle(ast, 0.3, 0.37, deg), g2 = E.evAngle(ast, 0.7, 0.91, deg);
          if (g1 !== g2 && !(isNaN(g1) && isNaN(g2))) { out.innerHTML = pv + '<br><span class="muted">This has x (or C) in it, so it isn’t a single number. Put a number in place of x, or use the Integral or Graph tab.</span>'; return; }
          var exv = exactHTML(g1); out.innerHTML = pv + " = " + (exv ? "<b>" + exv + "</b> ≈ " + r(g1) : "<b>" + r(g1) + "</b>"); return;
        }

          var f = fn(v("f")), a = num(v("a")), b = num(v("b")), s1 = simpson(f, a, b, 2000), s2 = simpson(f, a, b, 4000);
          var exi = exactHTML(s2); out.innerHTML = "≈ <b>" + r(s2) + "</b>" + (exi ? ' <span class="muted">(looks like ' + exi + ")</span>" : "") + (!isFinite(s2) || Math.abs(s1 - s2) > 1e-6 * Math.max(1, Math.abs(s2)) ? ' <span class="muted">The function blows up or jumps somewhere in there, so don’t trust this one.</span>' : "");

        var f1 = fn(v("g1")), two = !!v("g2"), f2 = two ? fn(v("g2")) : function () { return 0; }, A = num(v("ga")), B = num(v("gb")), n = 2000, roots = [];

      } catch (e) { out.textContent = e.message; if (mode === "gr") plot.innerHTML = ""; }

        if (!pad) pad = $$("#page .scratch").filter(function (x) { return x.__api && !x.__api.isEmpty(); })[0] || null;
        if (!pad) { toast("Open a problem’s scratch pad and write on it first."); return; }

      if (t.dataset.m) {

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
// Web build only: notice when a newer version has been published while the app is open (Home Screen
// apps stay open for days), and offer a Reload button. build.py swaps fd52da43f24d for the build's hash
// and writes the same hash to version.json. Progress saves as you go, so reloading loses nothing.
(function () {
  var V = "fd52da43f24d", shown = false, last = 0;
  if (window.parent !== window) return; // a problem's Scratch Pad frame: the app around it shows the button
  function check() {
    if (shown || Date.now() - last < 60000 || navigator.onLine === false) return;
    last = Date.now();
    fetch("version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.v && d.v !== V) show(); })
      .catch(function () {});
  }
  function show() {
    shown = true;
    var b = document.createElement("button");
    b.className = "update-btn"; b.type = "button";
    b.innerHTML = "New version ready <b>Reload</b>";
    b.onclick = function () { b.disabled = true; location.reload(); };
    document.body.appendChild(b);
  }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") check(); });
  window.addEventListener("focus", check);
  window.addEventListener("online", check);
  setInterval(check, 10 * 60000);
  setTimeout(check, 5000);
})();
</script>
