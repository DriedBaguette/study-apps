<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precalc Companion</title>
<link rel="manifest" href="precalc.webmanifest">
<meta name="theme-color" content="#1F5E8C">
<link rel="icon" type="image/png" href="icons/precalc-192.png">
<link rel="apple-touch-icon" href="icons/precalc-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Precalc">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  --bg: #EEF2F7; --bg-grid: #E0E7F1; --surface: #FFFFFF; --surface-2: #F6F8FB; --sunken: #E9EEF5;
  --border: #D4DCE8; --border-strong: #B9C5D6;
  --ink: #18202F; --ink-soft: #465169; --ink-faint: #67728A;
  --accent: #C24E1A; --accent-hover: #A8410F; --accent-ink: #FFFFFF; --accent-soft: #FBE7DC; --accent-soft-border: #EFC3A7;
  --good: #1B7A55; --good-soft: #DDF1E7; --good-border: #9FD3BB;
  --warn: #8A5D00; --warn-soft: #FBF0D6; --warn-border: #E7CB86;
  --bad: #B3261E; --bad-soft: #FBE3E1; --bad-border: #EDB1AC;
  --break: #2E6DB4; --break-soft: #DDEAF8;
  --shadow: 0 1px 2px rgba(24,32,47,.06), 0 4px 14px rgba(24,32,47,.05);
  --focus: #C24E1A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F15; --bg-grid: #141924; --surface: #141923; --surface-2: #10141C; --sunken: #0E121A;
    --border: #252D3B; --border-strong: #354055;
    --ink: #E8ECF3; --ink-soft: #AAB4C6; --ink-faint: #8792A6;
    --accent: #F0844C; --accent-hover: #F59B6A; --accent-ink: #1A0E05; --accent-soft: #2B1A10; --accent-soft-border: #4C301C;
    --good: #52C495; --good-soft: #11261D; --good-border: #24543F;
    --warn: #E6B85A; --warn-soft: #2A2110; --warn-border: #574320;
    --bad: #F28B82; --bad-soft: #2E1514; --bad-border: #5C2B28;
    --break: #7FB3EE; --break-soft: #13233A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    --focus: #F0844C;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F15; --bg-grid: #141924; --surface: #141923; --surface-2: #10141C; --sunken: #0E121A;
  --border: #252D3B; --border-strong: #354055;
  --ink: #E8ECF3; --ink-soft: #AAB4C6; --ink-faint: #8792A6;
  --accent: #F0844C; --accent-hover: #F59B6A; --accent-ink: #1A0E05; --accent-soft: #2B1A10; --accent-soft-border: #4C301C;
  --good: #52C495; --good-soft: #11261D; --good-border: #24543F;
  --warn: #E6B85A; --warn-soft: #2A2110; --warn-border: #574320;
  --bad: #F28B82; --bad-soft: #2E1514; --bad-border: #5C2B28;
  --break: #7FB3EE; --break-soft: #13233A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  --focus: #F0844C;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: "IBM Plex Serif", Georgia, serif; margin: 0; text-wrap: balance; line-height: 1.2; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- math ---------- */
.m { font-family: "IBM Plex Serif", "Cambria Math", Georgia, serif; font-size: 1.06em; white-space: nowrap; }
.m i, .pv i, .fb i { font-style: italic; }
.fn { font-style: normal; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; margin: 0 .12em; line-height: 1.15; }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .2em .05em; }
.frac > span:last-child { padding: .05em .2em 0; }
.ov { border-top: 1px solid currentColor; padding: 0 .1em; margin-left: .05em; }
sup { font-size: .72em; line-height: 0; }
sup sup { font-size: .85em; }
.is { font-size: 1.45em; line-height: 1; vertical-align: -.18em; margin-right: .08em; font-weight: 300; }
.sg { font-size: 1.25em; line-height: 1; }
.intl { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin-right: .15em; line-height: 1; }
.intl .ib, .intl .ia { font-size: .66em; line-height: 1.2; }
.intl .is { vertical-align: 0; margin: 0; }

/* ---------- app frame ---------- */
.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--border); padding: 20px 14px 40px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: "IBM Plex Serif", Georgia, serif; font-size: 19px; font-weight: 600; }
.brand span { font-size: 12.5px; color: var(--ink-faint); }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-main a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; font-weight: 500; color: var(--ink-soft);
}
.nav-main a:hover { background: var(--surface-2); color: var(--ink); }
.nav-main a.on { background: var(--accent-soft); color: var(--ink); }
.badge { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
.nav-phase { display: flex; flex-direction: column; gap: 1px; }
.nav-ph { padding: 4px 10px 6px; display: flex; flex-direction: column; }
.nav-ph b { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.nav-ph span { font-size: 12.5px; color: var(--ink-soft); }
.nav-s {
  display: grid; grid-template-columns: 10px 36px 1fr auto; align-items: center; gap: 6px; padding: 6px 10px;
  border-radius: 7px; text-decoration: none; font-size: 13.5px; color: var(--ink-soft);
}
.nav-s:hover { background: var(--surface-2); color: var(--ink); }
.nav-s.on { background: var(--sunken); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.nav-s .sid { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.nav-s .stt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-s .sd { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: transparent; }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.active { border-color: var(--accent); background: var(--accent-soft); }
.dot.behind { border-color: var(--warn); background: var(--warn-soft); }
.dot.today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.icon-btn.menu-btn { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft); white-space: nowrap; text-decoration: none;
}
.chip b { color: var(--ink); font-weight: 600; }
.chip.hot { background: var(--accent-soft); border-color: var(--accent-soft-border); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.spacer { flex: 1; }
.timer { display: inline-flex; align-items: center; gap: 0; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
.timer button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.timer button:hover { background: var(--surface-2); }
.timer .tm { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.focus { border-color: var(--accent); background: var(--accent-soft); }
.timer.break { border-color: var(--break); background: var(--break-soft); }
.timer .sep { width: 1px; align-self: stretch; background: var(--border); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }

.page { width: 100%; max-width: 820px; margin: 0 auto; padding: 32px 28px 120px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.page h1 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 600; }
.lede { color: var(--ink-soft); font-size: 15.5px; max-width: 64ch; margin: 6px 0 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
.card h2 { font-size: 18px; font-weight: 600; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.muted { color: var(--ink-faint); font-size: 13.5px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink-soft); cursor: pointer; font-size: 13.5px; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.link-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }

/* ---------- today ---------- */
.next { border: 1px solid var(--accent-soft-border); background: linear-gradient(var(--accent-soft), var(--surface) 70%); }
.next .big { font-family: "IBM Plex Serif", Georgia, serif; font-size: 24px; font-weight: 600; margin: 6px 0 4px; }
.next .where { color: var(--ink-soft); margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.count { font-family: "IBM Plex Mono", monospace; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hw-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.hw-list li { display: grid; grid-template-columns: 22px 44px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 6px; font-size: 14px; }
.hw-list li.done .hw-t { color: var(--ink-faint); text-decoration: line-through; }
.hw-list .hw-id { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; }
.hw-list a { font-size: 12px; color: var(--ink-faint); text-decoration: none; font-family: "IBM Plex Mono", monospace; }
.hw-list a:hover { color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { border: 1px solid var(--border); border-radius: 9px; padding: 8px 6px; text-align: center; background: var(--surface-2); text-decoration: none; min-height: 74px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.wd .wdn { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; font-family: "IBM Plex Mono", monospace; }
.wd .wdd { font-size: 15px; font-weight: 600; }
.wd .wds { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; }
.wd.is-today { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface); }
.wds.done { background: var(--good-soft); color: var(--good); }
.wds.todo { background: var(--sunken); color: var(--ink-soft); }
.wds.behind { background: var(--warn-soft); color: var(--warn); }
.streak { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.streak span { width: 16px; height: 16px; border-radius: 4px; background: var(--sunken); border: 1px solid var(--border); }
.streak span.on { background: var(--good); border-color: var(--good); }
.streak span.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.tip { font-size: 13.5px; color: var(--ink-soft); }
.tip summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.tip ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }

/* ---------- plan ---------- */
.phase-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.phase-h h2 { font-size: 21px; }
.blk { display: flex; flex-direction: column; gap: 8px; }
.blk-h { font-weight: 600; font-size: 15px; margin-top: 4px; }
.blk-g { font-size: 13.5px; color: var(--ink-soft); max-width: 66ch; margin: 0 0 4px; }
.prow {
  display: grid; grid-template-columns: 12px 42px 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-decoration: none;
}
.prow:hover { border-color: var(--border-strong); }
.prow .sid { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 13px; color: var(--ink-faint); }
.prow .pt { font-weight: 500; }
.prow .pd { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-faint); white-space: nowrap; }
.tag.ok { color: var(--good); border-color: var(--good-border); background: var(--good-soft); }
.tag.star { color: var(--accent); border-color: var(--accent-soft-border); background: var(--accent-soft); }

/* ---------- session ---------- */
.crumb { font-size: 13px; color: var(--ink-faint); }
.crumb a { color: inherit; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; position: sticky; top: var(--topH, 55px); z-index: 10; background: var(--bg); padding-top: 4px; }
.tab {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent;
  margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; font-size: 14px;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab .tc { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--sunken); color: var(--ink-faint); }
.tab .tc.full { background: var(--good-soft); color: var(--good); }

.parts { display: flex; flex-direction: column; gap: 10px; }
.part { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.part.open { box-shadow: var(--shadow); border-color: var(--border-strong); }
.part-h { width: 100%; border: 0; background: none; padding: 14px 18px; display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; cursor: pointer; text-align: left; }
.part-h .pn { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border-strong); color: var(--ink-faint); }
.part.read .pn { background: var(--good); border-color: var(--good); color: #fff; }
.part-h .ptl { font-weight: 600; font-size: 15.5px; }
.part-h .chev { color: var(--ink-faint); transition: transform .2s; }
.part.open .chev { transform: rotate(90deg); }
.part-b { padding: 0 22px 20px 56px; font-size: 15.5px; line-height: 1.7; }
.part-b p { margin: 0 0 12px; max-width: 64ch; }
.part-f { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.rule { border: 1px solid var(--accent-soft-border); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 12px 0; line-height: 1.8; }
.steps { margin: 8px 0 12px; padding-left: 22px; display: grid; gap: 6px; }
.steps li { padding-left: 4px; }
.steps li::marker { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); }
.tbl-wrap { overflow-x: auto; margin: 10px 0 14px; border: 1px solid var(--border); border-radius: 10px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-weight: 600; background: var(--surface-2); }
.tbl th, .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }

/* ---------- problems ---------- */
.prob-nav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.pdots { display: flex; gap: 6px; flex-wrap: wrap; }
.pdot { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer; font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.pdot.cur { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.pdot.correct { background: var(--good); border-color: var(--good); color: #fff; }
.pdot.almost { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.pdot.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.prob { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); transition: border-color .25s; }
.prob.correct { border-color: var(--good); }
.prob.almost { border-color: var(--warn); }
.prob.wrong { border-color: var(--bad-border); }
.prob-q { display: flex; gap: 12px; align-items: baseline; font-size: 17px; line-height: 1.9; }
.prob-q .qn { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-faint); font-weight: 600; flex: none; }
.ans-row { display: flex; gap: 8px; }
.ans, .calc-in {
  flex: 1; min-width: 0; font-family: "IBM Plex Mono", monospace; font-size: 16px; padding: 10px 12px; border-radius: 9px;
  border: 1.5px solid var(--border-strong); background: var(--surface-2); color: var(--ink);
}
.ans:focus, .calc-in:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.pv { min-height: 26px; font-size: 14px; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv .m { color: var(--ink); font-size: 1.15em; }
.pv.err { color: var(--warn); }
.fb { border-radius: 9px; padding: 10px 14px; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; }
.fb.correct { background: var(--good-soft); color: var(--good); border: 1px solid var(--good-border); }
.fb.almost { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-border); }
.fb.wrong, .fb.error { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
.fb b { font-weight: 600; }
.fb .fbm { color: var(--ink); }
.prob-tools { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.reveal { background: var(--surface-2); border: 1px dashed var(--border-strong); border-radius: 9px; padding: 10px 14px; font-size: 14.5px; }
.reveal .steps { margin: 4px 0; }
.howto { font-size: 13.5px; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.howto summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.howto table { margin-top: 8px; border-collapse: collapse; }
.howto td { padding: 3px 14px 3px 0; }
.howto code { font-family: "IBM Plex Mono", monospace; background: var(--sunken); padding: 1px 6px; border-radius: 5px; color: var(--ink); }
.pop { animation: pop .45s ease; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.012); } 100% { transform: scale(1); } }

/* flashcards */
.flash { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.fcard {
  min-height: 190px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 26px; cursor: pointer; padding: 24px; text-align: center;
}
.fcard .side-lbl { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.fcard.back { background: var(--surface-2); border-color: var(--accent-soft-border); }

/* quiz */
.qbar { position: sticky; top: calc(var(--topH, 55px) + 50px); z-index: 9; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); }
.qbar .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); }
.qbar .tm { font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.qbar.low { background: var(--bad); color: #fff; }
.score { font-family: "IBM Plex Mono", monospace; font-size: 40px; font-weight: 600; }

/* notes, resources */
.res { display: grid; gap: 8px; }
.res a { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-decoration: none; }
.res a:hover { border-color: var(--accent-soft-border); background: var(--accent-soft); }
.res a span:last-child { color: var(--ink-faint); }
textarea.notes { width: 100%; min-height: 140px; resize: vertical; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--ink); padding: 12px 14px; font: inherit; line-height: 1.6; }
textarea.notes:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 18px; }
.done-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--good-soft); border: 1px solid var(--good-border); color: var(--good); border-radius: 12px; padding: 14px 18px; }
.done-banner b { color: var(--ink); }
.empty { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 22px; text-align: center; color: var(--ink-soft); background: var(--surface-2); }

/* mistakes */
.mist { display: flex; flex-direction: column; gap: 10px; }
.mrow { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: grid; gap: 8px; }
.mrow.res-ok { opacity: .62; }
.mrow-h { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.mq { font-size: 16px; line-height: 1.9; }
.mcmp { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; align-items: baseline; }
.mcmp .l { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--ink); color: var(--bg); }

input[type="checkbox"].ck { appearance: none; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer; position: relative; margin: 0; flex: none; }
input[type="checkbox"].ck:checked { background: var(--good); border-color: var(--good); }
input[type="checkbox"].ck:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(40deg); }

.calc { position: fixed; right: 16px; bottom: 16px; width: min(380px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; z-index: 45; }
.calc-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.calc input { width: 100%; box-sizing: border-box; margin-top: 8px; }
.calc-lims { gap: 8px; flex-wrap: nowrap; }
.calc-lims input { flex: 1; min-width: 0; }
.calc-note { margin: 6px 0 0; font-size: 13px; }
.calc-from { margin-top: 10px; }
.calc-out { margin-top: 10px; font-size: 15px; line-height: 1.5; }
.calc-plot svg { display: block; width: 100%; height: auto; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 50; transition: all .25s; pointer-events: none; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 40; left: 0; top: 0; width: 300px; max-width: 86vw; transform: translateX(-102%); transition: transform .22s; box-shadow: var(--shadow); }
  .app.nav-open .side { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 35; }
  .icon-btn.menu-btn { display: inline-flex; }
  .timer [data-act="timer-len"], .timer .sep:first-of-type { display: none; }
  .top { gap: 8px; }
  .top { padding: 10px 16px; }
  .page { padding: 22px 16px 100px; }
  .part-b { padding: 0 16px 18px 16px; }
  .week { grid-template-columns: repeat(7, minmax(40px, 1fr)); overflow-x: auto; }
  .prow { grid-template-columns: 12px 30px 1fr auto; }
  .prow .tag { display: none; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.ulist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.urow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.urow .bar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--sunken); overflow: hidden; }
.urow .bar span { display: block; height: 100%; background: var(--good); border-radius: 4px; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.choice { text-align: left; padding: 11px 14px; border-radius: 9px; border: 1.5px solid var(--border-strong); background: var(--surface-2); cursor: pointer; font-size: 15px; line-height: 1.5; }
.choice:hover { border-color: var(--accent); background: var(--surface); }
.choice.sel { border-color: var(--accent); background: var(--accent-soft); }
.choice.sel.correct { border-color: var(--good); background: var(--good-soft); }
.choice.sel.wrong { border-color: var(--bad); background: var(--bad-soft); }

.chip.ok { background: var(--good-soft); border-color: var(--good-border); color: var(--good); cursor: pointer; }
button.chip { font: inherit; font-size: 13px; cursor: pointer; }

.scratch-wrap { display: flex; flex-direction: column; gap: 8px; }
.scratch-toggle { align-self: flex-start; }
.scratch { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.scr-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--surface); }
.scr-tools .seg button { padding: 5px 10px; }
.scr-canvas { width: 100%; }
.scr-canvas canvas { display: block; touch-action: none; cursor: crosshair; background: var(--surface-2); }
.scr-fb { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; color: var(--ink-soft); background: var(--surface); }
.scr-fb.done { color: var(--ink); }

/* exams */
.dl-wrap { display: inline-flex; gap: 8px; align-items: center; min-width: 0; }
.exam-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent-soft-border); font-size: 14px; }
.exam-row.soon { background: var(--warn-soft); border-color: var(--warn-border); }
.exam-row .exam-a { display: inline-flex; gap: 10px; align-items: baseline; }
.exam-row a { color: var(--accent); font-weight: 600; text-decoration: none; }
.exam-row a:hover { text-decoration: underline; }
.wds.exam { background: var(--accent); color: var(--accent-ink); }
.hw-list .hw-links { display: inline-flex; gap: 10px; }
ul.wamap { margin: 0 0 10px; padding-left: 20px; line-height: 1.7; }
@media (max-width: 700px) { .hw-list .hw-links a[title="Open on Canvas"] { display: none; } }

/* a problem's pad as the Scratch Pad app in a frame (web build) */
.scratch.scratch-embed { border: 0; background: none; overflow: visible; border-radius: 0; }
.scr-frame { display: block; width: 100%; height: 560px; border: 0; background: transparent; color-scheme: normal; }

/* web build: a newer version was published while the app was open (src/web/update.js) */
.update-btn { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px; max-width: calc(100% - 32px); padding: 10px 12px 10px 18px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); cursor: pointer; }
.update-btn b { background: var(--accent); color: var(--accent-ink); padding: 6px 12px; border-radius: 7px; font-weight: 600; }

<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Sessions"></aside>
  <div class="scrim" data-act="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="menu" aria-label="Open session list"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <a id="deadline" class="chip" href="#/plan"></a>
      <span class="spacer"></span>
      <button id="fileChip" class="chip" data-act="file-chip" hidden></button>
      <div class="timer" id="timer"></div>
      <button class="icon-btn" id="calcBtn" aria-label="Calculator" title="Calculator"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Switch theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="embedded-state" type="application/json">null</script>
<script>
/* ===== Math engine: parse, pretty-print, evaluate, compare ===== */
var MathEngine = (function () {
  var NAMES = ["arcsin", "arccos", "arctan", "sqrt", "cbrt", "sin", "cos", "tan", "sec", "csc", "cot", "exp", "abs", "log", "ln", "pi", "e", "x", "c"];
  var FNS = { arcsin: 1, arccos: 1, arctan: 1, sqrt: 1, cbrt: 1, sin: 1, cos: 1, tan: 1, sec: 1, csc: 1, cot: 1, exp: 1, abs: 1, log: 1, ln: 1 };

  function normalize(s) {
    return String(s)
      .replace(/[−–—]/g, "-")
      .replace(/[×·⋅∙]/g, "*")
      .replace(/÷/g, "/")
      .replace(/π/g, "pi")
      .replace(/√/g, "sqrt")
      .replace(/∛/g, "cbrt")
      .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, function (m) { return "^(" + m.split("").map(function (ch) { return ch === "⁻" ? "-" : "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(ch); }).join("") + ")"; })
      .replace(/\*\*/g, "^")
      .replace(/[\[{]/g, "(").replace(/[\]}]/g, ")")
      .replace(/\s*d\s*x\s*$/i, "");
  }

  function tokenize(src, sym) {
    var s = normalize(src), out = [], i = 0;
    while (i < s.length) {
      var c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        var m = /^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));
        if (!m) throw new Error('Check the number near "' + s.slice(i, i + 4) + '"');
        out.push({ k: "num", v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if (/[a-zA-Z]/.test(c)) {
        var run = /^[a-zA-Z]+/.exec(s.slice(i))[0];
        var low = run.toLowerCase(), j = 0;
        while (j < low.length) {
          var hit = null;
          for (var n = 0; n < NAMES.length; n++) {
            if (low.substr(j, NAMES[n].length) === NAMES[n]) { if (!hit || NAMES[n].length > hit.length) hit = NAMES[n]; }
          }
          if (!hit && sym) { out.push({ k: "sym", v: run[j] }); j++; continue; }
          if (!hit) throw new Error('I don’t recognize "' + run + '". Use x as the variable.');
          if (FNS[hit]) out.push({ k: "fn", v: hit });
          else if (hit === "x") out.push({ k: "x" });
          else if (hit === "c") out.push({ k: "C" });
          else out.push({ k: "const", v: hit });
          j += hit.length;
        }
        i += run.length; continue;
      }
      if ("+-*/^()|_".indexOf(c) >= 0) { out.push({ k: "op", v: c }); i++; continue; }
      if (c === "'") throw new Error("Type the answer itself, not f′(x).");
      if (c === "=") throw new Error("Leave out the “y =” part and type only the right side.");
      throw new Error('Unexpected "' + c + '"');
    }
    return out;
  }

  function parse(src, opts) {
    if (!String(src).trim()) throw new Error("Type an answer first.");
    var t = tokenize(src, opts && opts.sym), p = 0;
    if (!t.length) throw new Error("Type an answer first.");
    function peek() { return t[p]; }
    function isOp(v) { var x = t[p]; return x && x.k === "op" && x.v === v; }
    function expect(v) {
      if (!isOp(v)) throw new Error(v === ")" ? "A closing parenthesis is missing." : 'Expected "' + v + '"');
      p++;
    }
    function startsPrimary(x) {
      return x && (x.k === "num" || x.k === "x" || x.k === "const" || x.k === "C" || x.k === "fn" || x.k === "sym" || (x.k === "op" && x.v === "("));
    }
    function expr() {
      var n = term();
      while (isOp("+") || isOp("-")) { var op = t[p++].v; n = { t: "bin", op: op, a: n, b: term() }; }
      return n;
    }
    function term() {
      var n = unary();
      for (;;) {
        if (isOp("*") || isOp("/")) { var op = t[p++].v; n = { t: "bin", op: op, a: n, b: unary() }; }
        else if (startsPrimary(peek())) { n = { t: "bin", op: "*", a: n, b: power(), imp: true }; }
        else break;
      }
      return n;
    }
    function unary() {
      if (isOp("-")) { p++; return { t: "neg", a: unary() }; }
      if (isOp("+")) { p++; return unary(); }
      return power();
    }
    function power() {
      var b = primary();
      if (isOp("^")) { p++; return { t: "bin", op: "^", a: b, b: unary() }; }
      return b;
    }
    function primary() {
      var x = t[p++];
      if (!x) throw new Error("The answer ends too early. Is something missing?");
      if (x.k === "num") return { t: "num", v: x.v };
      if (x.k === "x") return { t: "x" };
      if (x.k === "C") return { t: "C" };
      if (x.k === "const") return { t: "const", v: x.v };
      if (x.k === "sym") {
        if ("fghFG".indexOf(x.v) >= 0 && isOp("(")) { p++; var sa = expr(); expect(")"); return { t: "fn", name: x.v, sym: true, a: sa }; }
        return { t: "sym", v: x.v };
      }
      if (x.k === "op" && x.v === "(") { var e = expr(); expect(")"); return e; }
      if (x.k === "op" && x.v === "|") { var a = expr(); expect("|"); return { t: "fn", name: "abs", a: a }; }
      if (x.k === "fn") {
        var pw = null, base = null;
        if (x.v === "log" && isOp("_")) { p++; base = primary(); }
        if (isOp("^")) { p++; pw = unary(); }
        var arg;
        if (isOp("(")) { p++; arg = expr(); expect(")"); }
        else if (isOp("|")) { arg = primary(); }
        else if (!peek()) throw new Error(x.v + " needs something after it, like " + x.v + "(x).");
        else arg = power();
        var node = { t: "fn", name: x.v, a: arg };
        if (base) node.base = base;
        return pw ? { t: "bin", op: "^", a: node, b: pw } : node;
      }
      throw new Error('Unexpected "' + (x.v || x.k) + '"');
    }
    var root = expr();
    if (p < t.length) {
      var bad = t[p];
      if (bad.k === "op" && bad.v === ")") throw new Error("There’s an extra closing parenthesis.");
      throw new Error('Unexpected "' + (bad.v || bad.k) + '"');
    }
    return root;
  }

  function ev(n, x, C) {
    switch (n.t) {
      case "num": return n.v;
      case "x": return x;
      case "C": return C;
      case "sym": return NaN;
      case "const": return n.v === "pi" ? Math.PI : Math.E;
      case "neg": return -ev(n.a, x, C);
      case "bin":
        var a = ev(n.a, x, C), b = ev(n.b, x, C);
        if (n.op === "+") return a + b;
        if (n.op === "-") return a - b;
        if (n.op === "*") return a * b;
        if (n.op === "/") return a / b;
        if (a < 0 && Math.abs(b) < 1 && !Number.isInteger(b)) {
          for (var d = 1; d <= 9; d += 2) { var nu = b * d; if (Math.abs(nu - Math.round(nu)) < 1e-9) { var r = Math.pow(-a, b); return Math.round(nu) % 2 ? -r : r; } }
        }
        return Math.pow(a, b);
      case "fn":
        var v = ev(n.a, x, C);
        switch (n.name) {
          case "sin": return Math.sin(v); case "cos": return Math.cos(v); case "tan": return Math.tan(v);
          case "sec": return 1 / Math.cos(v); case "csc": return 1 / Math.sin(v); case "cot": return Math.cos(v) / Math.sin(v);
          case "exp": return Math.exp(v); case "ln": return Math.log(v);
          case "log": return n.base ? Math.log(v) / Math.log(ev(n.base, x, C)) : Math.log10(v);
          case "sqrt": return Math.sqrt(v); case "cbrt": return Math.cbrt(v); case "abs": return Math.abs(v);
          case "arcsin": return Math.asin(v); case "arccos": return Math.acos(v); case "arctan": return Math.atan(v);
        }
    }
    return NaN;
  }

  /* ---------- pretty printing ---------- */
  function fmtNum(v) {
    if (Number.isInteger(v)) return String(v);
    return String(parseFloat(v.toPrecision(6)));
  }
  function startsWithNum(n) {
    if (n.t === "num" || n.t === "neg") return true;
    if (n.t === "bin") return n.op === "/" ? true : startsWithNum(n.a);
    return false;
  }
  function wrap(r, minP) { return r.p < minP ? "(" + r.h + ")" : r.h; }
  function P(n, inl) {
    switch (n.t) {
      case "num": return { h: fmtNum(n.v), p: 4 };
      case "x": return { h: "<i>x</i>", p: 4 };
      case "C": return { h: "<i>C</i>", p: 4 };
      case "sym": return { h: "<i>" + n.v + "</i>", p: 4 };
      case "const": return { h: n.v === "pi" ? "π" : "<i>e</i>", p: 4 };
      case "neg": return { h: "−" + wrap(P(n.a, inl), 2.5), p: 2.5 };
      case "bin":
        if (n.op === "+") {
          var A = P(n.a, inl);
          if (n.b.t === "neg") return { h: A.h + " − " + wrap(P(n.b.a, inl), 2), p: 1 };
          return { h: A.h + " + " + P(n.b, inl).h, p: 1 };
        }
        if (n.op === "-") return { h: P(n.a, inl).h + " − " + wrap(P(n.b, inl), 1.5), p: 1 };
        if (n.op === "*") {
          var a = P(n.a, inl), b = P(n.b, inl);
          var wa = wrap(a, 2), wb = n.b.t === "neg" ? "(" + b.h + ")" : wrap(b, 2.01);
          if (!startsWithNum(n.b)) return { h: wa + (n.b.t === "fn" || (n.b.t === "bin" && n.b.op === "^" && n.b.a.t === "fn") ? "&thinsp;" : "") + wb, p: 2 };

    { t: "Exponent rules", h: tbl(["Rule", "Example"], [['<span class="m"><i>x</i><sup><i>a</i></sup><i>x</i><sup><i>b</i></sup> = <i>x</i><sup><i>a</i>+<i>b</i></sup></span>', M("x^2 x^5") + " = " + M("x^7")], ['<span class="m"><i>x</i><sup><i>a</i></sup>/<i>x</i><sup><i>b</i></sup> = <i>x</i><sup><i>a</i>−<i>b</i></sup></span>', M("x^7/x^3") + " = " + M("x^4")], ['<span class="m">(<i>x</i><sup><i>a</i></sup>)<sup><i>b</i></sup> = <i>x</i><sup><i>ab</i></sup></span>', M("(x^4)^3") + " = " + M("x^12")], ['<span class="m"><i>x</i><sup>−<i>n</i></sup> = 1/<i>x</i><sup><i>n</i></sup></span>', M("x^(-2)") + " = " + M("1/x^2")], ['<span class="m"><i>x</i><sup><i>m</i>/<i>n</i></sup> = (<sup><i>n</i></sup>√<i>x</i>)<sup><i>m</i></sup></span>', M("8^(2/3)") + " = " + M("(cbrt(8))^2") + " = 4"]]) + rule("For fractional exponents, take the root first (it keeps numbers small), then the power.") },
    { t: "Simplifying radicals", h: "<p>Pull out the largest perfect square factor:</p>" + steps([M("sqrt(50)") + " = " + M("sqrt(25)") + "·" + M("sqrt(2)") + " = " + M("5sqrt(2)"), M("sqrt(12)") + " = " + M("sqrt(4)") + "·" + M("sqrt(3)") + " = " + M("2sqrt(3)")]) + "<p><b>Rationalize</b> (no root left on the bottom): multiply top and bottom by the root.</p>" + steps([M("6/sqrt(3)") + " × " + M("sqrt(3)/sqrt(3)") + " = " + M("6sqrt(3)/3") + " = " + M("2sqrt(3)")]) }
  ],
  probs: [
    { k: "txt", text: "Simplify " + M("2/3 - 1/4") + ".", type: "number", bare: true, ans: "5/12", hint: "Common bottom: 12.", sol: [M("8/12 - 3/12") + " = " + M("5/12")] },
    { k: "txt", text: "Simplify " + M("(x^4)^3/x^5") + " to one power of x.", type: "expr", onePower: true, ans: "x^7", hint: "Power of a power multiplies. Dividing subtracts.", sol: [M("x^12/x^5") + " = " + M("x^7")] },
    { k: "txt", text: "Evaluate " + M("8^(2/3)") + ".", type: "number", bare: true, ans: "4", hint: "Cube root of 8 first.", sol: [M("cbrt(8)") + " = 2", "2² = 4"] },
    { k: "txt", text: "Simplify " + M("sqrt(50)") + ". Type it like 3sqrt(2).", type: "number", must: ["sqrt", "Leave it in exact radical form, like 3sqrt(2)."], mustNot: ["sqrt\\(50\\)|\\d\\.\\d", "Pull the perfect square out of the root."], ans: "5sqrt(2)", hint: "50 = 25 × 2.", sol: [M("sqrt(25)sqrt(2)") + " = " + M("5sqrt(2)")] },
    { k: "txt", text: "Rationalize " + M("6/sqrt(3)") + ".", type: "number", must: ["sqrt", "Leave it in exact radical form."], mustNot: ["\\/|\\d\\.\\d", "Rationalize so there’s no root (or fraction) left on the bottom."], ans: "2sqrt(3)", hint: "Multiply top and bottom by " + M("sqrt(3)") + ".", sol: [M("6sqrt(3)/3") + " = " + M("2sqrt(3)")] },
    { k: "txt", text: "Write " + M("x^(1/2) x^(1/3)") + " as one power of x.", type: "expr", onePower: true, ans: "x^(5/6)", hint: "Add the exponents: 1/2 + 1/3.", sol: ["3/6 + 2/6 = 5/6"] }
  ]
},
{ id: "P2", block: "1", title: "Factoring & rational expressions", test: "Problem set", mins: "~45 min", star: true,
  topics: ["GCF, trinomials, special products", "Simplifying and combining rational expressions"],
  links: [["Paul: Factoring", PA + "Factoring.aspx"], ["Paul: Rational Expressions", PA + "RationalExpressions.aspx"], ["Paul: Polynomials", PA + "Polynomials.aspx"]],
  parts: [
    { t: "The factoring checklist", h: steps(["<b>Common factor first:</b> " + M("3x^2 + 6x") + " = " + M("3x(x + 2)"), "<b>Two terms?</b> Difference of squares " + M("a^2 - b^2") + " = " + M("(a - b)(a + b)") + ", or cubes: " + M("a^3 - b^3") + " = " + M("(a - b)(a^2 + ab + b^2)"), "<b>Three terms with " + M("x^2") + ":</b> two numbers that multiply to c and add to b. " + M("x^2 + 7x + 12") + " = " + M("(x + 3)(x + 4)"), "<b>Leading number isn’t 1?</b> Use the ac method (next part)."]) },
    { t: "The ac method", h: "<p>" + M("2x^2 + 7x + 3") + "</p>" + steps(["a·c = 2·3 = 6. Find two numbers that multiply to 6 and add to 7: <b>6 and 1</b>.", "Split the middle: " + M("2x^2 + 6x + x + 3"), "Group: " + M("2x(x + 3) + 1(x + 3)"), "= " + M("(2x + 1)(x + 3)")]) },
    { t: "Rational expressions", h: steps(["<b>Simplify:</b> factor top and bottom, cancel common factors. " + M("(x^2 + 5x + 6)/(x + 2)") + " = " + M("(x + 2)(x + 3)/(x + 2)") + " = " + M("x + 3"), "<b>Add:</b> common denominator, then combine tops. " + M("1/x + 2/(x + 1)") + " = " + M("(x + 1)/(x(x + 1)) + 2x/(x(x + 1))") + " = " + M("(3x + 1)/(x(x + 1))")]) + rule("Cancel factors, never terms: " + M("(x + 3)/3") + " is not " + M("x") + ".") }
  ],
  probs: [
    { k: "txt", text: "Factor " + M("x^2 + 7x + 12") + ".", type: "expr", must: PRODUCT, ans: "(x + 3)(x + 4)", hint: "Multiply to 12, add to 7.", sol: [M("(x + 3)(x + 4)")] },
    { k: "txt", text: "Factor " + M("2x^2 + 7x + 3") + ".", type: "expr", must: PRODUCT, ans: "(2x + 1)(x + 3)", hint: "ac = 6. Which pair adds to 7?", sol: ["6 and 1", M("2x^2 + 6x + x + 3"), M("(2x + 1)(x + 3)")] },
    { k: "txt", text: "Factor " + M("x^2 - 25") + ".", type: "expr", must: PRODUCT, ans: "(x - 5)(x + 5)", hint: "Difference of squares.", sol: [M("(x - 5)(x + 5)")] },
    { k: "txt", text: "Factor " + M("x^3 - 8") + ".", type: "expr", must: PRODUCT, ans: "(x - 2)(x^2 + 2x + 4)", hint: "Difference of cubes with a = x, b = 2.", sol: [M("(x - 2)(x^2 + 2x + 4)")] },
    { k: "txt", text: "Simplify " + M("(x^2 + 5x + 6)/(x + 2)") + ".", type: "expr", mustNot: NOFRAC, ans: "x + 3", hint: "Factor the top.", sol: [M("(x + 2)(x + 3)/(x + 2)"), M("x + 3")] },
    { k: "txt", text: "Combine " + M("1/x + 2/(x + 1)") + " into one fraction.", type: "expr", mustNot: ONEFRAC, ans: "(3x + 1)/(x(x + 1))", hint: "Common denominator: x(x + 1).", sol: [M("(x + 1 + 2x)/(x(x + 1))"), M("(3x + 1)/(x(x + 1))")] }
  ]
},
{ id: "P3", block: "1", title: "Equations & inequalities", test: "Problem set", mins: "~45 min",
  topics: ["Linear and quadratic equations", "Radical and absolute value equations", "Linear and quadratic inequalities"],
  links: [["Paul: Quadratic Equations I", PA + "SolveQuadraticEqnsI.aspx"], ["Paul: Quadratic Equations II", PA + "SolveQuadraticEqnsII.aspx"], ["Paul: Radical Equations", PA + "SolveRadicalEqns.aspx"], ["Paul: Absolute Value Equations", PA + "SolveAbsValueEqns.aspx"], ["Paul: Polynomial Inequalities", PA + "SolvePolyInequalities.aspx"]],
  parts: [
    { t: "Quadratic equations", h: steps(["Get everything on one side, = 0.", "Try factoring. " + M("x^2 - 4x - 5") + " = " + M("(x - 5)(x + 1)") + " → x = 5, −1", "Won’t factor? Quadratic formula: " + '<span class="m"><i>x</i> = <span class="frac"><span>−<i>b</i> ± √<span class="ov"><i>b</i><sup>2</sup> − 4<i>ac</i></span></span><span>2<i>a</i></span></span></span>']) + "<p>Example: " + M("x^2 + 2x - 1") + " = 0 → " + '<span class="m"><i>x</i> = (−2 ± √8)/2 = −1 ± √2</span>' + "</p>" },
    { t: "Radical and absolute value equations", h: "<p><b>Radical:</b> isolate the root, square both sides, solve, then <b>check every answer</b>. Squaring can create fake (extraneous) solutions.</p>" + steps([M("sqrt(x + 7)") + " = x + 1", "Square: x + 7 = " + M("x^2 + 2x + 1"), M("x^2 + x - 6") + " = 0 → x = 2 or x = −3", "Check x = −3: " + M("sqrt(4)") + " = 2 but −3 + 1 = −2. Reject. Answer: x = 2"]) + "<p><b>Absolute value:</b> |stuff| = 7 means stuff = 7 <b>or</b> stuff = −7. Solve both.</p>" },
    { t: "Inequalities", h: steps(["<b>Linear:</b> solve like an equation, but <b>flip the sign when you multiply or divide by a negative</b>. −2x + 3 > 11 → −2x > 8 → x < −4", "<b>Quadratic:</b> find where it equals 0, then test a point in each interval. " + M("x^2 - x - 12") + " < 0: zeros at −3 and 4. Test 0: −12 < 0 ✓, so the answer is −3 < x < 4."]) }
  ],
  probs: [
    { k: "txt", text: "Solve 3(x − 2) = 2x + 5.", type: "set", ans: "11", hint: "Distribute first.", sol: ["3x − 6 = 2x + 5", "x = 11"] },
    { k: "txt", text: "Solve " + M("x^2 - 4x - 5") + " = 0. Type all solutions, separated by commas.", type: "set", ans: "-1, 5", hint: "Multiply to −5, add to −4.", sol: [M("(x - 5)(x + 1)"), "x = 5, −1"] },
    { k: "txt", text: "Solve " + M("x^2 + 2x - 1") + " = 0. Exact answers, like -1+sqrt(2).", type: "set", ans: "-1 + sqrt(2), -1 - sqrt(2)", hint: "Quadratic formula with a = 1, b = 2, c = −1.", sol: ["(−2 ± √8)/2", "−1 ± √2"] },
    { k: "txt", text: "Solve |2x − 1| = 7.", type: "set", ans: "4, -3", hint: "2x − 1 = 7 or 2x − 1 = −7.", sol: ["2x = 8 → x = 4", "2x = −6 → x = −3"] },
    { k: "txt", text: "Solve " + M("sqrt(x + 7)") + " = x + 1.", type: "set", ans: "2", hint: "Square both sides, then check both answers.", sol: [M("x^2 + x - 6") + " = 0 → 2, −3", "−3 fails the check. Only x = 2."] },
    { k: "txt", text: "Solve −2x + 3 > 11. The answer has the form x < a. What is a?", type: "number", bare: true, ans: "-4", hint: "Dividing by −2 flips the sign.", sol: ["−2x > 8", "x < −4"] },
    { k: "txt", text: "Solve " + M("x^2 - x - 12") + " < 0. The answer is a < x < b. Type a, b.", type: "set", ans: "-3, 4", hint: "Find the zeros, then test a point between them.", sol: [M("(x - 4)(x + 3)"), "Between −3 and 4 it’s negative."] }
  ]
},

{ id: "P4", block: "2", title: "Functions, domain & rates of change", test: "Problem set", mins: "~40 min",
  topics: ["Function notation and piecewise functions", "Finding the domain", "Average rate of change and the difference quotient"],
  links: [["Paul: Function Definition", PA + "FunctionDefn.aspx"], ["Paul: Graphing Functions", PA + "GraphFunctions.aspx"], ["Khan: Precalculus", KA_PRE]],
  parts: [
    { t: "Notation and piecewise functions", h: "<p>" + '<span class="m"><i>f</i>(−1)</span>' + " means plug in −1 everywhere x appears. Use parentheses.</p><p>A <b>piecewise</b> function uses different rules on different intervals. Find which interval your input is in, then use that rule.</p><p>" + pw([M("x^2") + ", &nbsp;x < 1", M("2x + 3") + ", &nbsp;x ≥ 1"]) + " &nbsp;→&nbsp; f(1) uses the second rule: 5.</p>" },
    { t: "Domain: what’s allowed in", h: tbl(["Watch for", "Rule", "Example"], [["Fractions", "Bottom ≠ 0", M("1/(x^2 - 9)") + ": x ≠ ±3"], ["Even roots", "Inside ≥ 0", M("sqrt(x - 4)") + ": x ≥ 4"], ["Logs", "Inside > 0", M("ln(x + 2)") + ": x > −2"]]) + "<p>No fractions, roots or logs? The domain is all real numbers.</p>" },
    { t: "Rates of change (calculus preview)", h: "<p><b>Average rate of change</b> from a to b is the slope between the two points:</p>" + rule('<span class="m"><span class="frac"><span><i>f</i>(<i>b</i>) − <i>f</i>(<i>a</i>)</span><span><i>b</i> − <i>a</i></span></span></span>') + "<p>For " + M("x^2") + " on [1, 4]: (16 − 1)/3 = 5.</p><p>The <b>difference quotient</b> " + '<span class="m">(<i>f</i>(<i>x</i>+<i>h</i>) − <i>f</i>(<i>x</i>))/<i>h</i></span>' + " is the same idea with a tiny gap h. It’s exactly how calculus defines the derivative.</p>" }
  ],
  probs: [
    { k: "txt", text: '<span class="m"><i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> − 2<i>x</i> + 3</span>. Find <span class="m"><i>f</i>(−1)</span>.', type: "number", bare: true, ans: "6", hint: "(−1)² − 2(−1) + 3", sol: ["1 + 2 + 3 = 6"] },
    { k: "txt", text: "For " + pw([M("x^2") + ", &nbsp;x < 1", M("2x + 3") + ", &nbsp;x ≥ 1"]) + ", find f(1).", type: "number", bare: true, ans: "5", hint: "1 ≥ 1, so use the second rule.", sol: ["2(1) + 3 = 5"] },
    { k: "txt", text: "The domain of " + M("sqrt(x - 4)") + " is x ≥ a. What is a?", type: "number", bare: true, ans: "4", hint: "Inside ≥ 0.", sol: ["x − 4 ≥ 0 → x ≥ 4"] },
    { k: "txt", text: "Which x-values are excluded from the domain of " + M("1/(x^2 - 9)") + "?", type: "set", ans: "-3, 3", hint: "Set the bottom equal to 0.", sol: [M("x^2") + " = 9 → x = ±3"] },
    { k: "txt", text: "Average rate of change of " + M("x^2") + " from x = 1 to x = 4.", type: "number", bare: true, ans: "5", hint: "(f(4) − f(1))/(4 − 1)", sol: ["(16 − 1)/3 = 5"] },
    { k: "txt", text: '<span class="m"><i>f</i>(<i>x</i>) = 3<i>x</i> + 1</span>. Simplify <span class="m">(<i>f</i>(<i>x</i>+<i>h</i>) − <i>f</i>(<i>x</i>))/<i>h</i></span>.', type: "number", bare: true, ans: "3", hint: "f(x + h) = 3x + 3h + 1.", sol: ["(3x + 3h + 1 − 3x − 1)/h", "= 3h/h = 3"] }
  ]
},
{ id: "P5", block: "2", title: "Lines, graphs & transformations", test: "Problem set", mins: "~40 min",
  topics: ["Slope, point-slope and slope-intercept form", "Parallel and perpendicular lines", "Shifting, reflecting and stretching graphs"],
  links: [["Paul: Lines", PA + "Lines.aspx"], ["Paul: Transformations", PA + "Transformations.aspx"], ["Paul: Common Graphs", P1 + "CommonGraphs.aspx"]],
  parts: [
    { t: "Lines", h: steps(["<b>Slope:</b> " + '<span class="m"><i>m</i> = (<i>y</i><sub>2</sub> − <i>y</i><sub>1</sub>)/(<i>x</i><sub>2</sub> − <i>x</i><sub>1</sub>)</span>', "<b>Point-slope:</b> " + '<span class="m"><i>y</i> − <i>y</i><sub>1</sub> = <i>m</i>(<i>x</i> − <i>x</i><sub>1</sub>)</span>' + ". Fastest way to write a line from a point and a slope.", "<b>Parallel:</b> same slope. <b>Perpendicular:</b> negative reciprocal (2 → −1/2)."]) + "<p>Line through (2, 5) with slope −3: y − 5 = −3(x − 2) → y = −3x + 11.</p>" },
    { t: "Transformations", h: tbl(["Change", "Effect on the graph of f"], [[M("f(x) + k").replace("<i>f</i>&thinsp;<i>x</i>", "<i>f</i>(<i>x</i>)"), "up k"], ['<span class="m"><i>f</i>(<i>x</i> − <i>h</i>)</span>', "right h (inside moves the opposite way)"], ['<span class="m"><i>f</i>(<i>x</i> + <i>h</i>)</span>', "left h"], ['<span class="m">−<i>f</i>(<i>x</i>)</span>', "flip over the x-axis"], ['<span class="m"><i>f</i>(−<i>x</i>)</span>', "flip over the y-axis"], ['<span class="m"><i>a</i>·<i>f</i>(<i>x</i>)</span>', "vertical stretch by a"]]) + "<p>" + M("(x + 1)^2 - 7") + " is " + M("x^2") + " moved left 1 and down 7, so its vertex is (−1, −7).</p>" }
  ],
  probs: [
    { k: "txt", text: "Slope of the line through (1, 2) and (4, 11).", type: "number", bare: true, ans: "3", hint: "Rise over run.", sol: ["(11 − 2)/(4 − 1) = 9/3 = 3"] },
    { k: "txt", text: "Line through (2, 5) with slope −3. Type it as y = mx + b, just the right side.", type: "expr", ans: "-3x + 11", hint: "Point-slope, then solve for y.", sol: ["y − 5 = −3(x − 2)", "y = −3x + 11"] },
    { k: "txt", text: "Slope of a line perpendicular to y = 2x + 1.", type: "number", bare: true, ans: "-1/2", hint: "Negative reciprocal.", sol: ["−1/2"] },
    { k: "txt", text: "Shift " + M("x^2") + " right 3 and up 2. Type the new function.", type: "expr", ans: "(x - 3)^2 + 2", hint: "Right 3 means x − 3 inside.", sol: [M("(x - 3)^2 + 2")] },
    { k: "txt", text: "Shift " + M("|x|") + " left 5, then flip it over the x-axis. Type the new function.", type: "expr", ans: "-|x + 5|", hint: "Left 5: x + 5 inside. Flip: minus outside.", sol: [M("-|x + 5|")] },
    { k: "txt", text: "What is the y-coordinate of the vertex of " + M("(x + 1)^2 - 7") + "?", type: "number", bare: true, ans: "-7", hint: "Down 7.", sol: ["Vertex (−1, −7)"] }
  ]
},
{ id: "P6", block: "2", title: "Composition & inverse functions", test: "Problem set", mins: "~35 min",
  topics: ["Composing functions in the right order", "Finding and checking inverses"],
  links: [["Paul: Combining Functions", PA + "CombineFunctions.aspx"], ["Paul: Inverse Functions", PA + "InverseFunctions.aspx"]],
  parts: [
    { t: "Composition", h: "<p>" + '<span class="m">(<i>f</i> ∘ <i>g</i>)(<i>x</i>) = <i>f</i>(<i>g</i>(<i>x</i>))</span>' + ": put all of g(x) wherever f has an x. Work inside out.</p>" + steps(['<span class="m"><i>f</i>(<i>x</i>) = <i>x</i> + 2, <i>g</i>(<i>x</i>) = 3<i>x</i></span>', '<span class="m"><i>f</i>(<i>g</i>(<i>x</i>)) = 3<i>x</i> + 2</span>', '<span class="m"><i>g</i>(<i>f</i>(<i>x</i>)) = 3(<i>x</i> + 2) = 3<i>x</i> + 6</span>' + ". Order matters."]) },
    { t: "Inverses", h: "<p>The inverse undoes f. Only one-to-one functions (passing the horizontal line test) have one.</p>" + steps(["Write y = f(x).", "Swap x and y.", "Solve for y.", "Check: f(f⁻¹(x)) should simplify to x."]) + "<p>" + '<span class="m"><i>f</i>(<i>x</i>) = (<i>x</i> + 1)/(<i>x</i> − 2)</span>' + ": x = (y + 1)/(y − 2) → xy − 2x = y + 1 → y(x − 1) = 2x + 1 → " + M("(2x + 1)/(x - 1)") + "</p><p>The graph of an inverse is the original reflected over the line y = x.</p>" }
  ],
  probs: [
    { k: "txt", text: '<span class="m"><i>f</i>(<i>x</i>) = <i>x</i> + 2, <i>g</i>(<i>x</i>) = 3<i>x</i></span>. Find <span class="m"><i>f</i>(<i>g</i>(<i>x</i>))</span>.', type: "expr", ans: "3x + 2", hint: "Put 3x where f has x.", sol: ["3x + 2"] },
    { k: "txt", text: "Same functions. Find " + '<span class="m"><i>g</i>(<i>f</i>(<i>x</i>))</span>.', type: "expr", ans: "3x + 6", hint: "Put x + 2 where g has x.", sol: ["3(x + 2) = 3x + 6"] },
    { k: "txt", text: '<span class="m"><i>f</i>(<i>x</i>) = √<span class="ov"><i>x</i></span>, <i>g</i>(<i>x</i>) = <i>x</i> − 1</span>. Find <span class="m">(<i>f</i> ∘ <i>g</i>)(10)</span>.', type: "number", bare: true, ans: "3", hint: "g(10) first.", sol: ["g(10) = 9", "f(9) = 3"] },
    { k: "txt", text: "Inverse of " + '<span class="m"><i>f</i>(<i>x</i>) = 2<i>x</i> + 6</span>.', type: "expr", ans: "x/2 - 3", hint: "Swap and solve.", sol: ["x = 2y + 6", "y = (x − 6)/2 = x/2 − 3"] },
    { k: "txt", text: "Inverse of " + '<span class="m"><i>f</i>(<i>x</i>) = <i>x</i><sup>3</sup> − 1</span>. Type cube roots as cbrt( ).', type: "expr", ans: "cbrt(x + 1)", hint: "Swap, add 1, take the cube root.", sol: ["x = y³ − 1", "y = " + M("cbrt(x + 1)")] },
    { k: "txt", text: "Inverse of " + '<span class="m"><i>f</i>(<i>x</i>) = (<i>x</i> + 1)/(<i>x</i> − 2)</span>.', type: "expr", ans: "(2x + 1)/(x - 1)", hint: "After swapping, multiply both sides by (y − 2) and collect the y terms.", sol: ["xy − 2x = y + 1", "y(x − 1) = 2x + 1", M("(2x + 1)/(x - 1)")] }
  ]
},

{ id: "P7", block: "3", title: "Quadratics & polynomials", test: "Problem set", mins: "~45 min",
  topics: ["Vertex form and completing the square", "Zeros, multiplicity and end behavior", "Long and synthetic division, remainder theorem"],
  links: [["Paul: Parabolas", PA + "Parabolas.aspx"], ["Paul: Dividing Polynomials", PA + "DividingPolynomials.aspx"], ["Paul: Zeroes of Polynomials", PA + "ZeroesOfPolynomials.aspx"], ["Paul: Finding Zeroes", PA + "FindingZeroesOfPolynomials.aspx"], ["Paul: Graphing Polynomials", PA + "GraphingPolynomials.aspx"]],
  parts: [
    { t: "Completing the square", h: "<p>" + M("x^2 + 6x + 2") + "</p>" + steps(["Half of 6 is 3. 3² = 9.", "Add and subtract 9: " + M("x^2 + 6x + 9 - 9 + 2"), "= " + M("(x + 3)^2 - 7") + ". Vertex (−3, −7)."]) + "<p>Shortcut for the vertex of " + '<span class="m"><i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i></span>' + ": x = −b/(2a), then plug in for y.</p>" },
    { t: "Polynomial graphs", h: steps(["<b>End behavior</b> comes from the leading term. Even degree: both ends the same way. Odd degree: opposite ends.", "<b>Zeros:</b> factor and set each factor = 0. " + M("x^3 - 4x") + " = " + M("x(x - 2)(x + 2)") + " → 0, 2, −2", "<b>Multiplicity:</b> odd → crosses the axis; even → touches and bounces."]) },
    { t: "Division and the remainder theorem", h: "<p><b>Synthetic division</b> by (x − c): bring down, multiply by c, add, repeat.</p>" + steps([M("x^3 + 2x^2 - 5x - 6") + " ÷ (x − 2): coefficients 1, 2, −5, −6 with c = 2", "Bring down 1 → 1·2 = 2, 2 + 2 = 4 → 4·2 = 8, −5 + 8 = 3 → 3·2 = 6, −6 + 6 = 0", "Quotient " + M("x^2 + 4x + 3") + ", remainder 0"]) + rule("<b>Remainder theorem:</b> dividing by (x − c) leaves remainder f(c). If f(c) = 0, then (x − c) is a factor.") }
  ],
  probs: [
    { k: "txt", text: "Write " + M("x^2 + 6x + 2") + " in vertex form.", type: "expr", must: ["\\)\\^2", "Write it in vertex form, like (x - 2)^2 + 5."], ans: "(x + 3)^2 - 7", hint: "Half of 6, squared, is 9.", sol: [M("(x + 3)^2 - 9 + 2") + " = " + M("(x + 3)^2 - 7")] },
    { k: "txt", text: "Maximum value of " + M("-x^2 + 4x + 1") + ".", type: "number", bare: true, ans: "5", hint: "x = −b/(2a) = 2.", sol: ["−4 + 8 + 1 = 5"] },
    { k: "txt", text: "All zeros of " + M("x^3 - 4x") + ".", type: "set", ans: "0, 2, -2", hint: "Factor out x first.", sol: [M("x(x - 2)(x + 2)")] },
    { k: "txt", text: "Divide " + M("x^3 + 2x^2 - 5x - 6") + " by x − 2. Type the quotient.", type: "expr", mustNot: NOFRAC, ans: "x^2 + 4x + 3", hint: "Synthetic division with 2.", sol: ["Rows: 1, 4, 3, remainder 0", M("x^2 + 4x + 3")] },
    { k: "txt", text: "Remainder when " + M("2x^3 - 3x + 4") + " is divided by x + 1.", type: "number", bare: true, ans: "5", hint: "x + 1 = x − (−1). Plug in −1.", sol: ["−2 + 3 + 4 = 5"] },
    { k: "txt", text: "All zeros of " + M("x^3 - 6x^2 + 11x - 6") + ".", type: "set", ans: "1, 2, 3", hint: "Try x = 1. If it’s a zero, divide by (x − 1).", sol: ["f(1) = 0", "Quotient " + M("x^2 - 5x + 6") + " = " + M("(x - 2)(x - 3)")] }
  ]
},
{ id: "P8", block: "3", title: "Rational functions", test: "Problem set", mins: "~40 min",
  topics: ["Vertical asymptotes vs. holes", "Horizontal and slant asymptotes", "Intercepts"],
  links: [["Paul: Rational Functions", PA + "GraphRationalFcns.aspx"], ["Paul: Dividing Polynomials", PA + "DividingPolynomials.aspx"]],
  parts: [
    { t: "Vertical asymptotes and holes", h: steps(["Factor top and bottom.", "A factor that <b>cancels</b> gives a <b>hole</b>. " + M("(x^2 - 1)/(x - 1)") + " = x + 1 with a hole at x = 1.", "A bottom factor that <b>doesn’t cancel</b> gives a <b>vertical asymptote</b>. " + M("(x + 3)/(x^2 - 4)") + ": x = ±2."]) },
    { t: "Horizontal and slant asymptotes", h: tbl(["Compare degrees", "Horizontal asymptote"], [["Top < bottom", "y = 0"], ["Top = bottom", "y = ratio of leading coefficients"], ["Top = bottom + 1", "No HA; slant asymptote from long division"]]) + "<p>" + M("(x^2 + 3x + 1)/(x + 1)") + " = x + 2 remainder −1, so the slant asymptote is y = x + 2.</p>" }

    { k: "txt", text: "Slant asymptote of " + M("(x^2 + 3x + 1)/(x + 1)") + ": y = ?", type: "expr", mustNot: NOFRAC, ans: "x + 2", hint: "Divide; ignore the remainder.", sol: ["Quotient x + 2, remainder −1"] },
    { k: "txt", text: "x-intercepts of " + M("(x^2 - 9)/(x + 1)") + ".", type: "set", ans: "-3, 3", hint: "Where the top is 0.", sol: [M("x^2") + " = 9"] }
  ]
},

{ id: "P10", block: "4", title: "Logarithms", test: "Recall drill", mins: "~35 min", star: true,

  links: [["Paul: Logarithm Functions", PA + "LogFunctions.aspx"], ["Paul: Cheat sheets", CHEAT]],
  flash: "logs",
  parts: [
    { t: "A log is an exponent", h: rule('<span class="m">log<sub><i>b</i></sub> <i>x</i> = <i>y</i></span> &nbsp;means&nbsp; <span class="m"><i>b</i><sup><i>y</i></sup> = <i>x</i></span>') + steps([M("log_3(81)") + ": 3 to what power is 81? 4.", '<span class="m">log</span> with no base means base 10. <span class="m">ln</span> means base e.', M("ln(e^5)") + " = 5, because ln and e undo each other."]) },
    { t: "The three rules", h: tbl(["Rule", "In words"], [['<span class="m">log(<i>MN</i>) = log <i>M</i> + log <i>N</i></span>', "Multiply inside → add outside"], ['<span class="m">log(<i>M</i>/<i>N</i>) = log <i>M</i> − log <i>N</i></span>', "Divide inside → subtract"], ['<span class="m">log(<i>M</i><sup><i>p</i></sup>) = <i>p</i> log <i>M</i></span>', "Power inside → multiply in front"]]) + "<p>Condensing: " + M("2ln(x) + ln(3)") + " = " + M("ln(x^2) + ln(3)") + " = " + M("ln(3x^2)") + ".</p>" + rule("<b>Change of base:</b> " + '<span class="m">log<sub><i>b</i></sub> <i>x</i> = ln <i>x</i> / ln <i>b</i></span>') }
  ],
  probs: [

    { k: "txt", text: "Evaluate " + M("log(1000)") + ".", type: "number", bare: true, ans: "3", hint: "Base 10.", sol: ["10³ = 1000"] },
    { k: "txt", text: "Evaluate " + M("ln(e^5)") + ".", type: "number", bare: true, ans: "5", hint: "ln undoes e.", sol: ["5"] },
    { k: "txt", text: "Evaluate " + M("log_2(1/16)") + ".", type: "number", bare: true, ans: "-4", hint: "1/16 = " + M("2^(-4)") + ".", sol: ["−4"] },
    { k: "txt", text: "Write " + M("2ln(x) + ln(3)") + " as a single logarithm.", type: "expr", must: ["^ln", "Start your answer with ln( ... )."], mustNot: ["\\+|-", "Combine into one log with no + or − outside it."], ans: "ln(3x^2)", hint: "Power rule first, then the product rule.", sol: [M("ln(x^2) + ln(3)"), M("ln(3x^2)")] },
    { k: "txt", text: "Use change of base to find " + M("log_2(5)") + " to 3 decimal places.", type: "number", mustNot: ["log", "Use change of base: ln(5)/ln(2), or give the decimal."], ans: "ln(5)/ln(2)", hint: "ln 5 / ln 2", sol: ["≈ 2.322"] }
  ]
},
{ id: "P11", block: "4", title: "Exponential & log equations", test: "Problem set", mins: "~40 min",
  topics: ["Taking logs of both sides", "Condensing and exponentiating", "Checking for invalid answers"],

    { t: "Log equations", h: steps(["Condense to a single log on each side.", "Rewrite in exponential form.", "Solve.", "<b>Check:</b> the inside of every log must be positive. Throw out answers that break that."]) + "<p>" + M("log_2(x) + log_2(x - 2)") + " = 3 → " + M("log_2(x(x - 2))") + " = 3 → " + M("x^2 - 2x") + " = 8 → x = 4 or −2. Reject −2.</p>" }
  ],

    { k: "txt", text: "Solve " + M("e^(2x)") + " = 7.", type: "set", ans: "ln(7)/2", hint: "ln both sides.", sol: ["2x = ln 7"] },

    { k: "txt", text: "Solve ln(x) = 2.", type: "set", ans: "e^2", hint: "Exponentiate both sides.", sol: ["x = e²"] },
    { k: "txt", text: "Money grows at 6% compounded continuously. How many years to double? (2 decimals)", type: "number", ans: "ln(2)/0.06", hint: M("e^(0.06t)") + " = 2.", sol: ["t = ln 2 / 0.06 ≈ 11.55"] }

    { k: "txt", text: "Simplify sin²20° + cos²20°.", type: "number", bare: true, ans: "1", hint: "Pythagorean identity.", sol: ["1"] },

{ id: "2.1", block: "R2", title: "Functions", covers: "Sec 2.1", test: "Problem set", mins: "~35 min",

    V1("P4").parts[1],

  parts: [
    { t: "When and why", h: "<p>Partial fractions splits one fraction into simpler ones, undoing “add with a common denominator.” Calc 2 uses it to integrate.</p>" + steps(["Top’s degree must be <b>less</b> than the bottom’s. If not, long-divide first.", "Factor the bottom completely.", "Write one term per factor (the four cases, next).", "Multiply through by the bottom and solve for the letters."]) },
    { t: "The four cases", h: tbl(["Bottom has", "Write"], [["Case 1: distinct linear (x − a)(x − b)", y("<i>A</i>/(<i>x</i> − <i>a</i>) + <i>B</i>/(<i>x</i> − <i>b</i>)")], ["Case 2: repeated linear (x − a)²", y("<i>A</i>/(<i>x</i> − <i>a</i>) + <i>B</i>/(<i>x</i> − <i>a</i>)<sup>2</sup>")], ["Case 3: irreducible quadratic (x² + 1)", y("(<i>Ax</i> + <i>B</i>)/(<i>x</i><sup>2</sup> + 1)")], ["Case 4: repeated quadratic (x² + 1)²", y("(<i>Ax</i> + <i>B</i>)/(<i>x</i><sup>2</sup> + 1) + (<i>Cx</i> + <i>D</i>)/(<i>x</i><sup>2</sup> + 1)<sup>2</sup>")]]) },
    { t: "Worked: Case 1", h: "<p>" + M("(x + 7)/((x - 1)(x + 3))") + " = " + y("<i>A</i>/(<i>x</i> − 1) + <i>B</i>/(<i>x</i> + 3)") + "</p>" + steps(["Multiply by the bottom: x + 7 = A(x + 3) + B(x − 1)", "Plug in x = 1 (kills B): 8 = 4A → A = 2", "Plug in x = −3 (kills A): 4 = −4B → B = −1", "Answer: " + M("2/(x - 1) - 1/(x + 3)")]) + rule("Plug in the x-values that make each factor zero. It solves for one letter at a time.") },
    { t: "Worked: Case 2", h: "<p>" + M("(3x + 5)/(x + 1)^2") + " = " + y("<i>A</i>/(<i>x</i> + 1) + <i>B</i>/(<i>x</i> + 1)<sup>2</sup>") + "</p>" + steps(["3x + 5 = A(x + 1) + B", "x = −1: 2 = B", "Match the x terms: 3 = A", "Answer: " + M("3/(x + 1) + 2/(x + 1)^2")]) }
  ],
  probs: [
    { k: "txt", text: M("(x + 7)/((x - 1)(x + 3))") + " = " + y("<i>A</i>/(<i>x</i> − 1) + <i>B</i>/(<i>x</i> + 3)") + ". Type A, B.", type: "set", ordered: true, ans: "2, -1", hint: "Plug in x = 1, then x = −3.", sol: ["A = 2, B = −1"] },
    { k: "txt", text: M("1/(x(x + 1))") + " = " + y("<i>A</i>/<i>x</i> + <i>B</i>/(<i>x</i> + 1)") + ". Type A, B.", type: "set", ordered: true, ans: "1, -1", hint: "1 = A(x + 1) + Bx", sol: ["x = 0: A = 1", "x = −1: B = −1"] },
    { k: "txt", text: M("(3x + 5)/(x + 1)^2") + " = " + y("<i>A</i>/(<i>x</i> + 1) + <i>B</i>/(<i>x</i> + 1)<sup>2</sup>") + ". Type A, B.", type: "set", ordered: true, ans: "3, 2", hint: "3x + 5 = A(x + 1) + B", sol: ["A = 3, B = 2"] },
    { k: "txt", text: "Decompose " + M("2/(x^2 - 1)") + " completely.", type: "expr", must: ["\\/.*\\/", "Write it as a sum or difference of simpler fractions."], mustNot: ["\\^2", "Each denominator should be linear (no x^2)."], ans: "1/(x - 1) - 1/(x + 1)", hint: "x² − 1 = (x − 1)(x + 1).", sol: ["2 = A(x + 1) + B(x − 1)", "A = 1, B = −1"] },
    { k: "txt", text: "What’s the correct setup for " + M("2x/((x - 1)(x^2 + 1))") + "?", type: "choice", opts: [y("<i>A</i>/(<i>x</i> − 1) + <i>B</i>/(<i>x</i><sup>2</sup> + 1)"), y("<i>A</i>/(<i>x</i> − 1) + (<i>Bx</i> + <i>C</i>)/(<i>x</i><sup>2</sup> + 1)"), y("<i>A</i>/(<i>x</i> − 1) + <i>B</i>/(<i>x</i> − 1)<sup>2</sup>")], ans: 1, why: ["An irreducible quadratic needs Bx + C on top.", "", "There’s no repeated factor here."], hint: "x² + 1 doesn’t factor.", sol: ["Case 3: (Bx + C) over the quadratic"] },
    { k: "txt", text: "Before decomposing " + M("(x^3 + 1)/(x^2 - 4)") + ", what do you do first?", type: "choice", opts: ["Plug in x = 2", "Long-divide (top degree ≥ bottom degree)", "Factor the top"], ans: 1, why: ["That comes after setup.", "", "Factoring the top doesn’t help here."], hint: "Compare degrees.", sol: ["Degree 3 ≥ degree 2, so divide first."] }
  ]
},

{ id: "10.2", block: "R10", title: "The parabola", covers: "Sec 10.2", test: "Problem set", mins: "~35 min",

    { k: "txt", text: M("x^2") + " = −8y opens…", type: "choice", opts: ["up", "down", "left", "right"], ans: 1, why: ["The − on the y side flips it.", "", "x² means it opens up or down.", "x² means it opens up or down."], hint: "Which variable is squared, and the sign.", sol: ["down"] },
    { k: "txt", text: "Vertex of " + M("(y - 1)^2") + " = 8(x + 2). Type h, k.", type: "set", ordered: true, ans: "-2, 1", hint: "Flip the signs.", sol: ["(−2, 1)"] },
    { k: "txt", text: "Focus of " + M("(y - 1)^2") + " = 8(x + 2). Type x, y.", type: "set", ordered: true, ans: "0, 1", hint: "a = 2, opens right from the vertex.", sol: ["(−2 + 2, 1) = (0, 1)"] }

{ id: "10.3", block: "R10", title: "The ellipse", covers: "Sec 10.3", test: "Problem set", mins: "~35 min",
  topics: ["a, b, c and c² = a² − b²", "Vertices and foci", "Horizontal vs. vertical major axis; shifted ellipses"],
  links: [["Paul: Ellipses", PA + "Ellipses.aspx"]], flash: "conics",
  parts: [
    { t: "Standard form", h: rule(M("x^2/a^2 + y^2/b^2") + " = 1, &nbsp;with a > b: major axis horizontal") + steps(["a is the bigger denominator’s square root. It goes with the major axis.", "Vertices: (±a, 0). Foci: (±c, 0) where <b>c² = a² − b²</b>.", "If the bigger number is under y², the major axis is vertical: vertices (0, ±a), foci (0, ±c)."]) },
    { t: "Worked", h: "<p>" + M("x^2/25 + y^2/9") + " = 1</p>" + steps(["a² = 25 (under x²), so a = 5 and the major axis is horizontal.", "b² = 9, so c² = 25 − 9 = 16, c = 4.", "Vertices (±5, 0), foci (±4, 0). Major axis length 2a = 10."]) + "<p>Shifted: " + M("(x - 1)^2/9 + (y + 2)^2/4") + " = 1 has center (1, −2).</p>" }
  ],
  probs: [
    { k: "txt", text: "For " + M("x^2/25 + y^2/9") + " = 1, find c.", type: "number", bare: true, ans: "4", hint: "c² = a² − b²", sol: ["√16 = 4"] },
    { k: "txt", text: "Same ellipse. x-coordinates of the foci.", type: "set", ans: "-4, 4", hint: "(±c, 0)", sol: ["±4"] },
    { k: "txt", text: "Same ellipse. x-coordinates of the vertices.", type: "set", ans: "-5, 5", hint: "(±a, 0)", sol: ["±5"] },
    { k: "txt", text: "The major axis of " + M("x^2/16 + y^2/25") + " = 1 is…", type: "choice", opts: ["horizontal", "vertical"], ans: 1, why: ["The bigger number (25) is under y².", ""], hint: "Where’s the bigger denominator?", sol: ["vertical"] },
    { k: "txt", text: "Length of the major axis of " + M("x^2/16 + y^2/25") + " = 1.", type: "number", bare: true, ans: "10", hint: "2a", sol: ["a = 5, so 10"] },
    { k: "txt", text: "Center of " + M("(x - 1)^2/9 + (y + 2)^2/4") + " = 1. Type h, k.", type: "set", ordered: true, ans: "1, -2", hint: "Flip the signs.", sol: ["(1, −2)"] }
  ]
},
{ id: "10.4", block: "R10", title: "The hyperbola", covers: "Sec 10.4", test: "Problem set", mins: "~35 min",
  topics: ["c² = a² + b²", "Vertices, foci, asymptotes", "Which way it opens"],
  links: [["Paul: Hyperbolas", PA + "Hyperbolas.aspx"]], flash: "conics",
  parts: [
    { t: "Standard form", h: rule(M("x^2/a^2 - y^2/b^2") + " = 1 opens left/right. &nbsp;" + M("y^2/a^2 - x^2/b^2") + " = 1 opens up/down.") + steps(["a is under the <b>positive</b> term, whichever is bigger.", "Vertices are ±a along the opening direction.", "Foci are ±c, with <b>c² = a² + b²</b> (plus, unlike the ellipse).", "Asymptotes for the left/right one: y = ±(b/a)x. For up/down: y = ±(a/b)x."]) },

  probs: [
    { k: "txt", text: "For " + M("x^2/9 - y^2/16") + " = 1, find c.", type: "number", bare: true, ans: "5", hint: "c² = a² + b²", sol: ["√25 = 5"] },
    { k: "txt", text: "Same hyperbola. x-coordinates of the vertices.", type: "set", ans: "-3, 3", hint: "±a", sol: ["±3"] },
    { k: "txt", text: "Same hyperbola. Slopes of the asymptotes.", type: "set", ans: "4/3, -4/3", hint: "±b/a", sol: ["±4/3"] },
    { k: "txt", text: M("y^2/4 - x^2/9") + " = 1 opens…", type: "choice", opts: ["left and right", "up and down"], ans: 1, why: ["The positive term is y².", ""], hint: "Which term is positive?", sol: ["up and down"] },
    { k: "txt", text: "For " + M("y^2/4 - x^2/9") + " = 1, find c. Type roots like sqrt(13).", type: "number", ans: "sqrt(13)", hint: "4 + 9", sol: ["√13"] },
    { k: "txt", text: "Which conic has c² = a² + b²?", type: "choice", opts: ["ellipse", "hyperbola", "parabola"], ans: 1, why: ["The ellipse uses c² = a² − b².", "", "Parabolas don’t use a, b, c this way."], hint: "Foci are outside the vertices.", sol: ["hyperbola"] }

/* ================= Review: Ch 12 ================= */
{ id: "12.1", block: "R12", title: "Sequences", covers: "Sec 12.1", test: "Problem set", mins: "~30 min",
  topics: ["Finding terms from a formula", "Recursive sequences and factorials", "Summation notation"],
  links: [["Paul: Sequences", P2 + "Sequences.aspx"], ["Paul: Summation Notation", P1 + "SummationNotation.aspx"]], flash: "seq",
  parts: [
    { t: "Terms and formulas", h: "<p>A sequence is a list a₁, a₂, a₃, … . A formula like aₙ = 3n − 1 gives any term: a₅ = 14.</p>" + steps(["<b>Alternating signs:</b> (−1)ⁿ flips the sign each term.", "<b>Recursive:</b> each term from the one before. a₁ = 2, aₙ = 3aₙ₋₁ gives 2, 6, 18, 54.", "<b>Factorial:</b> n! = n(n − 1)⋯1. 5! = 120, and 0! = 1."]) },
    { t: "Summation notation", h: "<p>" + SIG("1", "4", "2x + 1") + " = 3 + 5 + 7 + 9 = 24</p>" + steps(["Constants pull out: Σ c·aₖ = c Σ aₖ", "Sums split: Σ(aₖ + bₖ) = Σaₖ + Σbₖ", "Σ 1 from k = 1 to n is n. Σ k is n(n + 1)/2."]) }
  ],
  probs: [
    { k: "txt", text: "aₙ = 3n − 1. Find a₅.", type: "number", bare: true, ans: "14", hint: "Plug in n = 5.", sol: ["15 − 1 = 14"] },
    { k: "txt", text: "aₙ = (−1)ⁿ n². Find a₃.", type: "number", bare: true, ans: "-9", hint: "(−1)³ = −1.", sol: ["−9"] },
    { k: "txt", text: "a₁ = 2, aₙ = 3aₙ₋₁. Find a₄.", type: "number", bare: true, ans: "54", hint: "2, 6, 18, …", sol: ["54"] },
    { k: "txt", text: "Evaluate " + SIG("1", "4", "2x + 1") + ".", type: "number", bare: true, ans: "24", hint: "Plug in k = 1 to 4 and add.", sol: ["3 + 5 + 7 + 9"] },
    { k: "txt", text: "Write a formula for the nth term of 2, 4, 6, 8, … Use n.", type: "expr", v: "n", ans: "2x", hint: "Each is 2 times its position.", sol: ["aₙ = 2n"] },
    { k: "txt", text: "Write a formula for the nth term of 1/2, 1/4, 1/8, … Use n.", type: "expr", v: "n", ans: "(1/2)^x", hint: "Powers of 1/2.", sol: ["aₙ = (1/2)ⁿ"] }
  ]
},

    { k: "txt", text: "a₁ = 5 and a₁₀ = 32. Find d.", type: "number", bare: true, ans: "3", hint: "32 = 5 + 9d", sol: ["9d = 27"] }
  ]
},
{ id: "12.3", block: "R12", title: "Geometric sequences & series", covers: "Sec 12.3", test: "Recall drill", mins: "~35 min", star: true,
  topics: ["Common ratio", "nth term and finite sums", "Infinite geometric series"],
  links: [["Paul: Special Series (geometric)", P2 + "Series_Special.aspx"], ["Paul: Series basics", P2 + "Series_Basics.aspx"]], flash: "seq",
