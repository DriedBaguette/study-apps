{ id: "H3", block: "C6", title: "The war begins and independence (1774–1778)", covers: "Sec 6.1–6.2", test: "Recall drill", mins: "~35 min", star: true, flash: "ch6",
  topics: ["Gage, Lexington and Concord, Bunker Hill", "Second Continental Congress, Dunmore’s Proclamation", "Common Sense and the Declaration of Independence", "British strategy, Trenton, Saratoga, the French alliance"],
  links: [["OpenStax 6.1: Britain’s law-and-order strategy", OS + "6-1-britains-law-and-order-strategy-and-its-consequences"], ["OpenStax 6.2: The early years of the Revolution", OS + "6-2-the-early-years-of-the-revolution"]],
  parts: [
    { t: "6.1 From protest to shooting war (1774–1775)", h: dates([["1774", "General Thomas Gage enforces the Coercive Acts in Massachusetts and tries to <b>seize colonial arms and gunpowder</b>"], ["Apr 19, 1775", "<b>Lexington and Concord</b>: first battles"], ["May 1775", "<b>Second Continental Congress</b> meets"], ["Jun 1775", "Washington named commander · <b>Bunker Hill</b>"], ["Jul 1775", "<b>Olive Branch Petition</b>; the king rejects it"], ["Nov 1775", "<b>Dunmore’s Proclamation</b>"], ["Jan 1776", "<b>Common Sense</b> published"], ["Jul 4, 1776", "<b>Declaration of Independence</b>"]]) +
      steps([
        "<b>Law and order:</b> Britain treated the colonies as rebels to be disciplined. Gage’s main tactic was to <b>seize arms and munitions</b> from colonial militias.",
        "<b>Minutemen:</b> colonial militias ready to fight on a minute’s notice.",
        "<b>Lexington and Concord (April 19, 1775):</b> British troops marched to seize weapons at Concord. Paul Revere and William Dawes rode to warn the militias. Shots at Lexington, a fight at Concord’s North Bridge, then militias picked off the British all the way back to Boston. The war had started.",
        "<b>Bunker Hill (June 1775):</b> the British won but lost over 1,000 men, which showed the Americans could fight.",
        "<b>Second Continental Congress (May 1775):</b> created the <b>Continental Army</b> with <b>George Washington</b> in command, printed <b>Continental currency</b> (paper money that lost value fast), and still sent the <b>Olive Branch Petition</b> asking the king for peace. George III refused and declared the colonies in rebellion.",
        "<b>Dunmore’s Proclamation (Nov 1775):</b> Lord Dunmore, royal governor of Virginia, promised <b>freedom to enslaved and indentured people who fought for the British</b>. Hundreds joined (the “Ethiopian Regiment”). Effect: slaveholders and non-slaveholding White colonists alike feared a slave rebellion, and many southern White people turned <b>toward independence</b>. It did <b>not</b> free most enslaved people.",
        "<b>Mecklenburg Resolves (1775):</b> North Carolina’s declaration of rebellion against Britain."]) },
    { t: "6.1 Common Sense and the Declaration (1776)", h: steps([
      "<b>Thomas Paine, <i>Common Sense</i> (January 1776):</b> attacked <b>monarchy and hereditary rule</b> as absurd, called George III a “royal brute,” said it made no sense for an island to rule a continent, and called for <b>independence and a republic</b>.",
      "<b>Why so popular:</b> plain language anyone could understand, cheap, read aloud in taverns. Over 100,000 copies sold in a few months. It moved many colonists from wanting their rights as Englishmen to wanting independence.",
      "<b>Republicanism:</b> government by elected representatives instead of a monarch; the people are sovereign (<b>popular sovereignty</b>). As a social philosophy it demanded <b>civic virtue</b>: putting the public good above self-interest.",
      "<b>Declaration of Independence (July 4, 1776):</b> written mainly by <b>Thomas Jefferson</b>. Uses John Locke’s natural-rights ideas: all men are created equal, with rights to “life, liberty and the pursuit of happiness.” Government gets its power from the <b>consent of the governed</b>, and people can overthrow a government that abuses them. Then it lists grievances against <b>King George III</b> (not Parliament).",
      "<b>Contradiction:</b> “all men are created equal” did not apply to women, enslaved Black people or Native Americans."]) },
    { t: "6.2 Early years of the war (1776–1778)", h: tbl(["", "British strategy", "American strategy"], [
        ["Plan", "Crush the rebellion fast with the world’s best army and navy; <b>capture major cities</b> (New York, Philadelphia); rely on Loyalists; hire <b>Hessians</b>", "Washington: <b>avoid big losses and keep the army alive</b>. Retreat when needed, strike when the odds are good, outlast the British"],
        ["Base", "<b>New York City</b>, the British base for most of the war", "Moved around; winter camps like Valley Forge"]]) +
      steps([
        "<b>1776, New York:</b> Washington lost the Battle of Long Island and other fights (White Plains) and retreated across New Jersey. The cause looked lost.",
        "<b>Trenton (Dec 26, 1776):</b> Washington crossed the icy Delaware River on Christmas night and surprised the <b>Hessians</b> (German mercenaries hired by Britain). Then a win at <b>Princeton</b> (Jan 1777). Small battles, huge boost to morale.",
        "<b>1777:</b> British General Howe took <b>Philadelphia</b> after beating Washington at Brandywine Creek. Meanwhile General <b>John Burgoyne</b> marched south from Canada to cut New England off from the other colonies.",
        "<b>Saratoga (October 1777): THE TURNING POINT.</b> Burgoyne surrendered his whole army in New York. It convinced <b>France</b> the Americans could win.",
        "<b>French alliance (1778):</b> Benjamin Franklin negotiated it. France sent money, troops and its navy. Spain (1779) and the Dutch also joined against Britain, making it a world war.",
        "<b>Valley Forge (winter 1777–78):</b> the army froze and starved near Philadelphia, but Prussian officer <b>Baron von Steuben</b> drilled it into a professional force. The Marquis de <b>Lafayette</b> (French) also served under Washington."]) +
      ppl([["Thomas Gage", "British general; tried to seize colonial arms; Lexington and Concord"], ["George Washington", "Commander of the Continental Army; keep the army alive"], ["Lord Dunmore", "Virginia governor; promised freedom to enslaved people who fought for Britain"], ["Thomas Paine", "<i>Common Sense</i>"], ["Thomas Jefferson", "Main author of the Declaration of Independence"], ["John Burgoyne", "British general who surrendered at Saratoga"], ["Benjamin Franklin", "Won the French alliance"], ["von Steuben / Lafayette", "Foreign officers who trained and helped the army"]]) },
    { t: "Essay questions: practice out loud", h: essays([
      ["What are the main arguments of Thomas Paine’s <i>Common Sense</i>? Why was it so popular?", "Paine argued that monarchy and hereditary rule were unnatural and corrupt, that an island shouldn’t govern a continent, that staying tied to Britain dragged America into Europe’s wars, and that America should become an independent republic. It was popular because it was written in plain, forceful language for ordinary people, was cheap and widely read aloud, and came right after fighting had started and the king had rejected the Olive Branch Petition."],
      ["Describe the British strategy in the early years of the war. Did it succeed?", "Britain planned to win quickly by using its huge army and navy to capture major cities (New York, then Philadelphia), relying on Loyalists and Hessians. It won battles and took both cities, but it failed: taking cities didn’t end the rebellion, Washington’s army survived, and Burgoyne’s plan to cut off New England ended in surrender at Saratoga, which brought France into the war."],
      ["How did George Washington’s military tactics help him succeed?", "He avoided big decisive battles he might lose and focused on keeping the Continental Army alive, retreating when necessary. He struck when the odds were good (Trenton and Princeton) to lift morale, used the winter at Valley Forge to train the army with von Steuben, and waited for the war to become too costly for Britain and for French help to arrive."],
      ["What was the effect and importance of Britain’s promise of freedom to enslaved people who joined the British side?", "Dunmore’s Proclamation (1775) led thousands of enslaved people to run to British lines over the war, seeking freedom. But it pushed White southerners, who feared slave revolts, firmly toward independence, so it strengthened the Patriot cause in the South. Some who joined the British were freed and evacuated (to Nova Scotia, later Sierra Leone), but most enslaved people stayed enslaved."],
      ["Describe the ideology of republicanism. How did it compare to the system in Great Britain?", "Republicanism holds that power comes from the people (popular sovereignty) and that states should be governed by elected representatives, not a monarch, with no hereditary ruling class. It required civic virtue: citizens putting the public good above self-interest. Britain was a constitutional monarchy: a hereditary king, a hereditary aristocracy in the House of Lords, and only the House of Commons elected, by a small share of men. Society there rested on deference to rank, while republicans claimed merit and virtue should matter instead."]]) }
  ],
  probs: [
    Q("How did British General Thomas Gage attempt to deal with the uprising in Massachusetts in 1774?", ["He offered the rebels land on the Maine frontier in return for loyalty to England.", "He allowed for town meetings in an attempt to appease the rebels.", "He attempted to seize arms and munitions from the colonial insurgents.", "He ordered his troops to burn Boston to the ground to show the determination of Britain."], 2, "Gage tried to seize colonial weapons and gunpowder; the march to Concord to do this started the war."),
    Q("Which of the following was <b>not</b> a result of Dunmore’s Proclamation?", ["Enslaved people joined Dunmore to fight for the British.", "A majority of enslaved people in the colonies won their freedom.", "Patriot forces increased their commitment to independence.", "Both slaveholding and non-slaveholding White people feared a rebellion."], 1, "Most enslaved people were not freed. The proclamation mainly pushed White southerners toward independence."),
    Q("Which of the following is <b>not</b> true of a republic?", ["A republic has no hereditary ruling class.", "A republic relies on the principle of popular sovereignty.", "Representatives chosen by the people lead the republic.", "A republic is governed by a monarch and the royal officials he or she appoints."], 3, "That describes a monarchy, the opposite of a republic."),
    Q("Where were the first battles of the Revolutionary War fought (April 19, 1775)?", ["Lexington and Concord", "Bunker Hill", "Trenton", "Yorktown"], 0, "British troops marched to seize arms at Concord; minutemen fought them at Lexington and Concord."),
    Q("Which city served as the base for British operations for most of the war?", ["Boston", "New York", "Philadelphia", "Saratoga"], 1, "Britain held New York City from 1776 until the end of the war."),
    Q("What battle turned the tide of war in favor of the Americans?", ["the Battle of Saratoga", "the Battle of Brandywine Creek", "the Battle of White Plains", "the Battle of Valley Forge"], 0, "Burgoyne’s surrender at Saratoga (1777) brought France into the war. (Valley Forge was a winter camp, not a battle.)"),
    Q("Which term describes German soldiers hired by Great Britain to put down the American rebellion?", ["Patriots", "Royalists", "Hessians", "Loyalists"], 2, "Hessians: German mercenaries. Washington beat them at Trenton."),
    Q("What was the Olive Branch Petition (1775)?", ["A last appeal to King George III for peace, which he rejected", "The treaty ending the war", "France’s offer of alliance", "A list of grievances in the Declaration of Independence"], 0, "Congress still hoped to reconcile; the king rejected it and declared the colonies in rebellion."),
    Q("Why did Thomas Paine’s <i>Common Sense</i> matter so much?", ["It persuaded many colonists to support independence and a republic in plain language", "It was the official declaration of war", "It argued for keeping the king but removing Parliament", "It was written by Jefferson for Congress"], 0, "Published January 1776, it sold over 100,000 copies and turned opinion against monarchy."),
    Q("Where does the Declaration of Independence say government gets its power?", ["From the consent of the governed", "From God through the king", "From Parliament", "From the army"], 0, "Locke’s idea: legitimate government rests on the consent of the governed."),
    Q("What was the main result of the French alliance of 1778?", ["France sent money, troops and its navy to help the Americans", "France took over Canada", "France paid Britain to end the war", "France sent Hessians"], 0, "After Saratoga, France joined the war. Its navy proved decisive at Yorktown."),
    Q("Why was the Battle of Trenton (Dec 1776) important?", ["A surprise win over Hessians that revived American morale after months of defeats", "It ended the war", "It was the first battle of the war", "It brought Spain into the war"], 0, "Washington crossed the Delaware on Christmas night; small battle, big morale boost.")
  ]
},
{ id: "H4", block: "C6", title: "War in the South, victory and who fought (1778–1783)", covers: "Sec 6.3–6.4", test: "Recall drill", mins: "~30 min", flash: "ch6",
  topics: ["British southern strategy", "Nathanael Greene, Cowpens, Yorktown", "Treaty of Paris 1783", "Patriots, Loyalists, women, Black people, Native nations"],
  links: [["OpenStax 6.3: War in the South", OS + "6-3-war-in-the-south"], ["OpenStax 6.4: Identity during the Revolution", OS + "6-4-identity-during-the-american-revolution"]],
  parts: [
    { t: "6.3 The southern strategy (1778–1781)", h: steps([
      "<b>Why the South:</b> after Saratoga, Britain bet that the South had many <b>Loyalists</b> who would rise up, and that enslaved people would flee to British lines and weaken the Patriots.",
      "<b>Early British wins:</b> Savannah, Georgia (1778); <b>Charleston, South Carolina (1780)</b>, the worst American defeat of the war, with about 5,000 captured; Camden (1780), where American General Horatio Gates was crushed.",
      "The backcountry became a <b>brutal civil war</b> between Patriot and Loyalist militias. British cavalry leader Banastre Tarleton was known for cruelty. The violence turned many neutral people against the British.",
      "<b>Kings Mountain (1780):</b> Patriot frontier militia destroyed a Loyalist force, the first big swing back.",
      "<b>Nathanael Greene</b> took over the southern army (late 1780) and <b>improved the American position in the South</b>: he split his forces, wore the British down and avoided losing his army. His officer Daniel Morgan won at <b>Cowpens</b> (Jan 1781). At Guilford Courthouse, General <b>Charles Cornwallis</b> “won” but lost so many men that he gave up the Carolinas and marched into Virginia.",
      "<b>Yorktown (October 1781):</b> Cornwallis camped at Yorktown on the coast, waiting for the navy. A <b>French fleet</b> blocked the Chesapeake Bay, and Washington with French General Rochambeau trapped him on land. <b>Cornwallis surrendered on October 19, 1781.</b> This effectively ended the war.",
      "<b>Result of the southern strategy:</b> it failed. Loyalist support was weaker than expected, harsh British tactics created more Patriots, and it ended at Yorktown."]) +
      "<h3>Treaty of Paris (1783)</h3>" + steps(["Britain recognized <b>American independence</b>.", "Borders: Canada in the north, the <b>Mississippi River</b> in the west, Florida (returned to Spain) in the south.", "Americans got fishing rights off Newfoundland; Americans would pay debts owed to British merchants; Congress would recommend that states return Loyalists’ property.", "<b>Native nations</b> that had fought for Britain weren’t included at all; Britain handed over their land without asking them."]) },
    { t: "6.4 Patriots and Loyalists", h: tbl(["", "Patriots", "Loyalists"], [
        ["Who", "Many farmers, artisans, merchants and planters; strongest in New England and Virginia", "Royal officials, Anglican clergy, merchants tied to British trade, many recent immigrants, many enslaved people who sought freedom, most Native nations"],
        ["Why", "Liberty, self-government, end of taxation without representation, land in the west", "Loyalty to king and empire, fear of mob rule, protection by Britain, a chance for freedom (enslaved people) or protection of land (Native nations)"]]) +
      rule("Exam answer: colonists were <b>divided</b> among Patriots, Loyalists (perhaps a fifth of White colonists) and a large group of neutrals. Many just wanted to be left alone.") +
      steps(["Loyalists were harassed, tarred and feathered, and had property seized under state <b>confiscation acts</b>. About 60,000–80,000 left for Canada, Britain or the Caribbean.", "<b>Continental currency</b> lost almost all value (“not worth a Continental”), so the army was often unpaid and short of supplies."]) },
    { t: "6.4 Women, Black people and Native nations", h: steps([
      "<b>Women:</b> ran farms and businesses while men fought; fed, housed and <b>nursed soldiers</b>; followed the army as cooks and laundresses (“camp followers”); <b>raised funds</b> (Esther DeBerdt Reed’s Ladies Association in Philadelphia); boycotted British goods. A few fought: Deborah Sampson disguised herself as a man; “Molly Pitcher” is the legend of women carrying water and firing cannon. Women did <b>not</b> hold government office.",
      "<b>Black people:</b> about 5,000 fought for the Patriots, mostly from the North. Many more fled to the British for the freedom Dunmore (and later Clinton) promised. The war opened chances for freedom, but also danger: re-enslavement, and the British sometimes broke their promises. Some Black Loyalists were evacuated to Nova Scotia and later Sierra Leone.",
      "<b>Native nations:</b> most sided with <b>Britain</b>, because colonists wanted their land (remember the Proclamation Line). The <b>Iroquois Confederacy split</b>: the Mohawk under Joseph Brant fought for Britain, the Oneida and Tuscarora for the Patriots. American troops burned Iroquois towns in 1779. After the war Native nations lost their British ally and much of their land.",
      "<b>Contradiction of the Declaration:</b> it said all men are created equal, but women had no political rights, slavery continued, and Native nations were treated as enemies whose land could be taken."]) +
      ppl([["Nathanael Greene", "American general who turned the war in the South around"], ["Charles Cornwallis", "British general who surrendered at Yorktown"], ["Horatio Gates", "American general beaten at Camden (earlier won Saratoga)"], ["Joseph Brant", "Mohawk leader who fought for Britain"], ["Deborah Sampson", "Woman who fought disguised as a man"], ["Benedict Arnold", "American general who turned traitor (1780)"]]) },
    { t: "Essay questions: practice out loud", h: essays([
      ["Describe the British southern strategy and its results.", "After Saratoga, Britain moved the war south, expecting strong Loyalist support and help from enslaved people fleeing Patriot masters. It took Savannah and Charleston and won at Camden. But Loyalist support was weaker than hoped, brutal fighting turned neutrals into Patriots, Kings Mountain and Cowpens reversed British gains, and Nathanael Greene wore Cornwallis down until he moved to Yorktown, where the French navy and Washington trapped him. The strategy ended in surrender in 1781."],
      ["How did the colonists win despite Britain’s military might? If one factor had been different, how might the outcome change?", "Washington kept the army alive instead of risking it; the Americans fought on home ground and only had to survive, while Britain had to conquer and hold a huge territory 3,000 miles from home; the war was expensive and unpopular in Britain; and the French alliance after Saratoga brought money, troops and the navy that trapped Cornwallis at Yorktown. Without the French fleet, Cornwallis might have escaped by sea and the war could have dragged on."],
      ["How did the condition of women, Black people and Native people reveal a contradiction in the Declaration of Independence?", "The Declaration said all men are created equal with unalienable rights, yet women couldn’t vote or hold office and had no legal identity apart from their husbands, about 500,000 Black people were enslaved (Jefferson himself enslaved hundreds), and Native nations were called “merciless Indian savages” and lost their land. The Revolution’s ideals applied mainly to White men with property."],
      ["How did the Revolutionary War bring new opportunities and challenges for enslaved and free Black people?", "Opportunities: freedom by escaping to British lines (Dunmore’s Proclamation) or by serving in the Continental Army, and the language of liberty that northern Black people used in petitions for freedom; northern states began ending slavery. Challenges: the British sometimes returned or re-sold people, many died of disease, Patriot victory kept slavery in the South, and free Black people still faced discrimination."],
      ["Describe the backgrounds of Patriots and Loyalists. Why did people with such different interests unite on each side?", "Patriots included merchants, artisans, farmers and southern planters; Loyalists included royal officials, Anglican clergy, merchants who depended on British trade, recent immigrants, many enslaved people and most Native nations. Each side united around shared fears and hopes: Patriots around liberty, self-government and western land; Loyalists around order, the protection of the empire, or (for enslaved people and Native nations) a better chance at freedom and keeping their land."]]) }
  ],
  probs: [
    Q("Which American general is responsible for improving the American military position in the South?", ["John Burgoyne", "Nathanael Greene", "Wilhelm Frederick von Steuben", "Charles Cornwallis"], 1, "Greene took command in late 1780 and wore the British down. Burgoyne and Cornwallis were British; von Steuben trained the army at Valley Forge."),
    Q("Why did Britain shift its strategy to the South after 1778?", ["It expected strong Loyalist support and help from enslaved people", "The South had no Patriot militias", "France had captured New York", "The Treaty of Paris required it"], 0, "Britain counted on Loyalists rising up in the South. They didn’t, in the numbers Britain needed."),
    Q("Where did General Cornwallis surrender in October 1781?", ["Yorktown, Virginia", "Saratoga, New York", "Charleston, South Carolina", "Trenton, New Jersey"], 0, "A French fleet blocked his escape by sea while Washington and Rochambeau besieged him on land."),
    Q("What was the worst American defeat of the war, with about 5,000 soldiers captured?", ["Charleston (1780)", "Cowpens (1781)", "Kings Mountain (1780)", "Saratoga (1777)"], 0, "Charleston fell in May 1780. Cowpens and Kings Mountain were American victories; Saratoga was a British surrender."),
    Q("What did the Treaty of Paris of 1783 do?", ["Recognized American independence, with a western border at the Mississippi", "Gave Canada to the United States", "Created the Proclamation Line", "Ended the French and Indian War"], 0, "Don’t mix it up with the 1763 Treaty of Paris, which ended the French and Indian War."),
    Q("Which of the following statements best represents the division between Patriots and Loyalists?", ["Most American colonists were Patriots, with only a few traditionalists remaining loyal to the King and Empire.", "Most American colonists were Loyalists, with only a few firebrand revolutionaries leading the charge for independence.", "American colonists were divided among those who wanted independence, those who wanted to remain part of the British Empire, and those who were neutral.", "The vast majority of American colonists were neutral and didn’t take a side between Loyalists and Patriots."], 2, "Colonists were split three ways: Patriots, Loyalists and neutrals."),
    Q("Which of the following is <b>not</b> one of the tasks women performed during the Revolution?", ["holding government offices", "maintaining their homesteads", "feeding, quartering, and nursing soldiers", "raising funds for the war effort"], 0, "Women had no political office. They ran farms and businesses, cared for soldiers and raised money."),
    Q("Which side did most Native nations support in the Revolution?", ["The British", "The Patriots", "Neither; all stayed neutral", "The French only"], 0, "Britain had tried to stop settlement (the Proclamation Line), while colonists wanted Native land."),
    Q("What were the confiscation acts?", ["State laws that let governments seize Loyalists’ property", "British laws seizing colonial weapons", "Laws seizing smuggled molasses", "Acts closing Boston Harbor"], 0, "Many Loyalists lost their property and about 60,000–80,000 left the country."),
    Q("Which group split, with some members fighting for Britain and others for the Patriots?", ["The Iroquois Confederacy", "The Sons of Liberty", "The Hessians", "The Continental Congress"], 0, "The Mohawk (Joseph Brant) fought for Britain; the Oneida and Tuscarora joined the Patriots."),
    Q("What happened to the value of Continental currency during the war?", ["It collapsed (“not worth a Continental”)", "It became worth more than British pounds", "It was backed by French gold and stayed stable", "It was never printed"], 0, "Congress printed huge amounts with nothing behind it, causing runaway inflation.")
  ]
},

{ id: "H5", block: "C7", title: "Republicanism and how much changed (1776–1790)", covers: "Sec 7.1–7.2", test: "Recall drill", mins: "~30 min", flash: "ch7",
  topics: ["Monarchy vs. republic", "Republicanism and civic virtue; Franklin’s virtues", "Women in the new republic", "Slavery, Black Americans, Native nations, religion"],
  links: [["OpenStax 7.1: From monarchy to republic", OS + "7-1-common-sense-from-monarchy-to-an-american-republic"], ["OpenStax 7.2: How much revolutionary change?", OS + "7-2-how-much-revolutionary-change"]],
  parts: [
    { t: "7.1 From monarchy to republic", h: tbl(["", "Monarchy (Britain)", "Republic (United States)"], [
        ["Who rules", "A hereditary king or queen, plus a hereditary aristocracy (House of Lords)", "<b>Representatives</b> elected by the people; no hereditary ruling class"],
        ["Where power comes from", "Birth, tradition, God", "<b>The people</b> (popular sovereignty)"],
        ["What it needs from citizens", "Obedience and deference to superiors", "<b>Civic virtue</b>: putting the public good above private interest"]]) +
      steps([
        "After independence the revolutionaries turned to <b>republicanism</b> (not democracy, not monarchy). Models: the ancient Roman Republic. Washington was praised as a modern <b>Cincinnatus</b>, the Roman who gave up power and went home to his farm. He resigned his command in 1783.",
        "<b>Republicanism as a social philosophy:</b> a republic survives only if citizens are <b>virtuous</b>: self-sacrificing, hard-working, independent and focused on the common good. Luxury and corruption destroy republics.",
        "<b>Benjamin Franklin’s thirteen virtues</b> (from his autobiography): temperance, silence, order, resolution, frugality, industry, <b>sincerity</b>, justice, moderation, cleanliness, <b>tranquility</b>, chastity, humility. <b>Mercy is not one.</b> They show the self-improvement ideal of a republican citizen.",
        "<b>Democracy</b> (majority rule by the people directly) was seen as dangerous, closer to mob rule. Most founders wanted a republic in which educated, virtuous men led."]) },
    { t: "7.2 Women in the new republic", h: steps([
      "<b>Coverture:</b> a married woman had no separate legal identity. Her property, wages and children legally belonged to her husband.",
      "<b>Abigail Adams</b> wrote to her husband John in 1776: “<b>Remember the ladies</b>,” asking for laws that limited husbands’ power. John joked it off.",
      "<b>Judith Sargent Murray</b>, “On the Equality of the Sexes” (1790): women’s minds equal men’s; they need education.",
      "<b>Mercy Otis Warren:</b> wrote plays and a history of the Revolution; a political voice.",
      "<b>Phillis Wheatley:</b> enslaved, then freed, poet in Boston, the first published African American woman poet. Her poetry challenged ideas about Black inferiority, but she <b>did not actively challenge the status of women</b>.",
      "<b>Republican motherhood:</b> women’s key role was to raise <b>virtuous sons</b> (future citizens), which justified better education for women but kept them in the home.",
      "New Jersey let property-owning women (and free Black people) vote from 1776 until 1807. Otherwise women gained no political rights."]) },
    { t: "7.2 Slavery, Black Americans, Native nations, religion", h: steps([
      "<b>The North began ending slavery:</b> Vermont banned it (1777); <b>Pennsylvania</b> passed a <b>gradual abolition</b> law (1780); in <b>Massachusetts</b>, Elizabeth Freeman (“Mum Bett”) and Quock Walker won court cases that ended slavery (1780s). “Gradual” meant children born after the law were freed at adulthood, so slavery lingered for decades.",
      "<b>Manumission</b> (an owner freeing an enslaved person) became easier in the Upper South; Virginia allowed it in 1782, and the free Black population grew. The Lower South (South Carolina, Georgia) kept and expanded slavery.",
      "<b>Thomas Jefferson:</b> wrote “all men are created equal” but enslaved over 600 people in his lifetime. In <i>Notes on the State of Virginia</i> he suggested Black people were inferior and believed free Black and White people couldn’t live together; he favored gradual emancipation plus sending freed people away (colonization). He called slavery a moral evil but never freed most of the people he enslaved. Characterize him as <b>contradictory</b>.",
      "<b>Native nations:</b> treated as defeated enemies who had sided with Britain. The new nation pressured them to give up land in treaties.",
      "<b>Religion:</b> states began disestablishing official churches. <b>Virginia</b> had the clearest separation of church and state: the <b>Virginia Statute for Religious Freedom</b> (Jefferson, passed with Madison’s help, 1786). Massachusetts kept a state-supported church until 1833."]) +
      ppl([["Abigail Adams", "“Remember the ladies”"], ["Judith Sargent Murray", "“On the Equality of the Sexes”"], ["Mercy Otis Warren", "Writer, history of the Revolution"], ["Phillis Wheatley", "Enslaved poet; didn’t challenge women’s status"], ["Benjamin Franklin", "Thirteen virtues"], ["Thomas Jefferson", "Declaration, Virginia Statute for Religious Freedom, contradictions on race"]]) },
    { t: "Essay questions: practice out loud", h: essays([
      ["What defined republicanism as a social philosophy?", "The belief that a republic only survives if its citizens have civic virtue: they put the public good ahead of their own interests, live simply and work hard, and stay independent so no one can corrupt them. Franklin’s thirteen virtues and the image of Washington as Cincinnatus giving up power show this ideal."],
      ["How would you characterize Thomas Jefferson’s ideas on race and slavery?", "Contradictory. He wrote that all men are created equal and called slavery a moral evil, but he enslaved hundreds of people, argued in <i>Notes on the State of Virginia</i> that Black people were likely inferior, and thought freed people should be sent away rather than live as equals. His ideals and his actions didn’t match."],
      ["Describe popular attitudes toward African Americans, women and Native Americans after the Revolution. How did the social order depend on keeping them in their roles?", "Women were expected to be republican mothers under coverture, African Americans were mostly enslaved and seen as inferior even in the North, and Native Americans were seen as conquered enemies. The economy (especially southern plantations) depended on enslaved labor, family property and inheritance depended on coverture, and westward expansion depended on taking Native land. Changing these roles would have meant giving up property, power and land, and rewriting voting and property laws."]]) }
  ],
  probs: [
    Q("To what form of government did the American revolutionaries turn after the war for independence?", ["republicanism", "monarchy", "democracy", "oligarchy"], 0, "A republic: elected representatives govern, with no king or hereditary class."),
    Q("Which of the following was <b>not</b> one of Franklin’s thirteen virtues?", ["sincerity", "temperance", "mercy", "tranquility"], 2, "Franklin’s list includes temperance, sincerity and tranquility, but not mercy."),
    Q("Which of the following figures did <b>not</b> actively challenge the status of women in the early American republic?", ["Abigail Adams", "Phillis Wheatley", "Mercy Otis Warren", "Judith Sargent Murray"], 1, "Phillis Wheatley was a poet whose work challenged ideas about race, not women’s status."),
    Q("Which state had the clearest separation of church and state?", ["New Hampshire", "Pennsylvania", "Virginia", "New York"], 2, "The Virginia Statute for Religious Freedom (Jefferson, 1786)."),
    Q("What was coverture?", ["The legal status of married women: complete legal and economic dependence on husbands", "A tax on imported cloth", "Protection of Loyalists after the war", "The right of women to vote in New Jersey"], 0, "Under coverture, a wife’s property and earnings belonged to her husband."),
    Q("What was “republican motherhood”?", ["The idea that women served the republic by raising virtuous sons", "A movement for women’s right to vote", "A law giving mothers custody of children", "A women’s regiment in the Continental Army"], 0, "It justified women’s education but kept them in the home."),
    Q("What is manumission?", ["An owner releasing an enslaved person from slavery", "A state law ending slavery immediately", "Counting enslaved people for representation", "Selling an enslaved person to another state"], 0, "Virginia made manumission easier in 1782; the free Black population grew."),
    Q("Who wrote to her husband to “remember the ladies”?", ["Abigail Adams", "Mercy Otis Warren", "Judith Sargent Murray", "Martha Washington"], 0, "Abigail Adams, 1776, to John Adams."),
    Q("Which best describes how northern states dealt with slavery after the Revolution?", ["They began to end it, often through gradual emancipation", "They expanded it", "They abolished it immediately everywhere in 1776", "They left it untouched"], 0, "Pennsylvania’s gradual abolition (1780), court cases in Massachusetts, Vermont’s ban (1777)."),
    Q("Why did many founders distrust pure democracy?", ["They feared it would become mob rule", "They wanted a king", "The Bible forbade it", "France had banned it"], 0, "They preferred a republic led by virtuous, elected representatives.")
  ]
},
{ id: "H6", block: "C7", title: "Articles of Confederation to the Constitution (1776–1790)", covers: "Sec 7.3–7.4", test: "Recall drill", mins: "~40 min", star: true, flash: "ch7",
  topics: ["State constitutions: Pennsylvania vs. Massachusetts", "Articles of Confederation and its weaknesses", "Shays’ Rebellion", "Constitutional Convention compromises and ratification"],
  links: [["OpenStax 7.3: Debating democracy", OS + "7-3-debating-democracy"], ["OpenStax 7.4: The Constitutional Convention", OS + "7-4-the-constitutional-convention-and-federal-constitution"]],
  parts: [
    { t: "7.3 State constitutions", h: tbl(["", "Pennsylvania (1776)", "Massachusetts (1780)"], [
        ["Type", "<b>Most democratic</b> (radical Whigs)", "More conservative (conservative Whigs); model for the U.S. Constitution"],
        ["Legislature", "<b>Unicameral</b> (one house), elected every year", "<b>Bicameral</b> (two houses)"],
        ["Executive", "No governor; a weak executive council", "Strong governor with a veto"],
        ["Who votes", "All adult men who paid taxes", "Property requirements to vote and higher ones to hold office"],
        ["How adopted", "By a convention", "Written by John Adams, approved by a special convention and the voters"]]) +
      steps([
        "<b>Radical Whigs</b> wanted to <b>broaden participation</b> in politics. <b>Conservative Whigs</b> were the elite who wanted power kept with a few wealthy families.",
        "States like <b>South Carolina and Maryland</b> set high property requirements for office: the less democratic end.",
        "Common features: written constitutions, many with bills of rights, weak governors (fear of a king), strong legislatures."]) },
    { t: "7.3 The Articles of Confederation (1781–1789)", h: steps([
      "Written 1777, ratified 1781 (Maryland held out until states with western land claims gave them up).",
      "A “firm league of friendship” between sovereign states. One house of Congress, <b>one vote per state</b>. No president, no national courts.",
      "Big laws needed <b>9 of 13</b> states; amendments needed <b>all 13</b>, so it could never be fixed."]) +
      tbl(["Congress <b>could</b>", "Congress <b>could not</b>"], [
        ["Declare war, make treaties, run foreign affairs", "<b>Tax</b> (could only ask states for money)"],
        ["Coin and borrow money, run a postal service", "Regulate trade between states or with other nations"],
        ["Manage western lands: <b>land ordinances</b>", "Enforce its treaties or laws on the states"]]) +
      steps([
        "<b>Its big success, western land:</b> the <b>Land Ordinance of 1785</b> surveyed the West into townships with a section for public schools; the <b>Northwest Ordinance of 1787</b> set the path to statehood for the Northwest Territory and <b>banned slavery there</b>.",
        "<b>Problems:</b> huge war debts it couldn’t pay, worthless money, states printing money and taxing each other, Britain keeping forts in the Northwest, Spain closing the Mississippi."]) +
      "<h3>Shays’ Rebellion (1786–1787)</h3>" + steps([
        "<b>Causes:</b> western Massachusetts farmers, many of them Revolutionary veterans who had never been fully paid, faced <b>heavy state taxes</b> that had to be paid in hard money (gold and silver), plus <b>debts, foreclosures</b> on their farms and debtors’ prison. The state government, run by eastern merchants and creditors, refused relief.",
        "<b>Daniel Shays</b>, a veteran, led about 1,500 men who closed courts to stop foreclosures, then attacked the federal armory at Springfield (Jan 1787).",
        "<b>Response:</b> Congress had no money or army to stop them. Massachusetts used a militia <b>paid for by Boston merchants</b> to crush the rebellion.",
        "<b>Significance:</b> it scared elites into believing the Articles were too weak, which led directly to the <b>Constitutional Convention</b> in 1787."]) },
    { t: "7.4 The Constitutional Convention (Philadelphia, summer 1787)", h: "<p>55 delegates, Washington presiding, <b>James Madison</b> the main planner (“Father of the Constitution”). Rhode Island didn’t come. Met in secret. Set out to revise the Articles but wrote a new constitution.</p>" +
      tbl(["Plan", "Legislature", "Favored"], [
        ["<b>Virginia Plan</b> (Madison)", "Two houses, both by <b>proportional representation</b> (by population)", "Large states"],
        ["<b>New Jersey Plan</b> (Paterson)", "One house, <b>equal</b> votes per state", "Small states"],
        ["<b>Connecticut (Great) Compromise</b> (Roger Sherman)", "<b>Bicameral</b>: House by population, Senate equal (2 per state)", "Resolved the issue of representation"]]) +
      steps([
        "<b>Three-fifths compromise:</b> southern states wanted enslaved people counted for <b>representation</b> (more seats) but not for taxes; northern states said the opposite. They agreed to count <b>three of every five enslaved people</b>. Consequence: the South got extra seats in the House and extra electoral votes, which protected slavery for decades.",
        "Other slavery deals: Congress couldn’t ban the slave trade until <b>1808</b>; a <b>fugitive slave clause</b> required returning people who escaped. The word “slavery” never appears.",
        "<b>Electoral College:</b> electors, as many as each state’s members of Congress, choose the president, not a direct popular vote.",
        "Structure: separation of powers (legislative, executive, judicial) with <b>checks and balances</b>; federalism (power shared between national and state governments). Congress can now <b>tax</b> and regulate trade."]) },
    { t: "7.4 Ratification (1787–1790)", h: steps([
        "Ratified <b>by each state at special ratifying conventions</b>; 9 of 13 needed. Delaware was first (Dec 1787), New Hampshire was the ninth (June 1788). Virginia and New York were close fights. Rhode Island was last (1790)."]) +
      tbl(["", "Federalists", "Anti-Federalists"], [
        ["Position", "<b>Supported</b> the Constitution and a strong central government", "<b>Opposed</b> it; favored strong states"],
        ["Leaders", "Hamilton, Madison, John Jay (<i>The Federalist Papers</i>, 85 essays as “Publius”)", "Patrick Henry, George Mason, Melancton Smith"],
        ["Arguments", "Articles failed; a large republic protects liberty; checks and balances stop tyranny", "Too much central power; <b>no bill of rights</b>; too few representatives, so the elite would rule; the president might become a king"]]) +
      steps([
        "Compromise: Federalists promised to add a <b>Bill of Rights</b> (added 1791).",
        "<b>New York debate:</b> Anti-Federalist <b>Melancton Smith</b> argued a “pure democracy” (people governing directly) would be the most perfect government if it were practical, and wanted more representatives so ordinary people (the “middling class”) would be represented. <b>Hamilton</b> answered that pure democracy always led to tyranny and disorder. The modern U.S. is a <b>representative democracy</b>, not a pure one."]) +
      ppl([["James Madison", "Virginia Plan; “Father of the Constitution”; <i>Federalist Papers</i>"], ["Roger Sherman", "Connecticut (Great) Compromise"], ["William Paterson", "New Jersey Plan"], ["Alexander Hamilton", "Federalist; <i>Federalist Papers</i>"], ["Daniel Shays", "Led the 1786–87 farmers’ rebellion"], ["Patrick Henry / Melancton Smith", "Anti-Federalists"]]) },
    { t: "Essay questions: practice out loud", h: essays([
      ["What were the primary causes of Shays’ Rebellion? What was the government’s response, and did it confirm the rebels’ grievances?", "Farmers in western Massachusetts, many unpaid veterans, faced high taxes payable only in hard money, debts and foreclosures, while the merchant-controlled state refused relief. They closed courts and attacked the Springfield armory. Congress under the Articles couldn’t respond; a militia funded by Boston merchants crushed them. That confirmed their complaint that government served wealthy creditors, though Massachusetts later lowered taxes and pardoned most rebels. Elites took it as proof the Articles were too weak."],
      ["Explain the argument that led to the three-fifths rule and its consequences.", "Representation in the House was based on population. Southern delegates wanted enslaved people counted fully to get more seats; northerners said people treated as property shouldn’t count. They compromised: three of every five enslaved people counted for representation and direct taxes. This gave slaveholding states extra seats and electoral votes, which helped protect slavery and southern power for decades."],
      ["Describe the more and less democratic state constitutions. Who could participate, and whose interests were represented?", "Pennsylvania’s 1776 constitution was the most democratic: one house elected every year, no governor, and all taxpaying men could vote, so farmers and artisans had a real voice. Massachusetts (1780), South Carolina and Maryland had property requirements for voting and higher ones for office, two houses and stronger governors, which favored wealthy elites. Women, enslaved people and usually free Black people were excluded nearly everywhere."],
      ["How does the Constitution show both republican and democratic principles? How does it depart from them?", "Republican: elected representatives, no king or nobility, separation of powers. Democratic: the House is directly elected by the people and majority rule decides laws. Departures: senators were originally chosen by state legislatures, the president by the Electoral College, judges are appointed for life, and women, enslaved people and Native Americans were left out (the three-fifths clause even counted enslaved people without giving them rights)."],
      ["How did creating and ratifying the Constitution confirm the positions of African Americans, women and Native Americans?", "It protected slavery (three-fifths clause, slave trade until 1808, fugitive slave clause) without saying the word, left voting rules to states that excluded women, and treated Native nations as outsiders (“Indians not taxed”) with whom Congress dealt by treaty. That clashed with the stated goals of “We the People” and securing “the blessings of liberty.”"],
      ["At New York’s ratifying convention, Hamilton disputed Melancton Smith’s claim that “a pure democracy, if it were practicable, would be the most perfect government.” What did they mean, and how does it compare to the modern U.S.?", "A pure (direct) democracy means the people themselves vote on every law, as in an ancient city or a town meeting. Smith admired that ideal and, since it’s impractical in a big country, wanted many representatives so ordinary “middling” people would be represented, not just elites. Hamilton argued pure democracies had always turned into tyranny and disorder, so a republic of elected, capable representatives with checks and balances was safer. The modern U.S. is a representative democracy: far more people can vote than in 1788 and there is some direct democracy (state ballot measures), but elected officials make most decisions, closer to Hamilton’s model."]]) }
  ],

{ id: "H7", block: "C8", title: "Federalists vs. Democratic-Republicans; the 1790s (1789–1796)", covers: "Sec 8.1–8.2", test: "Recall drill", mins: "~35 min", star: true, flash: "ch8",
  topics: ["Two visions: Hamilton vs. Jefferson", "Hamilton’s financial plan", "Bill of Rights", "French Revolution, Genêt, Whiskey Rebellion, Jay’s Treaty"],
  links: [["OpenStax 8.1: Federalists and Democratic-Republicans", OS + "8-1-competing-visions-federalists-and-democratic-republicans"], ["OpenStax 8.2: The new American republic", OS + "8-2-the-new-american-republic"]],
  parts: [
    { t: "8.1 Two competing visions", h: "<p>George Washington became the first president in 1789. His cabinet: <b>Alexander Hamilton</b> (Treasury), <b>Thomas Jefferson</b> (State), Henry Knox (War), Edmund Randolph (Attorney General). Hamilton and Jefferson’s clashes created the <b>first party system</b>.</p>" +
      tbl(["", "Federalists", "Democratic-Republicans"], [
        ["Leaders", "<b>Hamilton</b>, John Adams", "<b>Jefferson</b>, James Madison"],
        ["Government", "<b>Strong central government</b>", "<b>Limited government</b>, states’ rights"],
        ["Economy", "Commerce, manufacturing, banks, cities", "Agriculture; independent <b>yeoman farmers</b> = virtuous citizens"],
        ["Constitution", "<b>Loose</b> reading: implied powers", "<b>Strict</b> reading: only listed powers"],
        ["Abroad", "Pro-<b>Britain</b> (trade partner, order)", "Pro-<b>France</b> (fellow republic)"],
        ["Base", "Merchants, northeastern elites", "Farmers, the South and West"]]) +
      "<h3>Hamilton’s financial plan</h3>" + tbl(["Program", "What it did", "Controversy"], [
        ["<b>Public credit plan</b> (Report on Public Credit, 1790)", "Pay the national debt at <b>full face value</b> and <b>assume the states’ war debts</b>", "Speculators had bought soldiers’ IOUs cheaply, so <b>speculators profited at the expense of poor soldiers</b>. States that had paid off debts (Virginia) objected. Settled by the <b>Compromise of 1790</b>: assumption in exchange for putting the capital on the Potomac."],
        ["<b>Bank of the United States</b> (1791)", "A national bank to hold government money, make loans and issue currency", "Jefferson: unconstitutional, not a listed power. Hamilton: allowed by implied powers (the “necessary and proper” clause)."],
        ["<b>Whiskey tax</b> (1791)", "An excise tax on distilled spirits to raise revenue", "Hit western farmers who turned grain into whiskey; led to the Whiskey Rebellion"],
        ["<b>Report on Manufactures</b> (1791)", "Tariffs and subsidies to build American industry", "Mostly not adopted"]]) +
      "<p>What lasts today: a national debt that funds the government, a central bank (the Federal Reserve) and federal taxes.</p>" },
    { t: "8.1 The Bill of Rights (1791)", h: "<p>The first ten amendments, drafted by <b>Madison</b> to keep the Federalists’ promise to Anti-Federalists. They guarantee individual rights.</p>" +
      tbl(["#", "Right"], [["1st", "Freedom of religion, speech, press, assembly, petition"], ["2nd", "Bear arms"], ["3rd", "No quartering of soldiers in homes"], ["4th", "No unreasonable searches and seizures"], ["5th", "Due process; no self-incrimination or double jeopardy"], ["6th", "Speedy, public trial by jury; a lawyer"], ["7th", "Jury in civil cases"], ["8th", "No cruel and unusual punishment or excessive bail"], ["9th", "Rights not listed are still kept by the people"], ["10th", "Powers not given to the federal government belong to the states or the people"]]) +
      rule("Exam trap: the right to an <b>education</b> is <b>not</b> in the Bill of Rights.") },
    { t: "8.2 Uprisings at home and abroad (1789–1796)", h: steps([
      "<b>French Revolution (1789):</b> at first most Americans cheered. Then came <b>the Terror</b> (1793–94), mass executions including the king. <b>Federalists</b> were horrified (mob rule); <b>Democratic-Republicans</b> kept supporting France as a sister republic. This deepened the party split.",
      "France and Britain went to war (1793). Washington issued the <b>Neutrality Proclamation</b> (1793): stay out.",
      "<b>Citizen Genêt affair (1793):</b> French minister Edmond-Charles Genêt toured the U.S., hiring American ships as privateers with <b>letters of marque</b> (French warrants allowing piracy against British ships) and trying to drag the U.S. into France’s war. Washington demanded his recall.",
      "<b>Haitian Revolution (1791):</b> enslaved people in the French colony of Saint-Domingue rose up and won freedom (Toussaint Louverture). Terrified American slaveholders.",
      "<b>Whiskey Rebellion (1794):</b> western Pennsylvania farmers revolted against <b>the tax on whiskey</b>. Washington led about 13,000 militia; the rebels scattered. It showed the new federal government could enforce its laws, unlike the government during Shays’ Rebellion.",
      "<b>Northwest Indian War:</b> a Native confederacy beat U.S. armies (1791), then lost at <b>Fallen Timbers</b> (1794); the Treaty of Greenville (1795) gave up most of Ohio.",
      "<b>Jay’s Treaty (1794):</b> with Britain. Britain would leave its forts in the Northwest; American ships got <b>limited trade rights in the British West Indies</b>; Americans would repay pre-Revolution debts to British merchants. It did <b>not</b> stop impressment and gave <b>no land rights</b> in the West Indies. Democratic-Republicans called it a sellout to Britain, which <b>hardened the party divide</b>.",
      "<b>Pinckney’s Treaty (1795):</b> with Spain: Americans could use the Mississippi and ship goods through New Orleans.",
      "<b>Washington’s Farewell Address (1796):</b> warned against political parties and permanent foreign alliances."]) +
      ppl([["Alexander Hamilton", "Treasury; public credit, bank, whiskey tax; Federalist leader"], ["Thomas Jefferson", "State; Democratic-Republican leader; opposed the bank"], ["James Madison", "Wrote the Bill of Rights; later sided with Jefferson"], ["Citizen Genêt", "French minister who tried to involve the U.S. in France’s war"], ["John Jay", "Negotiated Jay’s Treaty with Britain"]]) },
    { t: "Essay questions: practice out loud", h: essays([
      ["What were the fundamental differences between the Federalist and Democratic-Republican visions?", "Federalists (Hamilton, Adams) wanted a strong central government, a commercial and manufacturing economy backed by a national bank, a loose reading of the Constitution, and close ties to Britain. Democratic-Republicans (Jefferson, Madison) wanted limited government and states’ rights, an agrarian republic of independent farmers, a strict reading of the Constitution, and friendship with France."],
      ["How did the French Revolution influence the American political system?", "It split Americans. Democratic-Republicans saw France as a fellow republic fighting monarchy; Federalists saw the Terror as proof that too much democracy brings mob rule. Debates over neutrality, Citizen Genêt, Jay’s Treaty and later the Quasi-War turned the split into two organized parties."],
      ["Describe Hamilton’s plans for the nation’s finances. Which were most controversial, and what remains today?", "Pay the national debt at full value, have the federal government assume state debts, create the Bank of the United States, levy a whiskey tax and tariffs, and encourage manufacturing. Most controversial: paying full value rewarded speculators over the original soldier-holders, assumption angered states that had paid their debts, and the bank raised the question of implied powers. Still with us: a national debt, a central bank (the Federal Reserve) and federal taxes."],
      ["Describe the growth of the first party system. How did the parties develop and define themselves? Where did they agree?", "It grew out of cabinet fights between Hamilton and Jefferson over the debt plan and the bank, then over the French Revolution and Jay’s Treaty. Federalists defined themselves as defenders of order, commerce and strong government; Democratic-Republicans as defenders of liberty, farmers and limited government, each seeing the other as a threat to the republic. Both accepted the Constitution, republican government and independence, and both wanted to keep the U.S. out of a European war."]]) }
  ],

    Q("Which group favored a strong central government, a national bank and close ties to Britain?", ["Federalists", "Democratic-Republicans", "Anti-Federalists", "Radical Whigs"], 0, "Hamilton’s Federalists. Jefferson’s Democratic-Republicans favored limited government and France."),

    Q("What was the Citizen Genêt affair?", ["A French minister tried to involve the U.S. in France’s war against Britain", "A U.S. diplomat was bribed by France", "A Frenchman led the Whiskey Rebellion", "France bought Louisiana"], 0, "Genêt commissioned American privateers; Washington demanded his recall."),
    Q("What were letters of marque?", ["French warrants allowing ships and crews to engage in piracy", "Letters from Washington to Congress", "Bank notes from the Bank of the United States", "British orders to impress sailors"], 0, "Genêt (and France in the Quasi-War) issued them to attack enemy shipping."),
    Q("What was Washington’s response to the war between Britain and France in 1793?", ["The Neutrality Proclamation", "A declaration of war on Britain", "An alliance with France", "The Embargo Act"], 0, "He kept the U.S. out of the war. (The Embargo came in 1807 under Jefferson.)"),
    Q("Why was Washington’s handling of the Whiskey Rebellion significant?", ["It showed the federal government could enforce its laws", "It led to repeal of the Constitution", "It started the War of 1812", "It created the Bill of Rights"], 0, "Unlike the weak Articles government during Shays’ Rebellion, the new government put down the revolt."),
    Q("What was the Terror?", ["A period of mass executions in the French Revolution, 1793–1794", "British attacks on American ships", "Shays’ attack on the Springfield armory", "The Haitian Revolution"], 0, "It turned Federalists against the French Revolution.")
  ]
},
{ id: "H8", block: "C8", title: "Partisan politics, Jefferson and the War of 1812 (1796–1815)", covers: "Sec 8.3–8.4", test: "Recall drill", mins: "~35 min", flash: "ch8",
  topics: ["Adams, the XYZ affair, Alien and Sedition Acts", "Revolution of 1800, Marbury v. Madison, Louisiana Purchase", "Impressment and the Embargo of 1807", "War of 1812: causes, events, results"],

  parts: [
    { t: "8.3 John Adams and France (1797–1801)", h: steps([
      "<b>Election of 1796:</b> Federalist <b>John Adams</b> won; his rival Jefferson became vice president. The primary issue of Adams’s presidency was <b>relations with France</b>.",
      "<b>XYZ affair (1797–98):</b> Adams sent diplomats to France. Three French agents, called X, Y and Z, demanded a <b>bribe</b> and a loan before talks could start. Americans were outraged (“Millions for defense, but not one cent for tribute!”).",
      "<b>Quasi-War (1798–1800):</b> an undeclared naval war with France in the Caribbean. Ended by the Convention of 1800.",

    { t: "8.4 Road to the War of 1812", h: steps([

      "<b>Native resistance:</b> the Shawnee leader <b>Tecumseh</b> and his brother <b>Tenskwatawa</b> (“the Prophet”) built a Native confederacy to stop U.S. expansion. William Henry Harrison attacked it at <b>Tippecanoe</b> (1811). Americans blamed Britain for arming Native fighters from Canada.",

    { t: "Essay questions: practice out loud", h: essays([
      ["How did U.S. relations with France influence events at the end of the 18th century?", "Anger over French attacks on American ships and the XYZ bribe demand led to the undeclared Quasi-War (1798–1800). Federalists used the war fever to pass the Alien and Sedition Acts against immigrants and Democratic-Republican critics, which provoked the Virginia and Kentucky Resolutions. The backlash, and Adams making peace with France (splitting his own party), helped Jefferson win in 1800."],
      ["Why do historians call Jefferson’s election the Revolution of 1800?", "It was the first time power passed peacefully from one party to its rival, from the Federalists to the Democratic-Republicans, through an election. It proved the Constitution could survive bitter partisanship without violence, and Jefferson cut taxes, the army and the debt to reverse Federalist policies."],
      ["What led to the Alien and Sedition Acts, and why were they controversial?", "The Quasi-War with France and fear of French-sympathizing radicals and immigrants (who mostly voted Democratic-Republican) led the Federalist Congress to pass them in 1798. They were controversial because the Sedition Act punished criticism of the government, violating freedom of speech and the press in the First Amendment, and it was used against Democratic-Republican editors and Congressman Matthew Lyon. Jefferson and Madison answered with the Virginia and Kentucky Resolutions."],
      ["What was the most significant impact of the War of 1812?", "A strong answer: the destruction of Native resistance east of the Mississippi. Tecumseh died, his confederacy collapsed, and Britain stopped backing Native nations, which opened the West to American expansion. Other impacts to mention: a surge of nationalism (anthem, Jackson as hero), the end of the Federalist Party after the Hartford Convention, and growth in American manufacturing."],
      ["How did the events of this era challenge the Constitution? What issues were raised and how were they addressed?", "The national bank raised implied versus enumerated powers (Hamilton’s loose versus Jefferson’s strict construction). The Sedition Act tested the First Amendment, and the Virginia and Kentucky Resolutions claimed states could judge laws unconstitutional. The 1800 electoral tie exposed a flaw, fixed by the 12th Amendment. Marbury v. Madison settled that the Supreme Court decides constitutionality (judicial review). The Louisiana Purchase forced strict-constructionist Jefferson to stretch federal power."]]) }

    var mode = "val", out = box.querySelector(".calc-out"), plot = box.querySelector(".calc-plot"), lastIn = null;
    if (CONFIG.web && typeof Reader !== "undefined") { // the calculator's own pad, with the same tools and reader
      PROB.__calc = { pid: "__calc", type: "calc", calc: true };
      box.querySelector(".calc-pad").innerHTML = scratchHTML(PROB.__calc);
    }
    box.addEventListener("focusin", function (ev) { if (ev.target.classList.contains("calc-in")) lastIn = ev.target; });
    function v(n) { return box.querySelector('[data-f="' + n + '"]').value.trim(); }
    function num(s) { return E.ev(E.parse(s), 0, 0); }
    function fn(s) { var a = E.parse(s); return function (x) { return E.ev(a, x, 0); }; }
    function r(x) { return isFinite(x) ? String(+x.toPrecision(10)) : "undefined"; }
    function f4(x) { return (Math.abs(x) < 5e-5 ? 0 : x).toFixed(4); }
    function simpson(f, a, b, n) { var h = (b - a) / n, s = f(a) + f(b); for (var i = 1; i < n; i++) s += f(a + i * h) * (i % 2 ? 4 : 2); return s * h / 3; }
    function draw(fs, A, B, roots) {
      var n = 300, ys = [], pts = fs.map(function (f) { var a = []; for (var i = 0; i <= n; i++) { var x = A + (B - A) * i / n, y = f(x); a.push([x, y]); if (isFinite(y)) ys.push(y); } return a; });
      if (!ys.length) { plot.innerHTML = ""; return; }
      ys.sort(function (p, q) { return p - q; });
      var lo = Math.min(ys[Math.floor(ys.length * 0.03)], 0), hi = Math.max(ys[Math.ceil(ys.length * 0.97) - 1], 0), pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
      var W = 340, H = 220, X = function (x) { return (x - A) / (B - A) * W; }, Y = function (y) { return H - (y - lo) / (hi - lo) * H; };
      var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Graph of the curves">';
      if (lo < 0 && hi > 0) s += '<line x1="0" x2="' + W + '" y1="' + Y(0) + '" y2="' + Y(0) + '" style="stroke:var(--ink-faint)"/>';
      if (A < 0 && B > 0) s += '<line y1="0" y2="' + H + '" x1="' + X(0) + '" x2="' + X(0) + '" style="stroke:var(--ink-faint)"/>';
      pts.forEach(function (a, k) {
        var d = "", pen = false;
        a.forEach(function (p) { if (!isFinite(p[1]) || p[1] < lo - (hi - lo) || p[1] > hi + (hi - lo)) { pen = false; return; } d += (pen ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); pen = true; });
        s += '<path d="' + d + '" style="fill:none;stroke-width:2;stroke:var(--' + (k ? "break" : "ink") + ')"/>';
      });
      roots.forEach(function (x) { s += '<circle cx="' + X(x).toFixed(1) + '" cy="' + Y(fs[0](x)).toFixed(1) + '" r="4" style="fill:var(--accent)"/>'; });
      plot.innerHTML = s + '<text x="4" y="12" style="font-size:11px;fill:var(--ink-faint)">y from ' + r(+lo.toPrecision(3)) + " to " + r(+hi.toPrecision(3)) + "</text></svg>";
    }
    function run() {
      try {
        if (mode === "val") {
          if (!v("e")) { out.textContent = ""; return; }
          var ast = E.parse(v("e")), pv = '<span class="m">' + E.pretty(ast) + "</span>", g1 = E.ev(ast, 0.3, 0.37), g2 = E.ev(ast, 0.7, 0.91);
          if (g1 !== g2 && !(isNaN(g1) && isNaN(g2))) { out.innerHTML = pv + '<br><span class="muted">This has x (or C) in it, so it isn’t a single number. Put a number in place of x, or use the Integral or Graph tab.</span>'; return; }
          out.innerHTML = pv + " = <b>" + r(g1) + "</b>"; return;
        }
        if (mode === "int") {
          if (!v("f") || !v("a") || !v("b")) { out.textContent = "Enter the function and both limits."; return; }
          var f = fn(v("f")), a = num(v("a")), b = num(v("b")), s1 = simpson(f, a, b, 2000), s2 = simpson(f, a, b, 4000);
          out.innerHTML = "≈ <b>" + r(s2) + "</b>" + (!isFinite(s2) || Math.abs(s1 - s2) > 1e-6 * Math.max(1, Math.abs(s2)) ? ' <span class="muted">The function blows up or jumps somewhere in there, so don’t trust this one.</span>' : "");
          return;
        }
        if (!v("g1")) { out.textContent = ""; plot.innerHTML = ""; return; }
        var f1 = fn(v("g1")), two = !!v("g2"), f2 = two ? fn(v("g2")) : function () { return 0; }, A = num(v("ga")), B = num(v("gb")), n = 2000, roots = [];
        if (!(B > A)) { out.textContent = "The second x-value must be bigger than the first."; return; }
        var d = function (x) { return f1(x) - f2(x); };
        for (var i = 0; i < n; i++) {
          var p = A + (B - A) * i / n, q = A + (B - A) * (i + 1) / n, dp = d(p), dq = d(q);
          if (!isFinite(dp) || !isFinite(dq)) continue;
          if (dp === 0) { roots.push(p); continue; }
          if (dp * dq < 0) { for (var k = 0; k < 60; k++) { var m = (p + q) / 2, dm = d(m); if (dp * dm <= 0) q = m; else { p = m; dp = dm; } } var x = (p + q) / 2; if (Math.abs(d(x)) < 1e-6 * (1 + Math.abs(f1(x)))) roots.push(x); }
        }
        draw(two ? [f1, f2] : [f1], A, B, roots);
        out.innerHTML = roots.length ? (two ? "They cross at " : "Zeros at ") + roots.map(function (x) { return "x ≈ <b>" + f4(x) + "</b> (y ≈ " + f4(f1(x)) + ")"; }).join(", ") : (two ? "They don’t cross" : "No zeros") + " between " + A + " and " + B + ". Try a wider range.";
      } catch (e) { out.textContent = e.message; if (mode === "gr") plot.innerHTML = ""; }
    }
    var tmr = null;
    box.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { box.hidden = true; btn.focus(); } });
    box.addEventListener("input", function () { clearTimeout(tmr); tmr = setTimeout(run, 250); });
    box.addEventListener("click", function (ev) {
      var t = ev.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-x")) { box.hidden = true; return; }
      if (t.hasAttribute("data-from-pad")) { // the pad under a problem: the one last used, else the first open one on the page
        var pad = LAST_PAD && LAST_PAD.isConnected && LAST_PAD.__api ? LAST_PAD : null;
        if (!pad) pad = $$("#page .scratch").filter(function (x) { return x.__api && !x.__api.isEmpty(); })[0] || null;
        if (!pad) { toast("Open a problem’s scratch pad and write on it first."); return; }
        readAnswer(pad.dataset.pid, t, true, pad); return;
      }
      if (t.dataset.m) {
        mode = t.dataset.m;
        box.querySelectorAll("[data-m]").forEach(function (b) { b.classList.toggle("on", b === t); });
        box.querySelectorAll("[data-p]").forEach(function (p) { p.hidden = p.dataset.p !== mode; });
        run();
      }
    });
    function open() { box.hidden = false; mountScratches(); }
    btn.addEventListener("click", function () { box.hidden = !box.hidden; if (!box.hidden) { mountScratches(); var i = box.querySelector('[data-p="' + mode + '"] input'); if (i) i.focus(); } });
    CALC = {
      open: open,
      target: function () { // the box last typed in, if it's on the tab showing; else the first box of that tab
        var pane = box.querySelector('[data-p="' + mode + '"]');
        if (lastIn && pane.contains(lastIn)) return lastIn;
        return pane.querySelector("input");
      }
    };
  })();
  initReader();
  lastJSON = fingerprint();
  render();
  if (CONFIG.web) initGH(); else if (CONFIG.hosted) { initCloud(); initSample(); } else { initFile(); extPost("hello"); }
  if (fromFile && !CONFIG.web) setTimeout(function () { toast("Picked up where you left off, using the progress saved in this file."); }, 400);
})();
